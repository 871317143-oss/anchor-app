<title>新框架·实验田</title><style>
/* finesse · register=h5 · morph=A.1-daily-desk · A=night-orchid-violet · B=liquid-glass-bento · C=dual-state-sheet · D=spring-follow · SOUL=6 SPECTACLE=4 DENSITY=5 */
:root{
 --ink:#262450;--ink2:#4a4670;--ink3:#827cab;
 --acc:#5f58b8;--acc-hi:#9d95e8;--amber:#a5761f;
 --glass:rgba(255,255,255,.56);--glass2:rgba(255,255,255,.62);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);overflow:hidden}
#phone{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:#16123a}
#phone::before{content:'';position:absolute;inset:0;background:url('assets/tree-scroll.jpg') center 100%/cover}
#phone::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(26,22,66,.10) 0%,rgba(26,22,66,0) 32%,rgba(216,206,243,.28) 100%)}

 body{background:radial-gradient(120% 90% at 50% 0%,#332c66 0%,#16123a 62%);display:flex;align-items:center;justify-content:center}
 #phone{width:406px;height:min(880px,94vh);border-radius:46px;border:1px solid rgba(255,255,255,.12);box-shadow:0 46px 120px -30px rgba(0,0,0,.85),0 0 0 10px #211b4a}
}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);border:1px solid var(--gbrd);box-shadow:var(--ghi),var(--gsh)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:#ece8f7}}
.diff{background:var(--diff)!important}
/* ---- 头部 ---- */
#hdr{position:absolute;top:0;left:0;right:0;z-index:3}
.st{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 20px 0;font-size:11px;color:var(--on-bg2)}
.st .ver{font-size:9px;opacity:.62;letter-spacing:.3px;margin-right:6px}

.hello .hi{font-weight:400;color:var(--on-bg2)}
.hello .av{width:40px;height:40px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.75);box-shadow:0 2px 10px rgba(26,22,66,.4);background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;position:relative;flex:none}

.sub{padding:6px 22px 10px;font-size:13px;color:var(--on-bg2)}
.sub b{color:#f0c8e8;font-weight:700}
/* ---- 双态卡片盘 ---- */
#board{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;overflow:hidden;will-change:transform}

.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.bc{min-height:118px;padding:14px 15px;border-radius:var(--r-lg);display:flex;flex-direction:column;cursor:pointer;transition:transform .16s var(--spring)}

.bc .t svg{width:13px;height:13px;stroke:var(--ink2);fill:none;stroke-width:1.6}
.bc .b{font-size:18px;font-weight:600;margin-top:auto}

.cbtn{width:34px;height:34px;border-radius:50%;background:var(--glass2);border:1px solid var(--gbrd);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}

.ai-greet{padding:6px 22px 2px;font-size:17px;font-weight:600}

.chip.on{background:var(--acc);color:#fff;border-color:transparent}
#aimsgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}

.m-u{align-self:flex-end;max-width:86%;background:#fff;border:1px solid var(--gbrd);border-radius:18px 18px 6px 18px;padding:10px 13px;font-size:13.5px;line-height:1.55;box-shadow:0 2px 10px rgba(38,32,80,.10)}

.m-st{align-self:flex-start;font-size:12px;color:var(--ink2);display:flex;gap:7px;align-items:center}
.m-st i{width:6px;height:6px;border-radius:50%;background:var(--acc-hi);animation:pl 1s infinite}

.acard{align-self:stretch;background:#fbf9fe;border:1px solid var(--gbrd);border-radius:20px;padding:13px 14px;box-shadow:0 6px 18px rgba(38,32,80,.12)}
.acard .ah{font-size:13px;font-weight:600;margin-bottom:6px}
.acard .op{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:13px;cursor:pointer;border-top:1px dashed rgba(74,70,112,.22)}
.acard .op .ck{width:19px;height:19px;border-radius:50%;border:1.5px solid rgba(74,70,112,.5);flex:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.acard .op .ck svg{width:11px;height:11px;stroke:transparent;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acard .op.on .ck{background:var(--dark);border-color:var(--dark)}
.acard .op.on .ck svg{stroke:#fff}
.acard .af{display:flex;align-items:center;margin-top:8px}
.acard .cnt{font-size:11.5px;color:var(--ink3)}
.acard .skp{margin-left:auto;font-size:12.5px;color:var(--ink2);padding:7px 10px;cursor:pointer}
.acard .ok{width:32px;height:32px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;cursor:pointer}
.acard .ok svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acard.done{opacity:.5;pointer-events:none}
#aicompose{flex:none;display:flex;align-items:center;gap:9px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.55)}
#aiwork{flex:none;display:none;align-items:center;gap:11px;padding:13px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.55)}
.orb{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 0deg,#e9b8e0,#9d95e8,#d4caf1,#f0d8a8,#e9b8e0);filter:blur(2px) saturate(1.25);animation:orb 1.8s linear infinite;flex:none}
@keyframes orb{to{transform:rotate(360deg)}}
#aiwork .wst{font-size:12.5px;color:var(--ink2)}
#aiwork .stop{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#aiwork .stop i{width:9px;height:9px;border-radius:2px;background:#fff}
/* ---- 全屏详情 ---- */
#mdim{position:absolute;inset:0;z-index:64;background:rgba(24,18,60,.45);opacity:0;transition:opacity .3s}
#modal{position:absolute;z-index:65;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;background:rgba(243,240,251,.8);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--gbrd);box-shadow:0 24px 60px rgba(24,18,60,.35)}
.mtop{flex:none;display:flex;align-items:center;gap:11px;padding:16px 18px 10px;cursor:grab;touch-action:none}
.mtop .xt{flex:1;min-width:0}

#modal .xbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#modal .xbody::-webkit-scrollbar{display:none}
.xback{width:36px;height:36px;border-radius:50%;background:var(--glass2);border:1px solid var(--gbrd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.xback svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.xt{flex:1;min-width:0}
.xt .h{font-size:22px;font-weight:700}
.xt .s{font-size:12px;color:var(--ink2);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 18px 4px}
.stat{background:var(--row);border:1px solid var(--gbrd);border-radius:var(--r-md);padding:13px 14px}
.stat .v{font-size:19px;font-weight:700}
.stat .k{font-size:10.5px;color:var(--ink3);margin-top:3px}
.enc{margin:12px 18px 2px;padding:13px 15px;background:var(--row);border:1px solid var(--gbrd);border-radius:var(--r-md);font-size:13px;line-height:1.65;color:var(--ink2)}
.wnext{padding:16px 18px 4px}
.wnext .wt{font-size:11px;color:var(--ink3);font-weight:500;padding-bottom:8px}
.wrow{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--row);border:1px solid var(--gbrd);border-radius:var(--r-md);margin-bottom:9px;cursor:pointer;transition:transform .15s var(--spring)}
.wrow:active{transform:scale(.97)}
.wrow .wi{width:34px;height:34px;border-radius:12px;background:rgba(95,88,184,.14);display:flex;align-items:center;justify-content:center;flex:none}
.wrow .wi svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrow .wn{font-size:13.5px;font-weight:600}
.wrow .ws{font-size:11px;color:var(--ink3);margin-top:1px}

.urow .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.urow .n{font-size:14px;font-weight:600}
.urow .tags{font-size:10px;color:var(--amber);margin-top:2px}
.urow .v{margin-left:auto;font-size:13px;font-weight:700;text-align:right;flex:none}
.urow .v small{display:block;font-weight:400;color:var(--ink3);font-size:10px}
.xchips{display:flex;gap:7px;padding:4px 18px 12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:36px 16px}

.xask svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round}
.sk{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:rgba(38,32,80,.92);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:90}
/* ---- 首幕电影层（上滑起飞+水波转场） ---- */
#bg2{position:absolute;inset:0;z-index:0;background:url('assets/tree-scroll.jpg') center 100%/cover;opacity:0}

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const ICO={

 check:'<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>',

 }else{dim.style.opacity='1';}
 md.querySelector('.mclose').onclick=()=>closeModal();
 dim.onclick=()=>closeModal();
 md.querySelector('.xask').onclick=()=>openAI();
 bindModalDrag(md);
}
function closeModal(instant){
 if(!_md)return;const {el,dim,card,r,tl,tt,tw,th}=_md;_md=null;
 const done=()=>{el.remove();dim.remove();card.style.visibility='';};
 if(instant||RM){done();return;}
 const pr=$('#phone').getBoundingClientRect();
 dim.style.opacity='0';
 el.style.transition='transform .34s cubic-bezier(.5,0,.75,0),opacity .24s';
 el.style.transform=`translate(${r.left-pr.left-tl}px,${r.top-pr.top-tt}px) scale(${r.width/tw},${r.height/th})`;
 el.style.opacity='0';
 setTimeout(done,360);
}
function bindModalDrag(md){
 const grip=md.querySelector('.mtop');let g=null;
 grip.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;g={y:e.touches[0].clientY,ly:e.touches[0].clientY,lt:performance.now(),v:0,d:false};},{passive:true});
 grip.addEventListener('touchmove',e=>{
  if(!g)return;const t=e.touches[0],dy=t.clientY-g.y,now=performance.now();
  g.v=0.45*g.v+0.55*((t.clientY-g.ly)/Math.max(1,now-g.lt));g.ly=t.clientY;g.lt=now;
  if(!g.d&&Math.abs(dy)>8)g.d=true;
  if(g.d&&dy>0){e.preventDefault();md.style.transition='none';md.style.transform=`translateY(${dy*0.9}px)`;md.style.opacity=String(Math.max(.4,1-dy/600));}
 },{passive:false});
 grip.addEventListener('touchend',()=>{
  if(!g)return;const gg=g;g=null;if(!gg.d)return;
  const dy=gg.ly-g.y;
  if(dy>120||gg.v>0.35){
   if(!_md)return;const m=_md;_md=null;
   m.dim.style.opacity='0';
   md.style.transition='transform .22s cubic-bezier(.5,0,.75,0),opacity .2s';
   md.style.opacity='0';md.style.transform=`translateY(${dy+180}px)`;
   setTimeout(()=>{md.remove();m.dim.remove();m.card.style.visibility='';},240);
  }else{md.style.transition='transform .3s cubic-bezier(.32,.72,.35,1),opacity .3s';md.style.transform='none';md.style.opacity='1';}
 });
}
const TIERS=['S','A','B','C','D','未评级'];
function tierOf(u){return u.t||'未评级';}
function urow(s,u,val,tag){
 return `<div class="urow" data-sec="${s}"><div class="av">${(u.n||'?')[0]}${u.av?`<img src="${u.av}" onerror="this.remove()">`:''}</div>
 <div><div class="n">${esc(u.n||'')}</div><div class="tags">${tag||''}</div></div>
 <div class="v">${val}</div></div>`;
}
function renderUsers(body){
 const counts={};Object.values(DATA.users).forEach(u=>{if(!u.mine)return;const t=tierOf(u);counts[t]=(counts[t]||0)+1;});
 if(!(counts[_curTier]>0))_curTier=TIERS.find(t=>counts[t]>0)||'S';
 const paint=()=>{
  const list=Object.entries(DATA.users).filter(([s,u])=>tierOf(u)===_curTier&&u.mine).sort((a,b)=>(b[1].sv||0)-(a[1].sv||0));
  body.innerHTML=`<div class="xchips">${TIERS.map(t=>`<span class="chip${t===_curTier?' on':''}" data-t="${t}">${t} ${counts[t]||0}</span>`).join('')}</div>`+
   (list.slice(0,40).map(([s,u])=>urow(s,u,`${yuan(u.sv)}<small>累计</small>`,[u.t?u.t+'级':'',u.bg!=null&&u.bg<=7?'🎂'+u.bg+'天':'',u.days>=30?'高陪伴':''].filter(Boolean).join(' · '))).join('')||'<div class="empty">该分级暂无用户</div>');
  body.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{_curTier=ch.dataset.t;paint();});
  body.querySelectorAll('.urow').forEach(r=>r.onclick=()=>toast('画像页整套搬迁在 backlog 第一位'));
 };
 paint();
}
function renderActions(body){
 const c=DATA.counts||{};
 const l3=(DATA.l3||[]).slice(0,8).map(s=>{const u=DATA.users[s];return u?urow(s,u,`${yuan(u.tv)}<small>本场</small>`,'L3 重点维护'):'';}).join('');
 const gr=(DATA.greet||[]).slice(0,6).map(s=>{const u=DATA.users[s];return u?urow(s,u,`${yuan(u.sv)}<small>给我</small>`,(u.t||'')+'级 · 主动问候'):'';}).join('');
 let bd='';const bl=(DATA.bday||[]).slice(0,3);
 if(bl.length)bd=bl.map(([s,d])=>{const u=DATA.users[s];return u?urow(s,u,`<small>${d===0?'今天':d+' 天后'}</small>`,'🎂 生日'):'';}).join('');
 body.innerHTML=(l3||gr||bd)||'<div class="empty">今天没有待办，清爽</div>';
 if(c.bday)body.innerHTML+=`<div class="enc">本周 ${c.bday} 位生日，开场提一句比什么都暖。</div>`;
}
function renderPerf(body){
 const p=PERF;
 if(!p){body.innerHTML='<div class="empty">业绩数据在路上，稍等片刻再进来</div>';fetchPerf();return;}
 const bp=Math.round((p.base_progress||0)*100);
 const enc=bp>=100?'保底达标线已拿下，后面每一场都是净赚——保持这个节奏。':bp>=50?'进度过半，稳稳的——下场再冲一把就摸线了。':'流水在稳步涨，把 L3 几位维护好，进度条会自己爬。';
 body.innerHTML=`<div class="stats">
  <div class="stat"><div class="v">${yuanW(p.month_income)}</div><div class="k">本月流水</div></div>
  <div class="stat"><div class="v">${bp}%</div><div class="k">保底进度（达标线=保底×4）</div></div>
  <div class="stat"><div class="v">${p.month_days||0} 天</div><div class="k">本月开播</div></div>
  <div class="stat"><div class="v">${p.last_income!=null?yuanW(p.last_income):'—'}</div><div class="k">上一场</div></div></div>
 <div class="enc">${enc}</div>`;
}
function renderApply(body){
 body.innerHTML=`<div class="wnext"><div class="wt">两个入口已在生产端上线</div>
 <div class="wrow" data-w="rest"><div class="wi">${ICO.cal}</div><div><div class="wn">申请休息</div><div class="ws">运营审批，同意当天不排妆发</div></div><div class="wr">›</div></div>
 <div class="wrow" data-w="pref"><div class="wi">${ICO.user}</div><div><div class="wn">我的意向老师</div><div class="ws">意向优先于师承，随时可改</div></div><div class="wr">›</div></div>
 <div class="wrow" data-w="advice"><div class="wi">${ICO.mail}</div><div><div class="wn">投诉与建议</div><div class="ws">直达运营，不留中间层</div></div><div class="wr">›</div></div></div>`;
 body.querySelectorAll('.wrow').forEach(r=>r.onclick=()=>toast('先去生产端「我的」页办理，回灌时整套搬进来'));
}
/* ===== 小梦 ===== */
function bootChips(){
 const chips=[['bday','今天谁过生日？'],['todo','我还没做的有几件？'],['top','昨天谁最挺我？']];
 $('#aiChips').innerHTML=chips.map(([k,t])=>`<span class="chip" data-q="${k}">${t}</span>`).join('');
 $('#aiChips').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ask(ch.textContent,ch.dataset.q);});
}
function openAI(){
 $('#aisheet').classList.add('on');
 if(!_aiBooted){_aiBooted=true;}
 setTimeout(()=>{if(!RM)$('#aiFld').focus();},380);
}
function closeAI(){$('#aisheet').classList.remove('on');}
$('#aibar').addEventListener('click',e=>{if(e.target.closest('#aiPlus')){toast('图片/语音输入：小梦本体接入后开放');return;}openAI();});
$('#aigrab').addEventListener('click',closeAI);
$('#aiPlus2').addEventListener('click',()=>toast('图片/语音输入：小梦本体接入后开放'));
$('#aiStop').addEventListener('click',()=>{working(false);pushA('好，先停在这。想继续随时说。');});
[['#aiFld','#aiSend','#aiMic']].forEach(([f,s,m])=>{
 const F=$(f),S=$(s),M=$(m);
 F.addEventListener('input',()=>{const has=F.value.trim().length>0;S.style.display=has?'flex':'none';M.style.display=has?'none':'flex';});
 F.addEventListener('keydown',e=>{if(e.key==='Enter'&&F.value.trim()){ask(F.value.trim(),'free');F.value='';F.dispatchEvent(new Event('input'));}});
 S.addEventListener('click',()=>{if(F.value.trim()){ask(F.value.trim(),'free');F.value='';F.dispatchEvent(new Event('input'));}});
});
$('#aiFldHome').addEventListener('click',openAI);
$('#aiMicHome').addEventListener('click',e=>{e.stopPropagation();toast('语音输入：小梦本体接入后开放');});
$('#aiSendHome').addEventListener('click',e=>{e.stopPropagation();openAI();});
function pushA(text,cb){
 const m=document.createElement('div');m.className='m-a';
 $('#aimsgs').appendChild(m);
 const done=()=>{if(cb)cb();$('#aimsgs').scrollTop=1e9;};
 if(RM){m.textContent=text;done();return;}
 let i=0;const tick=()=>{m.textContent=text.slice(0,++i);$('#aimsgs').scrollTop=1e9;if(i<text.length)setTimeout(tick,16);else done();};tick();
}
function pushU(text){const m=document.createElement('div');m.className='m-u';m.textContent=text;$('#aimsgs').appendChild(m);$('#aimsgs').scrollTop=1e9;}
function working(on,txt){
 $('#aicompose').style.display=on?'none':'flex';
 $('#aiwork').style.display=on?'flex':'none';
 if(txt)$('#aiWst').textContent=txt;
}
function answer(q){
 const c=DATA.counts||{};
 if(q==='bday'){
  const bl=(DATA.bday||[]).map(([s,d])=>{const u=DATA.users[s];return u?`${esc(u.n)}（${d===0?'今天':d+' 天后'}）`:'';}).filter(Boolean);
  return bl.length?`未来一周 ${bl.length} 位生日：${bl.join('、')}。生日当天开场提一句，比什么都暖。`:'未来一周没人过生日，省心——把精力放在 L3 维护上。';
 }
 if(q==='todo'){
  const n=(c.l3||0)+(c.l2||0)+(c.greet||0);
  const l3n=(DATA.l3||[]).slice(0,3).map(s=>{const u=DATA.users[s];return u?esc(u.n):'';}).filter(Boolean).join('、');
  return `还没做的 ${n} 件：L3 重点维护 ${c.l3||0}、L2 召回 ${c.l2||0}、主动问候 ${c.greet||0}。建议先清 L3${l3n?`——${l3n} 这几位今天必须落到`:''}。`;
 }
 if(q==='top'){
  const s=(DATA.l3||[])[0],u=s&&DATA.users[s];
  if(u)return `昨天最挺你的是 ${esc(u.n)}，本场 ${yuan(u.tv)}。开场先点名谢一句，别拖到下播。`;
  return '昨天榜单很平，没有冒尖的——稳稳播，维护好基本盘。';
 }
 return '这个问题小梦本体还在接（Worker 排期中）。先会三招，点上面三个快捷问题试试。';
}
function actionCard(){
 const items=['把相关用户拉进今日重点维护','开播前 1 小时提醒我复盘一遍','给 TA 备一句开场感谢'];
 const el=document.createElement('div');el.className='acard';
 el.innerHTML=`<div class="ah">下一步行动（可多选）</div>`+
  items.map(t=>`<div class="op"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg></div><div>${t}</div></div>`).join('')+
  `<div class="af"><span class="cnt">未选择</span><span class="skp">跳过</span><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>`;
 const ops=[...el.querySelectorAll('.op')],cnt=el.querySelector('.cnt');
 ops.forEach(op=>op.onclick=()=>{op.classList.toggle('on');const n=el.querySelectorAll('.op.on').length;cnt.textContent=n?`已选 ${n}`:'未选择';});
 el.querySelector('.skp').onclick=()=>{el.classList.add('done');cnt.textContent='已跳过';};
 el.querySelector('.ok').onclick=()=>{const n=el.querySelectorAll('.op.on').length;el.classList.add('done');cnt.textContent=n?`已记下 ${n} 项`:'已跳过';toast(n?'已记下（演示态，接通小梦后自动执行）':'好的');};
 $('#aimsgs').appendChild(el);$('#aimsgs').scrollTop=1e9;
}
let _asking=false;
function ask(text,q){
 if(_asking)return;_asking=true;
 pushU(text);
 working(true,'小梦在翻你的数据…');
 const steps=q==='free'?['小梦在翻你的数据…']:['正在翻你的榜单…','核对生日与待办…'];
 let i=0;const step=()=>{
  if(i<steps.length){working(true,steps[i++]);setTimeout(step,RM?60:620);}
  else{working(false);pushA(answer(q),()=>{actionCard();_asking=false;});}
 };step();
}
</script></body></html>
