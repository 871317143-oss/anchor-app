<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1a1c">
<title>梦华录 · 主播工作台</title><style>
/* finesse · register=h5 · A=wind-rain-water · B=no-card-editorial · C=stage-to-work-scrub · SOUL=7 SPECTACLE=6 DENSITY=3 */
:root{
 --ink:#e8f0ee;--ink2:#9fc3bb;--ink3:#5d7a76;
 --cyan:#9fc3bb;--gold:#c9a35c;--red:#d64f18;--water:#12262a;--night:#0d1a1c;
 --glass:rgba(255,255,255,.08);--gbrd:rgba(255,255,255,.22);
 --row:rgba(244,241,251,.07);
 --spring:cubic-bezier(.32,.72,.35,1);--ease-in:cubic-bezier(.5,0,.75,0);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:#081114;overflow:hidden}
#phone{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--night)}
#phone::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 100%,rgba(45,74,82,.5),transparent 60%),linear-gradient(180deg,#0d1a1c,#0a1518)}
#gl{position:absolute;inset:0;z-index:1;display:none;width:100%;height:100%}
#phone.gl-on #gl{display:block}
#phone.gl-on::before{display:none}
@media(min-width:560px){
 body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#16281f 0%,#0a1413 62%)}
 #phone{width:406px;height:min(880px,94vh);border-radius:46px;border:1px solid rgba(255,255,255,.1);box-shadow:0 46px 120px -30px rgba(0,0,0,.85),0 0 0 10px #16211f}
}
/* ---- 加载动画（B 款：整标水波浮现） ---- */
#loader{position:absolute;inset:0;z-index:95;background:linear-gradient(175deg,#101e22,#0c171a);display:flex;align-items:center;justify-content:center;transition:opacity .45s}
#loader.done{opacity:0;pointer-events:none}
#loader img{width:150px;opacity:0;filter:blur(10px);transform:scale(.86);animation:lem 1s cubic-bezier(.32,.72,.35,1) .12s forwards}
#loader .rp,#loader .rp2{position:absolute;width:150px;height:150px;border-radius:50%;opacity:0;transform:scale(.4)}
#loader .rp{border:1.5px solid rgba(159,195,187,.8);animation:lrp 1.1s cubic-bezier(.2,.6,.3,1) .3s forwards}
#loader .rp2{border:1px solid rgba(159,195,187,.4);animation:lrp 1.2s cubic-bezier(.2,.6,.3,1) .5s forwards}
@keyframes lem{60%{opacity:1;filter:blur(1.5px)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes lrp{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.4)}}
/* ---- 顶部状态带 ---- */
#stbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px;right:14px;z-index:20;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{font-size:10px;color:#fff;background:rgba(20,28,32,.5);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:99px;letter-spacing:.08em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill b{font-weight:600}
/* ---- 戏台 ---- */
#stage,#work,#rain,#stbar{touch-action:none}
#stage{position:absolute;inset:0;z-index:10;will-change:transform,opacity}
.vwin{position:relative;margin:calc(env(safe-area-inset-top) + 46px) 12px 0;height:66vh;min-height:480px;border-radius:26px;overflow:hidden;background:#16221f;
 border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 46px rgba(0,0,0,.45)}
.vwin video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vwin .dur{position:absolute;right:14px;bottom:12px;font-size:10px;color:rgba(255,255,255,.8);letter-spacing:.08em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hello{display:flex;align-items:center;gap:10px;padding:18px 24px 0;font-size:20px;color:var(--ink)}
.hello .hi{font-weight:400;color:var(--ink2)}
.hello .av{width:40px;height:40px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.7);background:#4a5d6a;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;position:relative;flex:none}
.hello .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hello .nm{font-size:18px;font-weight:500}
.hint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--ink2);letter-spacing:.15em;animation:ihint 1.9s ease-in-out infinite}
.hint b{display:block;width:34px;height:4px;border-radius:99px;background:rgba(159,195,187,.45);margin:0 auto 8px}
@keyframes ihint{50%{transform:translateY(5px);opacity:.55}}
/* ---- 雨幕与闪电 ---- */
#rain{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;overflow:hidden}
#rain i{position:absolute;top:-8%;width:1px;height:64px;background:linear-gradient(180deg,transparent,rgba(159,195,187,.6),transparent);animation:rfall .9s linear infinite}
@keyframes rfall{to{transform:translateY(1300%)}}
#flash{position:absolute;inset:0;z-index:16;background:#eaf4f2;opacity:0;pointer-events:none}
/* ---- 工作台（无卡 · 发丝线+留白） ---- */
#work{position:absolute;inset:0;z-index:11;padding-top:calc(env(safe-area-inset-top) + 48px);opacity:0;pointer-events:none;will-change:transform,opacity}
.sec{position:relative;padding:26px 26px 22px;cursor:pointer;transition:opacity .15s}
.sec:active{opacity:.55}
.sec .k{font-size:13px;color:var(--ink2);letter-spacing:.14em;margin-bottom:9px}
.sec .v{font-size:34px;font-weight:600;letter-spacing:.01em}
.sec .v.sm{font-size:22px;font-weight:500}
.sec .s{font-size:12px;color:var(--ink3);margin-top:8px}
.sec .go{position:absolute;right:26px;top:40px;font-size:20px;color:var(--ink3)}
.hr{height:1px;margin:0 26px;background:linear-gradient(90deg,rgba(159,195,187,.26),rgba(159,195,187,.05))}
.pbar{margin-top:14px;height:4px;width:62%;border-radius:99px;background:rgba(159,195,187,.18);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .8s var(--spring)}
.resv{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px}
.resv span{font-size:10px;color:rgba(159,195,187,.34);letter-spacing:.18em;cursor:pointer}
/* ---- 小梦胶囊 ---- */
#aibar{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:21;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:30px;background:rgba(30,42,46,.55);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);opacity:0;pointer-events:none}
.cbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid var(--gbrd);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.cbtn svg{width:15px;height:15px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cfld{flex:1;min-width:0;font-size:13.5px;color:var(--ink);background:transparent;border:0;outline:0;font-family:inherit}
.cfld::placeholder{color:var(--ink3)}
.cmic{width:34px;height:34px;border-radius:50%;background:transparent;border:0;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.cmic svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:1.6;stroke-linecap:round}
.csend{width:34px;height:34px;border-radius:50%;background:var(--ink);border:0;display:none;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.csend svg{width:15px;height:15px;stroke:var(--night);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---- 小梦问答层 ---- */
#aisheet{position:absolute;left:0;right:0;top:7%;bottom:0;z-index:70;border-radius:28px 28px 0 0;background:rgba(20,30,34,.78);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);border-top:1px solid var(--gbrd);box-shadow:0 -12px 40px rgba(0,0,0,.4);transform:translateY(103%);transition:transform .36s var(--spring);display:flex;flex-direction:column;overflow:hidden}
#aisheet.on{transform:none}
#aigrab{flex:none;padding:9px 0 3px;display:flex;justify-content:center;cursor:pointer}
#aigrab i{width:38px;height:4.5px;border-radius:99px;background:rgba(159,195,187,.4)}
.ai-greet{padding:6px 22px 2px;font-size:17px;font-weight:600}
.ai-sub{padding:3px 22px 8px;font-size:12px;color:var(--ink2)}
.chips{display:flex;gap:7px;padding:2px 22px 10px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--gbrd);color:var(--ink2);cursor:pointer;transition:transform .15s var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--cyan);color:var(--night);border-color:transparent}
#aimsgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#aimsgs::-webkit-scrollbar{display:none}
.m-u{align-self:flex-end;max-width:86%;background:rgba(255,255,255,.12);border:1px solid var(--gbrd);border-radius:18px 18px 6px 18px;padding:10px 13px;font-size:13.5px;line-height:1.55}
.m-a{align-self:flex-start;max-width:94%;font-size:13.5px;line-height:1.7;color:var(--ink);padding:2px}
.m-st{align-self:flex-start;font-size:12px;color:var(--ink2);display:flex;gap:7px;align-items:center}
.m-st i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.2}}
.acard{align-self:stretch;background:rgba(255,255,255,.06);border:1px solid var(--gbrd);border-radius:20px;padding:13px 14px}
.acard .ah{font-size:13px;font-weight:600;margin-bottom:6px}
.acard .op{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:13px;cursor:pointer;border-top:1px dashed rgba(159,195,187,.2)}
.acard .op .ck{width:19px;height:19px;border-radius:50%;border:1.5px solid rgba(159,195,187,.5);flex:none;display:flex;align-items:center;justify-content:center;transition:all .15s}
.acard .op .ck svg{width:11px;height:11px;stroke:transparent;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acard .op.on .ck{background:var(--ink);border-color:var(--ink)}
.acard .op.on .ck svg{stroke:var(--night)}
.acard .af{display:flex;align-items:center;margin-top:8px}
.acard .cnt{font-size:11.5px;color:var(--ink3)}
.acard .skp{margin-left:auto;font-size:12.5px;color:var(--ink2);padding:7px 10px;cursor:pointer}
.acard .ok{width:32px;height:32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.acard .ok svg{width:14px;height:14px;stroke:var(--night);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acard.done{opacity:.5;pointer-events:none}
#aicompose{flex:none;display:flex;align-items:center;gap:9px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12)}
#aiwork{flex:none;display:none;align-items:center;gap:11px;padding:13px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12)}
.orb{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 0deg,#9fc3bb,#c9a35c,#4a5d6a,#9fc3bb);filter:blur(2px) saturate(1.25);animation:orb 1.8s linear infinite;flex:none}
@keyframes orb{to{transform:rotate(360deg)}}
#aiwork .wst{font-size:12.5px;color:var(--ink2)}
#aiwork .stop{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#aiwork .stop i{width:9px;height:9px;border-radius:2px;background:var(--night)}
/* ---- 详情弹窗（Card-to-Modal） ---- */
#mdim{position:absolute;inset:0;z-index:64;background:rgba(5,12,14,.55);opacity:0;transition:opacity .3s}
#modal{position:absolute;z-index:65;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;background:rgba(24,36,40,.88);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--gbrd);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.mtop{flex:none;display:flex;align-items:center;gap:11px;padding:16px 18px 10px;cursor:grab;touch-action:none}
.mtop .xt{flex:1;min-width:0}
.mtop .h{font-size:22px;font-weight:700}
.mtop .s{font-size:12px;color:var(--ink2);margin-top:2px}
.xback{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid var(--gbrd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:13px;color:var(--ink2)}
#modal .xbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#modal .xbody::-webkit-scrollbar{display:none}
.xask{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom));margin:auto 16px 0;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:26px;font-size:13px;color:var(--ink3);cursor:pointer;flex:none;background:rgba(30,42,46,.7);border:1px solid var(--gbrd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.xask svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.7;stroke-linecap:round}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 18px 4px}
.stat{background:rgba(255,255,255,.06);border:1px solid var(--gbrd);border-radius:16px;padding:13px 14px}
.stat .v{font-size:19px;font-weight:700}
.stat .k{font-size:10.5px;color:var(--ink3);margin-top:3px}
.enc{margin:12px 18px 2px;padding:13px 15px;background:rgba(255,255,255,.05);border:1px solid var(--gbrd);border-radius:16px;font-size:13px;line-height:1.65;color:var(--ink2)}
.wnext{padding:16px 18px 4px}
.wnext .wt{font-size:11px;color:var(--ink3);font-weight:500;padding-bottom:8px}
.wrow{display:flex;align-items:center;gap:11px;padding:13px 14px;background:rgba(255,255,255,.05);border:1px solid var(--gbrd);border-radius:16px;margin-bottom:9px;cursor:pointer;transition:transform .15s var(--spring)}
.wrow:active{transform:scale(.97)}
.wrow .wi{width:34px;height:34px;border-radius:12px;background:rgba(159,195,187,.14);display:flex;align-items:center;justify-content:center;flex:none}
.wrow .wi svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrow .wn{font-size:13.5px;font-weight:600}
.wrow .ws{font-size:11px;color:var(--ink3);margin-top:1px}
.wrow .wr{margin-left:auto;color:var(--ink3);font-size:16px;flex:none}
.urow{display:flex;align-items:center;gap:11px;margin:0 16px 9px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--gbrd);border-radius:16px}
.urow .av{width:38px;height:38px;border-radius:50%;background:#4a5d6a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;overflow:hidden;flex:none}
.urow .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.urow .n{font-size:14px;font-weight:600}
.urow .tags{font-size:10px;color:var(--gold);margin-top:2px}
.urow .v{margin-left:auto;font-size:13px;font-weight:700;text-align:right;flex:none}
.urow .v small{display:block;font-weight:400;color:var(--ink3);font-size:10px}
.xchips{display:flex;gap:7px;padding:4px 18px 12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:36px 16px}
.sk{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:rgba(8,16,19,.92);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="phone">
 <canvas id="gl"></canvas>
 <div id="stbar"><span class="pill" id="pillDate">—</span><span class="pill"><b>v4.0.1</b> · 梦华录</span></div>

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const qs=new URLSearchParams(location.search),TOK=qs.get('t')||'';
let DATA=null,PERF=null,VIDEOS=[],_md=null,_curTier='S',_p=0,_landed=false,_sg=null,_flashed=false,_aiBooted=false;

function tsLoop(on){

   TS.waterMat.uniforms.uTime.value=tt;
   TS.clouds.forEach(sp=>{sp.position.x=sp.userData.ax+Math.sin(tt*.25+sp.userData.ph)*.3;});
   TS.fallP.forEach((o,i)=>{o.y-=o.f*dt;o.x+=Math.sin(tt*1.1+o.ph)*o.sw*dt;
    if(o.y<0.06){o.y=6+Math.random()*2.5;o.x=(Math.random()-.5)*8.5;o.z=-5+Math.random()*6.5;}
    TS.dummy.position.set(o.x,o.y,o.z);TS.dummy.rotation.set(tt*o.rs,o.ph+tt*0.7,o.ph*1.3+tt*0.4);TS.dummy.scale.set(o.s,o.s,o.s);TS.dummy.updateMatrix();TS.fall.setMatrixAt(i,TS.dummy.matrix);});
   TS.fall.instanceMatrix.needsUpdate=true;
   TS.fltP.forEach((o,i)=>{o.rz+=o.sp*dt;
    TS.dummy.position.set(o.x,0.035+Math.sin(tt*.9+o.ph)*.012,o.z);TS.dummy.rotation.set(-Math.PI/2,0,o.rz);TS.dummy.scale.set(o.s,o.s,o.s);TS.dummy.updateMatrix();TS.flt.setMatrixAt(i,TS.dummy.matrix);});
   TS.flt.instanceMatrix.needsUpdate=true;
   TS.renderer.render(TS.scene,TS.cam);};
  TS.raf=requestAnimationFrame(step);}
 else if(!on&&TS.rafOn){TS.rafOn=false;if(TS.raf)cancelAnimationFrame(TS.raf);TS.raf=0;}
}

function tweenTo(target){

function setupGestures(){

 },{capture:true,passive:true});
 ph.addEventListener('touchmove',e=>{
  if(!_sg)return;const t=e.touches[0],dy=t.clientY-_sg.y,now=performance.now();
  _sg.v=0.45*_sg.v+0.55*((t.clientY-_sg.ly)/Math.max(1,now-_sg.lt));_sg.ly=t.clientY;_sg.lt=now;
  if(!_sg.d){
   if(Math.abs(dy)<8)return;
   if(_p<0.97&&dy>0)_sg.d=true,_sg.dir='down';
   else if(_p>=0.97&&dy<0)_sg.d=true,_sg.dir='up';

  e.preventDefault();
  if(RM){tweenTo(_sg.dir==='down'?1:0);_sg=null;return;}
  setP(_sg.p0+dy/(ph.clientHeight*0.85));
 },{capture:true,passive:false});

 const p=PERF;
 if(!p){body.innerHTML='<div class="empty">业绩数据在路上，稍等片刻再进来</div>';return;}
 const bp=Math.round((p.base_progress||0)*100);
 const enc=bp>=100?'保底达标线已拿下，后面每一场都是净赚——保持这个节奏。':bp>=50?'进度过半，稳稳的——下场再冲一把就摸线了。':'流水在稳步涨，把 L3 几位维护好，进度条会自己爬。';
 body.innerHTML=`<div class="stats">
  <div class="stat"><div class="v">${yuanW(p.month_income)}</div><div class="k">本月流水</div></div>
  <div class="stat"><div class="v">${bp}%</div><div class="k">保底进度（达标线=保底×4）</div></div>
  <div class="stat"><div class="v">${p.month_days||0} 天</div><div class="k">本月开播</div></div>
  <div class="stat"><div class="v">${p.last_income!=null?yuanW(p.last_income):'—'}</div><div class="k">上一场</div></div></div>
 <div class="enc">${enc}</div>`;
}
function renderApply(body){
 body.innerHTML=`<div class="wnext"><div class="wt">两个入口已在生产端上线</div>
 <div class="wrow" data-w="rest"><div class="wi">${ICO.cal}</div><div><div class="wn">申请休息</div><div class="ws">运营审批，同意当天不排妆发</div></div><div class="wr">›</div></div>
 <div class="wrow" data-w="pref"><div class="wi">${ICO.user}</div><div><div class="wn">我的意向老师</div><div class="ws">意向优先于师承，随时可改</div></div><div class="wr">›</div></div>
 <div class="wrow" data-w="advice"><div class="wi">${ICO.mail}</div><div><div class="wn">投诉与建议</div><div class="ws">直达运营，不留中间层</div></div><div class="wr">›</div></div></div>`;
 body.querySelectorAll('.wrow').forEach(r=>r.onclick=()=>toast('先去生产端「我的」页办理，回灌时整套搬进来'));
}
/* ===== 小梦 ===== */
function bootChips(){
 const chips=[['bday','今天谁过生日？'],['todo','我还没做的有几件？'],['top','昨天谁最挺我？']];
 $('#aiChips').innerHTML=chips.map(([k,t])=>`<span class="chip" data-q="${k}">${t}</span>`).join('');
 $('#aiChips').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ask(ch.textContent,ch.dataset.q);});
 const a=DATA.anchor;$('#aiGreet').textContent=`${a.name||''}，今天我能帮你什么？`;
}
function openAI(){
 $('#aisheet').classList.add('on');
 setTimeout(()=>{if(!RM)$('#aiFld2').focus();},380);
}
function closeAI(){$('#aisheet').classList.remove('on');}
$('#aibar').addEventListener('click',e=>{if(e.target.closest('#aiPlus')){toast('图片/语音输入：小梦本体接入后开放');return;}openAI();});
$('#aigrab').addEventListener('click',closeAI);
$('#aiPlus2').addEventListener('click',()=>toast('图片/语音输入：小梦本体接入后开放'));
$('#aiStop').addEventListener('click',()=>{working(false);pushA('好，先停在这。想继续随时说。');});
[['#aiFld2','#aiSend2','#aiMic2']].forEach(([f,s,m])=>{
 const F=$(f),S=$(s),M=$(m);
 F.addEventListener('input',()=>{const has=F.value.trim().length>0;S.style.display=has?'flex':'none';M.style.display=has?'none':'flex';});
 F.addEventListener('keydown',e=>{if(e.key==='Enter'&&F.value.trim()){ask(F.value.trim(),'free');F.value='';F.dispatchEvent(new Event('input'));}});
 S.addEventListener('click',()=>{if(F.value.trim()){ask(F.value.trim(),'free');F.value='';F.dispatchEvent(new Event('input'));}});
});
function pushA(text,cb){
 const m=document.createElement('div');m.className='m-a';
 $('#aimsgs').appendChild(m);
 const done=()=>{if(cb)cb();$('#aimsgs').scrollTop=1e9;};
 if(RM){m.textContent=text;done();return;}
 let i=0;const tick=()=>{m.textContent=text.slice(0,++i);$('#aimsgs').scrollTop=1e9;if(i<text.length)setTimeout(tick,16);else done();};tick();
}
function pushU(text){const m=document.createElement('div');m.className='m-u';m.textContent=text;$('#aimsgs').appendChild(m);$('#aimsgs').scrollTop=1e9;}
function working(on,txt){
 $('#aicompose').style.display=on?'none':'flex';
 $('#aiwork').style.display=on?'flex':'none';
 if(txt)$('#aiWst').textContent=txt;
}
function answer(q){
 const c=DATA.counts||{};
 if(q==='bday'){
  const bl=(DATA.bday||[]).map(([s,d])=>{const u=DATA.users[s];return u?`${esc(u.n)}（${d===0?'今天':d+' 天后'}）`:'';}).filter(Boolean);
  return bl.length?`未来一周 ${bl.length} 位生日：${bl.join('、')}。生日当天开场提一句，比什么都暖。`:'未来一周没人过生日，省心——把精力放在 L3 维护上。';
 }
 if(q==='todo'){
  const n=(c.l3||0)+(c.l2||0)+(c.greet||0);
  const l3n=(DATA.l3||[]).slice(0,3).map(s=>{const u=DATA.users[s];return u?esc(u.n):'';}).filter(Boolean).join('、');
  return `还没做的 ${n} 件：L3 重点维护 ${c.l3||0}、L2 召回 ${c.l2||0}、主动问候 ${c.greet||0}。建议先清 L3${l3n?`——${l3n} 这几位今天必须落到`:''}。`;
 }
 if(q==='top'){
  const s=(DATA.l3||[])[0],u=s&&DATA.users[s];
  if(u)return `昨天最挺你的是 ${esc(u.n)}，本场 ${yuan(u.tv)}。开场先点名谢一句，别拖到下播。`;
  return '昨天榜单很平，没有冒尖的——稳稳播，维护好基本盘。';
 }
 return '这个问题小梦本体还在接（Worker 排期中）。先会三招，点上面三个快捷问题试试。';
}
function actionCard(){
 const items=['把相关用户拉进今日重点维护','开播前 1 小时提醒我复盘一遍','给 TA 备一句开场感谢'];
 const el=document.createElement('div');el.className='acard';
 el.innerHTML=`<div class="ah">下一步行动（可多选）</div>`+
  items.map(t=>`<div class="op"><div class="ck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg></div><div>${t}</div></div>`).join('')+
  `<div class="af"><span class="cnt">未选择</span><span class="skp">跳过</span><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>`;
 const ops=[...el.querySelectorAll('.op')],cnt=el.querySelector('.cnt');
 ops.forEach(op=>op.onclick=()=>{op.classList.toggle('on');const n=el.querySelectorAll('.op.on').length;cnt.textContent=n?`已选 ${n}`:'未选择';});
 el.querySelector('.skp').onclick=()=>{el.classList.add('done');cnt.textContent='已跳过';};
 el.querySelector('.ok').onclick=()=>{const n=el.querySelectorAll('.op.on').length;el.classList.add('done');cnt.textContent=n?`已记下 ${n} 项`:'已跳过';toast(n?'已记下（演示态，接通小梦后自动执行）':'好的');};
 $('#aimsgs').appendChild(el);$('#aimsgs').scrollTop=1e9;
}
let _asking=false;
function ask(text,q){
 if(_asking)return;_asking=true;
 pushU(text);
 working(true,'小梦在翻你的数据…');
 const steps=q==='free'?['小梦在翻你的数据…']:['正在翻你的榜单…','核对生日与待办…'];
 let i=0;const step=()=>{
  if(i<steps.length){working(true,steps[i++]);setTimeout(step,RM?60:620);}
  else{working(false);pushA(answer(q),()=>{actionCard();_asking=false;});}
 };step();
}
/* ===== 诊断行 ===== */
function diagLine(){
 if(qs.get('diag')!=='1')return;
 let el=$('#diag');if(!el){el=document.createElement('div');el.id='diag';el.style.cssText='position:absolute;top:calc(env(safe-area-inset-top) + 38px);left:12px;z-index:99;font-size:10px;color:#fff;background:rgba(20,24,44,.6);padding:4px 9px;border-radius:8px;pointer-events:none';$('#phone').appendChild(el);}
 let gl2=false;try{const c=document.createElement('canvas');gl2=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){}
 const phase=_p<0.05?'戏台':(_p>0.95?'工作台':'过渡');
 el.textContent=`diag · RM:${RM?'开':'关'} · WebGL:${gl2?'可用':'失败'} · 场景:${TS===false?'兜底':(TS?'3D':'…')} · ${phase} p:${_p.toFixed(2)}${window.__tsErr?' · err:'+String(window.__tsErr).slice(0,80):''}`;
}
setupGestures();
</script></body></html>
