<style>
/* 运营工作台 v3.0（2026-10-04）：设计规范 v1 落地（技能库/anchor-app/references/design-system.md） */
:root{
  --ink:#1d2817;--ink2:#4a5a42;--ink3:#8a957e;
  --on-bg:#eef3e4;--on-bg2:#b3bfa6;--on-bg3:#79856c;
  --bg:#2f412c;--card:#f7f9f0;--card2:#e9f3d2;--line:#dde6cb;
  --brand:#33462c;--brand-soft:#e4f0c9;--lime:#c9ec5a;
  --red:#d64f18;--red-bg:#f6d9c6;--blue:#4f6f63;--blue-bg:#dce8d6;
  --green:#5a8a2e;--green-bg:#e2f0c6;--amber:#a5760f;--amber-bg:#f3e5b8;
  --gray:#75816b;--gray-bg:#e6ecd4;
  --spring-settle:cubic-bezier(.32,.72,.35,1);
  --spring-bounce:cubic-bezier(.3,.9,.35,1.12);
}
@supports (animation-timing-function:linear(0,1)){
 :root{--spring-settle:linear(0.0,0.0058,0.0217,0.0459,0.0768,0.1129,0.153,0.1958,0.2406,0.2864,0.3326,0.3786,0.424,0.4682,0.5111,0.5523,0.5917,0.6291,0.6644,0.6977,0.7288,0.7578,0.7847,0.8095,0.8323,0.8533,0.8724,0.8897,0.9054,0.9196,0.9323,0.9437,0.9538,0.9627,0.9706,0.9775,0.9835,0.9887,0.9931,0.9969,1.0001);}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:linear-gradient(180deg,#a8c6aa 0%,#536652 100%);color:var(--ink);display:flex;justify-content:center;min-height:100vh;touch-action:pan-x pan-y;}
#phone{width:100%;max-width:414px;background:radial-gradient(130% 55% at 50% 0%,#42573a 0%,#32452d 45%,#22301e 100%);min-height:100vh;position:relative;
  box-shadow:0 0 40px rgba(20,30,18,.35);padding-bottom:92px;}
@media(min-width:480px){#phone{min-height:880px;margin:24px 0;border-radius:28px;overflow:hidden;}}
.topbar{background:transparent;color:var(--on-bg);padding:calc(20px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;gap:12px;}
.avatar{width:46px;height:46px;border-radius:50%;background:#4f6b43;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none;}
.topbar .name{font-size:24px;font-weight:800;letter-spacing:.5px;}
.topbar .meta{font-size:12px;color:var(--on-bg2);margin-top:4px;}
.topbar .rf{margin-left:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);color:var(--on-bg);border-radius:999px;padding:8px 15px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.bellf{position:fixed;top:calc(10px + env(safe-area-inset-top));right:max(12px,calc(50% - 195px));z-index:35;width:38px;height:38px;border-radius:50%;background:rgba(28,41,26,.55);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(20,30,18,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on-bg);padding:0;font-family:inherit;}

.ncard{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(20,30,18,.07);transition:opacity .25s,transform .25s var(--spring-settle);}
.ncard.alert{border-left:4px solid var(--red);}

.ncard.read{opacity:.45;}
.nc-ico{font-size:18px;flex:none;margin-top:1px;}

/* v3.15 顶部横幅堆叠（iOS 风） */
.nstack{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92%,390px);z-index:90;pointer-events:none;}
.nban{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:rgba(28,41,26,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.16);color:var(--on-bg);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(15,25,15,.35);margin-bottom:8px;transform-origin:top center;animation:nbanIn .34s var(--spring-settle) both;cursor:pointer;}
@keyframes nbanIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
.nban.out{transition:transform .22s ease,opacity .22s;transform:translateY(-16px);opacity:0;}

.wrap{padding:0 16px;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px;}
.sec-title h3{font-size:20px;font-weight:800;color:var(--on-bg);}
.sec-title .more{font-size:12px;color:var(--on-bg3);}
.tier{background:var(--card);border-radius:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(20,30,18,.08);overflow:hidden;}
.t-head{display:flex;align-items:center;gap:11px;padding:16px;}
.t-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;}
.t-name{font-size:16px;font-weight:700;}
.t-sub{font-size:12px;color:var(--ink3);margin-top:2px;}
.t-cnt{margin-left:auto;font-size:16px;font-weight:800;}

.urow{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;transition:transform .12s ease;}
.urow:active{transform:scale(.98);}
.urow .avatar{width:36px;height:36px;font-size:14px;}
.urow .u-val{font-size:13px;color:var(--ink);font-weight:700;flex:none;}
.u-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.u-line1{display:flex;align-items:baseline;gap:8px;}
.u-nick{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.u-t{font-size:11px;color:var(--ink3);flex:none;}
.u-note{font-size:12px;color:var(--ink2);line-height:1.5;word-break:break-all;}
.u-tags{display:flex;flex-wrap:wrap;gap:5px;}
.u-tags:empty{display:none;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:7px;line-height:1;}
.t-green{color:var(--green);background:var(--green-bg);}.t-blue{color:var(--blue);background:var(--blue-bg);}
.t-red{color:var(--red);background:var(--red-bg);}.t-amber{color:var(--amber);background:var(--amber-bg);}
.t-gray{color:var(--gray);background:var(--gray-bg);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 2px 12px;}
.chip{font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--gray-bg);color:var(--ink2);cursor:pointer;border:1px solid transparent;user-select:none;}
.chip.on{background:var(--lime);color:#223014;}
.todo{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(20,30,18,.08);border-left:4px solid var(--amber);}
.todo .who{font-size:16px;font-weight:700;}
.todo .meta{font-size:11px;color:var(--ink3);margin:4px 0 8px;}
.todo .txt{font-size:13px;color:var(--ink2);line-height:1.6;background:var(--gray-bg);border-radius:12px;padding:10px 12px;margin-bottom:10px;word-break:break-word;}
.todo .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{border:none;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;transition:transform .12s ease;}
.btn:active{transform:scale(.94);}
.btn.ok{background:var(--green);}
.btn.no{background:var(--gray-bg);color:var(--red);}
.btn.big{display:block;width:100%;padding:15px;font-size:15px;background:var(--lime);color:#223014;border-radius:14px;font-weight:700;}
.todo select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;max-width:150px;color:var(--ink);}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 16px;line-height:1.7;}
.foot{text-align:center;color:var(--on-bg3);font-size:11px;padding:20px 0 6px;}
.mrow{display:flex;align-items:center;gap:11px;padding:15px 16px;border-top:1px solid var(--line);font-size:14px;font-weight:500;}
.mrow:first-of-type{border-top:none;}
.mrow .mi{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;background:var(--brand-soft);color:var(--brand);}
.mrow .ms{margin-left:auto;font-size:11px;color:var(--ink3);}
.mrow.dim{opacity:.55;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:30px 24px;box-shadow:0 6px 26px rgba(0,0,0,.25);text-align:center;}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.login-title{font-size:19px;font-weight:800;}
.login-sub{font-size:13px;color:var(--ink3);margin:6px 0 18px;}
.login-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;text-align:center;background:#fff;color:var(--ink);}
.login-input:focus{border-color:var(--brand);}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}
#toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%) translateY(16px);background:rgba(26,36,22,.95);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:60;}
.view{display:none;}.view.show{display:block;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:414px;background:rgba(28,41,26,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:9px 0 calc(11px + env(safe-area-inset-bottom));z-index:30;}
.tabbar .tb{flex:1;text-align:center;font-size:11px;color:var(--on-bg3);background:none;border:none;cursor:pointer;font-family:inherit;transition:transform .12s ease;position:relative;}
.tabbar .tb:active{transform:scale(.94);}
.tabbar .tb svg{margin:0 auto 3px;display:block;}
.tabbar .tb.on{color:var(--lime);font-weight:600;}
.bdg{position:absolute;top:-2px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.show .wrap>*{animation:riseIn .38s cubic-bezier(.22,.9,.3,1) both;}
.view.show .wrap>*:nth-child(2){animation-delay:.05s}
.view.show .wrap>*:nth-child(3){animation-delay:.1s}
.view.show .wrap>*:nth-child(4){animation-delay:.15s}
.view.show .wrap>*:nth-child(5){animation-delay:.2s}
.view.show .wrap>*:nth-child(6){animation-delay:.25s}
.sk-top{height:78px;margin:24px 20px 0;border-radius:20px;}
.sk-card{height:190px;margin:20px 16px 0;border-radius:20px;}
.sk{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%);background-size:220% 100%;animation:skmove 1.15s linear infinite;}
@keyframes skmove{from{background-position:170% 0}to{background-position:-70% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
/* 运营备注弹窗（v3.1） */
.nov{position:fixed;inset:0;background:rgba(20,28,18,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.noc{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:414px;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .3s cubic-bezier(.22,.9,.3,1) both;}

/* 人员详情 v3.12：用户行左滑备注 + 用户画像对齐主播版 */
.urow-wrap{position:relative;overflow:hidden;}
.urow-acts{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;padding-right:14px;}

.pgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);}

<div id="phone"><div id="root"><div class="sk sk-top"></div><div class="sk sk-card"></div><div class="sk sk-card" style="height:150px"></div></div></div>
<div id="toast"></div>
<script>
const SUMMARY_URL='https://fb.menghualu.com.co/api/ops/summary';
const REVIEW_URL='https://fb.menghualu.com.co/api/ops/review';
const OPS_VERSION='v3.30';
const root=document.getElementById('root');
let D=null, _af='', _tf='', _tab='proj', _rowMeta={};
const name2team={};
const teamOf=n=>name2team[n]||'';
const inT=n=>!_tf||teamOf(n)===_tf;
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function colorOf(s){const cs=['#55704a','#43604a','#6b7a3d','#7a6440','#4a6b5a','#5d7a43','#6f5a45','#3f5a3e'];let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return cs[h%cs.length];}
function storedToken(){return localStorage.getItem('ops_token')||'';}
let _tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';clearTimeout(_tt);_tt=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(16px)';},1900);}
function showLogin(err){
 root.innerHTML=`<div class="login-wrap"><div class="login-card">
  <img src="assets/logo-black.png" alt="梦华录" style="width:118px;height:auto;display:block;margin:0 auto 8px;">
  <div class="login-title">梦华录 · 运营工作台</div>
  <div class="login-sub">请输入运营访问码</div>
  <input id="loginCode" class="login-input" type="text" autocapitalize="off" autocomplete="off" placeholder="粘贴访问码">
  <button id="loginBtn" class="btn big" style="margin-top:10px">进入</button>

let _d1Notifs=[],_ncShowRead=false;
function loadD1Notifs(){pollNotifs(true);setInterval(()=>pollNotifs(false),60000);

function pollNotifs(first){
 fetch('https://fb.menghualu.com.co/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:storedToken(),include_read:true})})
 .then(r=>r.json()).then(d=>{
  if(!d.ok)return;
  const fresh=d.messages||[];
  if(!first){const known=new Set(_d1Notifs.map(m=>m.id));
   fresh.filter(m=>!m.read&&!known.has(m.id)).forEach(m=>{pushBanner({kind:m.kind,level:m.level,title:m.title,body:m.body,ref:m.ref_sec,time:'现在'});
    // v3.17：采集完成 → 自动重拉团经营/业绩/按钮状态，运营不用手动刷
    if(m.kind==='offair_done'){setTimeout(()=>{if(!overlayOpen())load(storedToken());},3000);}});}
  _d1Notifs=fresh;updateNotifBadge();
 }).catch(()=>{});}

function updateNotifBadge(){const b=document.getElementById('notifBdg');if(b){const n=_d1Notifs.filter(m=>!m.read).length;b.textContent=n>99?'99+':n;b.style.display=n?'flex':'none';}}
const NICO={review_result:'✅',appeal_result:'🧭',nr_alert:'🔴',offair_done:'📦',data_updated:'🔄',bday:'🎂',cross:'🌐',returned:'💫',ops_note:'📝'};
function openNotif(){
 const ov=document.createElement('div');ov.className='nov';ov.style.alignItems='stretch';
 ov.innerHTML=`<div class="noc" style="height:100%;border-radius:0;padding:calc(14px + env(safe-area-inset-top)) 0 0;overflow-y:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px">
   <span data-x="1" style="color:var(--brand);font-weight:700;font-size:15px;cursor:pointer">‹ 返回</span>
   <span style="color:var(--ink3);font-size:12px">右滑返回 · 通知中心</span></div>
  <div style="padding:0 16px" id="ncBody"></div></div>`;
 ov.addEventListener('click',e=>{
  if(e.target===ov||e.target.closest('[data-x]')){ov.remove();return;}
  const nr=e.target.closest('[data-nr]');if(nr){readNotif(nr.dataset.nr);return;}
  if(e.target.closest('[data-nall]')){readAllNotifs();return;}
  if(e.target.closest('[data-ntoggle]')){_ncShowRead=!_ncShowRead;renderNotifBody();return;}
  const nsec=e.target.closest('[data-nsec]');if(nsec){ov.remove();switchTab('people');return;}
 });
 document.getElementById('phone').appendChild(ov);
 renderNotifBody();}
function renderNotifBody(){
 const el=document.getElementById('ncBody');if(!el)return;
 const actions=`<div class="nc-actions"><button class="tf" data-nall="1">全部已读</button><button class="tf${_ncShowRead?' on':''}" data-ntoggle="1">${_ncShowRead?'隐藏已读':'显示已读'}</button></div>`;
 const list=_ncShowRead?_d1Notifs:_d1Notifs.filter(m=>!m.read);
 if(!list.length){el.innerHTML=actions+`<div class="empty">没有未读通知 🎉<br>未回复介入、采集完成会出现在这里</div>`;return;}
 const today=new Date().toISOString().slice(5,10);
 const g1=list.filter(m=>(m.created_at||'').slice(5,10)===today),g2=list.filter(m=>(m.created_at||'').slice(5,10)!==today);
 const card=m=>`<div class="ncard ${m.level}${m.read?' read':''}">
  <div class="nc-ico">${NICO[m.kind]||'🔔'}</div>
  <div class="nc-main"><div class="nc-t">${esc(m.title)}</div><div class="nc-b">${esc(m.body)}</div><div class="nc-time">${(m.created_at||'').slice(5,16)}</div></div>
  ${m.kind==='nr_alert'?`<button class="nc-go" data-nsec="1">去人员</button>`:''}
  ${!m.read?`<button class="nc-read" data-nr="${m.id}">已读</button>`:''}</div>`;
 el.innerHTML=actions+(g1.length?`<div class="nc-group">今天</div>`+g1.map(card).join(''):'')+(g2.length?`<div class="nc-group">更早</div>`+g2.map(card).join(''):'');
}
function readNotif(id){
 fetch('https://fb.menghualu.com.co/api/messages/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:storedToken(),id})}).catch(()=>{});
 const m=_d1Notifs.find(x=>String(x.id)===String(id));if(m)m.read=1;renderNotifBody();updateNotifBadge();}
function readAllNotifs(){
 fetch('https://fb.menghualu.com.co/api/messages/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:storedToken(),all:true})}).catch(()=>{});
 _d1Notifs.forEach(m=>m.read=1);renderNotifBody();updateNotifBadge();}

function openOpNote(sec){
 const m=_rowMeta[sec]||{};
 const ov=document.createElement('div');ov.className='nov';
 ov.innerHTML=`<div class="noc"><div class="not">运营备注 · ${esc(m.nick||('sec…'+sec.slice(-6)))}</div>
  <textarea id="noTa" rows="4" placeholder="写点只有运营能看的备注…">${esc(m.op||'')}</textarea>
  <div class="noa"><button class="btn no" id="noX">取消</button><button class="btn big" id="noGo">保存</button></div></div>`;
 ov.addEventListener('click',e=>{if(e.target===ov||e.target.id==='noX')ov.remove();});
 document.getElementById('phone').appendChild(ov);
 document.getElementById('noGo').onclick=async()=>{
  const note=document.getElementById('noTa').value.trim();
  const btn=document.getElementById('noGo');btn.disabled=true;btn.textContent='保存中…';
  try{const r=await fetch('https://fb.menghualu.com.co/api/ops/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:storedToken(),sec,note})});
   const d=await r.json().catch(()=>({}));
   if(!r.ok||!d.ok)throw new Error(d.error||'保存失败');
   if(_rowMeta[sec])_rowMeta[sec].op=note;
   toast('已保存，主播画像页可见');ov.remove();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='保存';}};}

/* v3.12 手势：覆盖层右滑跟手返回（人员详情/用户画像/备注弹窗通用）；用户行左滑出备注钮 */
let _og=null;
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 if(e.target&&e.target.closest&&e.target.closest('.urow-wrap,input,textarea,select')){_og=null;return;}
 const top=[...document.querySelectorAll('.nov')].filter(x=>x.isConnected).pop();
 _og=top?{el:top,x:e.touches[0].clientX,y:e.touches[0].clientY,m:0}:null;
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!_og)return;const t=e.touches[0];const dx=t.clientX-_og.x,dy=t.clientY-_og.y;
 if(Math.abs(dy)>Math.abs(dx)*1.2){_og=null;return;}
 if(dx>0){if(dx>8)e.preventDefault();_og.el.style.transition='none';_og.el.style.transform='translateX('+dx+'px)';_og.m=1;}
},{passive:false});
document.addEventListener('touchend',e=>{
 if(!_og)return;const og=_og;_og=null;
 if(!og.m)return;
 const dx=e.changedTouches[0].clientX-og.x;
 og.el.style.transition='transform .33s var(--spring-settle)';
 if(dx>window.innerWidth*0.28){og.el.style.transform='translateX(110%)';setTimeout(()=>og.el.remove(),280);}
 else og.el.style.transform='translateX(0)';
 setTimeout(()=>{if(og.el.isConnected){og.el.style.transform='';og.el.style.transition='';}},400);
},{passive:true});
let _ors=null;const ORW=96;
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 const rw=e.target&&e.target.closest?e.target.closest('.urow[data-u]'):null;
 const inActs=e.target&&e.target.closest?e.target.closest('.urow-acts'):null;
 if(!inActs)document.querySelectorAll('.urow-wrap.open').forEach(w=>{if(!rw||w!==rw.parentElement)w.classList.remove('open');});
 if(!rw){_ors=null;return;}
 const t=e.touches[0];_ors={row:rw,wrap:rw.parentElement,x:t.clientX,y:t.clientY,hor:0};
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!_ors||!e.touches.length)return;const t=e.touches[0];
 const dx=t.clientX-_ors.x,dy=t.clientY-_ors.y;
 if(!_ors.hor){if(Math.abs(dy)>Math.abs(dx)*1.2){_ors=null;return;}if(Math.abs(dx)<8)return;_ors.hor=1;}
 e.preventDefault();
 const base=_ors.wrap.classList.contains('open')?-ORW:0;
 const nx=Math.max(-ORW,Math.min(0,base+dx));
 _ors.row.style.transition='none';_ors.row.style.transform='translateX('+nx+'px)';
},{passive:false});
document.addEventListener('touchend',e=>{
 if(!_ors)return;const rs=_ors;_ors=null;
 if(!rs.hor){rs.row.style.transform='';rs.row.style.transition='';return;}
 const m=(rs.row.style.transform||'').match(/-?[\d.]+/);const cur=m?parseFloat(m[0]):0;
 rs.row.style.transform='';rs.row.style.transition='';
 if(cur<-ORW/2)rs.wrap.classList.add('open');else rs.wrap.classList.remove('open');
},{passive:true});

const TABS=['proj','people','todo','flow','admin'];

 TABS.forEach(x=>{const v=document.getElementById('v-'+x);if(v)v.classList.toggle('show',x===t);});
 document.querySelectorAll('.tabbar .tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));}

 people:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.7c3 .3 5.4 2.1 5.4 5.3"/></svg>',
 todo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>',
 flow:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 rel:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>',
 admin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.2a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.2a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1h.2a2 2 0 110 4h-.2a1.7 1.7 0 00-1.5 1z"/></svg>'};
function tabbar(todoN){return `<div class="tabbar">
 <button class="tb${_tab==='proj'?' on':''}" data-tab="proj">${TB_ICONS.proj}项目</button>
 <button class="tb${_tab==='people'?' on':''}" data-tab="people">${TB_ICONS.people}人员</button>
 <button class="tb${_tab==='todo'?' on':''}" data-tab="todo">${TB_ICONS.todo}审批${todoN?`<span class="bdg">${todoN}</span>`:''}</button>
 <button class="tb${_tab==='flow'?' on':''}" data-tab="flow">${TB_ICONS.flow}回传明细</button>
 <button class="tb${_tab==='admin'?' on':''}" data-tab="admin">${TB_ICONS.admin}管理</button></div>`;}

function render(){
 const ph=document.getElementById('phone');
 if(!document.getElementById('bellf')){ph.insertAdjacentHTML('beforeend',BELLF);document.getElementById('bellf').onclick=()=>openNotif();}
 Object.keys(name2team).forEach(k=>delete name2team[k]);(D.anchors||[]).forEach(a=>name2team[a.name]=a.team);
 _rowMeta={};(D.subs||[]).concat(D.flags||[],D.status||[],D.appeals||[],D.grades||[]).forEach(x=>{if(x.sec)_rowMeta[x.sec]={nick:nameOf(x),op:x.op||''};});
 const todoN=(D.grades||[]).filter(g=>inT(g.anchor)).length+(D.appeals||[]).filter(g=>inT(g.anchor)).length;
 root.innerHTML=`<div class="topbar"><div class="avatar" style="background:transparent"><img src="assets/logo-white.png" alt="梦华录" style="width:34px;height:auto;display:block"></div><div><div class="name">运营工作台</div>
  <div class="meta">${esc(D.scope||'运营')} · ${(()=>{const ti=Object.values(D.teams||{}).reduce((s,t)=>s+(t.today.income||0),0),yi=Object.values(D.teams||{}).reduce((s,t)=>s+(t.yesterday.income||0),0);return ti>0?`<b style="color:var(--lime)">今日 ¥${fmtM(ti)}</b>`:(yi>0?`昨日 ¥${fmtM(yi)}`:'今日未开');})()} · 实时数据</div></div>
  <button class="rf" id="rf">刷新</button></div>
 <div class="view" id="v-proj">${vProj()}</div>
 <div class="view" id="v-todo">${vTodo()}</div>
 <div class="view" id="v-flow">${vFlow()}</div>
 <div class="view" id="v-people">${vPeople()}</div>
 <div class="view" id="v-admin">${vAdmin()}</div>${tabbar(todoN)}`;
 switchTab(_tab);
 document.getElementById('rf').onclick=()=>load(storedToken());
 const lo=document.getElementById('logoutBtn');if(lo)lo.onclick=()=>{if(confirm('退出当前运营账号？')){localStorage.removeItem('ops_token');location.reload();}};
 document.querySelectorAll('[data-af]').forEach(c=>c.onclick=()=>{_af=c.dataset.af;render();});
 document.querySelectorAll('[data-tf]').forEach(c=>c.onclick=()=>{_tf=c.dataset.tf;_af='';render();});
 document.querySelectorAll('[data-oa]').forEach(b=>b.onclick=()=>offair(b.dataset.oa,({'menghualu_xunyin':'寻音','menghualu_xingzhou':'行舟','menghualu_shuiyue':'水月'})[b.dataset.oa]||b.dataset.oa));
 document.querySelectorAll('.tabbar .tb').forEach(b=>b.onclick=()=>{switchTab(b.dataset.tab);try{window.scrollTo(0,0);}catch(e){}});
 document.querySelectorAll('.urow[data-sec]').forEach(r=>r.onclick=()=>{const sec=r.dataset.sec;if(sec)openOpNote(sec);});
 document.querySelectorAll('[data-person]').forEach(r=>r.onclick=()=>openPerson(r.dataset.person));
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{
  const [type,subId,action,idx]=b.dataset.rv.split('|');
  if(type==='grade'){const g=(D.grades||[]).filter(g=>inT(g.anchor))[+idx];review(type,subId,action,{sec:g.sec,grade:g.grade,anchor:g.anchor},b);}
  else{const g=(D.appeals||[]).filter(g=>inT(g.anchor))[+idx];const sel=document.getElementById('ovr'+idx).value.split('|');
   review(type,subId,action,{sec:g.sec,gid:sel[0],tid:sel[1],anchor:g.anchor},b);}
 });}
const t0=new URLSearchParams(location.search).get('t');
if(t0){localStorage.setItem('ops_token',t0.trim().toLowerCase());history.replaceState(null,'',location.pathname);}
if(storedToken())load(storedToken());else showLogin('');
</script>
