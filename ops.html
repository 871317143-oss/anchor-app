<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>画像助手 · 运营版</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1c2733;--ink2:#46545f;--ink3:#8a97a5;--line:#e6eaee;--brand:#3d5a80;
--red:#c6453b;--blue:#2f6fb0;--green:#3a8a5e;--amber:#c07f24;--gray-bg:#f0f2f4;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px;}
.hd{padding:18px 4px 12px;display:flex;align-items:center;justify-content:space-between;}
.hd h1{font-size:19px;}
.hd .sub{font-size:12px;color:var(--ink3);margin-top:3px;}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit;}
.btn.ghost{background:var(--gray-bg);color:var(--ink2);}
.btn.ok{background:var(--green);}
.btn.no{background:var(--gray-bg);color:var(--red);}
.btn.sm{padding:6px 12px;font-size:12px;}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(20,35,55,.05);}
.sec-t{font-size:14px;font-weight:700;margin:16px 4px 8px;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline;}
.sec-t .cnt{font-size:12px;color:var(--ink3);font-weight:400;}
.row{display:flex;gap:8px;align-items:baseline;padding:7px 2px;border-top:1px solid var(--line);font-size:13px;}
.row:first-child{border-top:none;}
.row .t{color:var(--ink3);font-size:11px;flex:none;width:44px;}
.row .a{color:var(--brand);font-weight:600;flex:none;}
.row .n{flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .x{color:var(--ink2);flex:1;min-width:0;word-break:break-all;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:4px;background:var(--gray-bg);}
.tag.g{background:#e8f4ed;color:var(--green);}.tag.b{background:#e8f1f9;color:var(--blue);}
.tag.r{background:#fbeae8;color:var(--red);}.tag.a{background:#faf1e1;color:var(--amber);}
.todo{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(20,35,55,.05);border-left:4px solid var(--amber);}
.todo .who{font-size:14px;font-weight:700;margin-bottom:4px;}
.todo .meta{font-size:12px;color:var(--ink3);margin-bottom:6px;}
.todo .txt{font-size:13px;color:var(--ink2);line-height:1.6;background:var(--gray-bg);border-radius:10px;padding:8px 10px;margin-bottom:8px;}
.todo .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.todo select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;background:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px;}
.chip{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:#fff;color:var(--ink2);cursor:pointer;border:1px solid var(--line);}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:30px 0;}
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{width:88%;max-width:340px;background:var(--card);border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 4px 20px rgba(20,35,55,.08);}
.login-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--ink3);margin-bottom:14px;}
.login-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none;text-align:center;font-family:inherit;}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(28,39,51,.94);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:82%;text-align:center;}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
const SUMMARY_URL='https://fb.menghualu.com.co/api/ops/summary';
const REVIEW_URL='https://fb.menghualu.com.co/api/ops/review';
const root=document.getElementById('root');
let D=null, _af='', _tf='';
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function storedToken(){return localStorage.getItem('ops_token')||'';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1800);}
function showLogin(err){
 root.innerHTML=`<div class="login-wrap"><div class="login-card">
  <div class="login-title">画像助手 · 运营版</div>
  <div class="login-sub">请输入运营访问码</div>
  <input id="loginCode" class="login-input" type="text" autocapitalize="off" autocomplete="off" placeholder="粘贴访问码">
  <button id="loginBtn" class="btn" style="width:100%;margin-top:8px">进入</button>
  <div id="loginErr" class="login-err">${err||''}</div></div></div>`;
 const code=document.getElementById('loginCode');
 const go=()=>{const v=(code.value||'').trim().toLowerCase();if(!v)return;localStorage.setItem('ops_token',v);load(v);};
 document.getElementById('loginBtn').onclick=go;code.onkeydown=e=>{if(e.key==='Enter')go();};
 setTimeout(()=>code.focus(),60);}
function fmtTs(t){if(!t)return'';const d=new Date(t.replace(' ','T')+(t.includes('Z')?'':'Z'));
 const m=d.getMonth()+1,dd=d.getDate(),h=d.getHours(),mi=d.getMinutes();const now=new Date();
 return (m===now.getMonth()+1&&dd===now.getDate())?`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`:`${m}/${dd} ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;}
async function load(tok){
 root.innerHTML='<div class="empty">加载中…</div>';
 try{
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),20000);
  const r=await fetch(SUMMARY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok}),signal:ctrl.signal});
  clearTimeout(to);
  const d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.error||'访问码无效');
  D=d;render();
 }catch(e){
  if(String(e).includes('AbortError')){root.innerHTML='<div class="empty">网络超时，点这里重试</div>';root.onclick=()=>{root.onclick=null;load(tok);};return;}
  localStorage.removeItem('ops_token');showLogin(e.message||'加载失败');}}
async function review(type,subId,action,extra){
 const body={token:storedToken(),sub_id:subId,type,action,...extra};
 try{
  const r=await fetch(REVIEW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.error||'失败');
  toast(action==='approve'?'已通过并生效':'已驳回');
  load(storedToken());
 }catch(e){toast(e.message);}}
function tagFor(a){const m={'已拉群':'g','已互关':'b','已流失':'r','已回复':'g','已私信':'b','已关注':'g','已复购':'a'};
 return `<span class="tag ${m[a]||''}">${a}</span>`;}
function todoHtml(){
 let h='';
 const gs=(D.grades||[]).filter(g=>inT(g.anchor));
 if(gs.length){
  h+=`<div class="sec-t">等级建议待审批<span class="cnt">${gs.length} 条</span></div>`;
  h+=gs.map((g,i)=>`<div class="todo"><div class="who">${esc(g.nick||('sec…'+g.sec_tail))}　<span class="tag a">${g.grade}</span></div>
   <div class="meta">${esc(g.anchor)} 建议 · ${fmtTs(g.ts)}</div>
   ${g.note?`<div class="txt">${esc(g.note)}</div>`:''}
   <div class="acts"><button class="btn ok sm" data-rv="grade|${g.sub_id}|approve|${i}">通过（写入档案库）</button>
   <button class="btn no sm" data-rv="grade|${g.sub_id}|reject|${i}">驳回</button></div></div>`).join('');
 }
 const ap=(D.appeals||[]).filter(g=>inT(g.anchor));
 if(ap.length){
  h+=`<div class="sec-t">归属异议待处理<span class="cnt">${ap.length} 条</span></div>`;
  h+=ap.map((g,i)=>{
   const opts=(D.anchors||[]).map(a=>`<option value="${a.gid}|${a.tid}" ${a.name===g.anchor?'selected':''}>${a.team.replace('梦华录','')}·${a.name}</option>`).join('');
   return `<div class="todo"><div class="who">${esc(g.nick||('sec…'+g.sec_tail))}</div>
   <div class="meta">${esc(g.anchor)} 提交 · ${fmtTs(g.ts)}</div>
   <div class="txt">${esc(g.appeal)}</div>
   <div class="acts"><select id="ovr${i}">${opts}</select>
   <button class="btn ok sm" data-rv="appeal|${g.sub_id}|approve|${i}">通过（改主归属）</button>
   <button class="btn no sm" data-rv="appeal|${g.sub_id}|reject|${i}">驳回</button></div></div>`;}).join('');
 }
 return h;
}
function render(){
 const name2team={};(D.anchors||[]).forEach(a=>name2team[a.name]=a.team);
 const teamOf=n=>name2team[n]||'';
 const teams=['梦华录寻音','梦华录行舟','梦华录水月'];
 const tchipHtml=['',...teams].map(t=>`<span class="chip${t===_tf?' on':''}" data-tf="${t}">${t?t.replace('梦华录',''):'全部团'}</span>`).join('');
 let anchors=[...new Set((D.subs||[]).map(s=>s.anchor))];
 if(_tf)anchors=anchors.filter(a=>teamOf(a)===_tf);
 const chipHtml=['',...anchors].map(a=>`<span class="chip${a===_af?' on':''}" data-af="${a}">${a||'全部'}</span>`).join('');
 const inT=n=>!_tf||teamOf(n)===_tf;
 const subs=(D.subs||[]).filter(s=>(!_af||s.anchor===_af)&&inT(s.anchor));
 const subsHtml=subs.length?subs.map(s=>`<div class="row"><span class="t">${fmtTs(s.ts)}</span>
  <span class="a">${esc(s.anchor)}</span><span class="n">${esc(s.nick||('sec…'+s.sec_tail))}</span>
  <span class="x">${(s.actions||[]).map(tagFor).join('')}${s.actions&&s.actions.length&&s.note?' ':''}${esc(s.note||'')}</span></div>`).join('')
  :'<div class="empty">还没有回传流水</div>';
 const flagsHtml=(D.flags||[]).filter(f=>inT(f.anchor)).length?D.flags.filter(f=>inT(f.anchor)).map(f=>`<div class="row"><span class="t">${fmtTs(f.ts)}</span>
  <span class="a">${esc(f.anchor)}</span><span class="n">sec…${f.sec_tail}</span><span class="x">${tagFor(f.flag)}</span></div>`).join('')
  :'<div class="empty">还没有点亮标记</div>';
 const stHtml=(D.status||[]).filter(f=>inT(f.anchor)).length?D.status.filter(f=>inT(f.anchor)).map(f=>`<div class="row"><span class="t">${fmtTs(f.ts)}</span>
  <span class="a">${esc(f.anchor)}</span><span class="n">sec…${f.sec_tail}</span><span class="x">${tagFor(f.status)}</span></div>`).join('')
  :'<div class="empty">还没有状态记录</div>';
 const todo=todoHtml();
 root.innerHTML=`<div class="wrap"><div class="hd"><div><h1>画像助手 · 运营版</h1>
  <div class="sub">${esc(D.scope||'运营')} · 实时出自云端 · 审批即刻生效</div></div>
  <button class="btn ghost" id="rf">刷新</button></div>
  ${todo}
  <div class="sec-t">回传流水<span class="cnt">按团 / 主播过滤</span></div>
  <div class="chips">${tchipHtml}</div>
  <div class="chips">${chipHtml}</div>
  <div class="card">${subsHtml}</div>
  <div class="sec-t">持久点亮（已拉群 / 已互关）</div><div class="card">${flagsHtml}</div>
  <div class="sec-t">跟进状态（各主播视角）</div><div class="card">${stHtml}</div>
  <div class="empty">运营版 v2 · 明细与归档在 Notion 回传库</div></div>`;
 document.getElementById('rf').onclick=()=>load(storedToken());
 document.querySelectorAll('[data-af]').forEach(c=>c.onclick=()=>{_af=c.dataset.af;render();});
 document.querySelectorAll('[data-tf]').forEach(c=>c.onclick=()=>{_tf=c.dataset.tf;_af='';render();});
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{
  const [type,subId,action,idx]=b.dataset.rv.split('|');
  if(type==='grade'){const g=D.grades[+idx];review(type,subId,action,{sec:g.sec,grade:g.grade,anchor:g.anchor});}
  else{const g=D.appeals[+idx];const sel=document.getElementById('ovr'+idx).value.split('|');
   review(type,subId,action,{sec:g.sec,gid:sel[0],tid:sel[1],anchor:g.anchor});}
 });}
const t0=new URLSearchParams(location.search).get('t');
if(t0){localStorage.setItem('ops_token',t0.trim().toLowerCase());history.replaceState(null,'',location.pathname);}
if(storedToken())load(storedToken());else showLogin('');
</script>
</body>
</html>
