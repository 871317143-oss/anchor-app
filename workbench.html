  month_income:r.month_income||0,month_days:r.month_days==null?null:r.month_days,base_progress:r.base_progress==null?null:r.base_progress,
  last_income:r.last_income||'',last_live:r.last_live||'',warn:r.warn||''}));
 return {ok:d.ok,list};
}
/* 保底进度：真接口是 0-1 小数（非字符串），渲染一律走 fmtBp 转百分比（字符串兼容原样） */
const fmtBp=v=>v==null?'':(typeof v==='string'?v:Math.round(v*100)+'%');
function adRadar(d){return (d&&d.anchors)||{};}
function adDetail(d){return d&&d.ok?{ok:true,recent10:d.recent10||[],tiers:d.tiers||{}}:{ok:false,error:'wo-30a'};}
/* 真接口→视图模型适配（缺口字段=null 灰态，工单 wo-29a 跟进：name/本月/PCU/开播时刻/记一下动作） */
function adTeams(d){
 const ts=(d.teams||[]).map(t=>{
  const w=t.week||{},p=t.prevWeek||{};
  const wow=(w.income!=null&&p.income)?Math.round((w.income-p.income)/p.income*100):null;
  const o=t.offair,n=(t.today&&t.today.sessions)||0;
  /* offair 无行=今日未收场；有行非 done=收场采集中；done=已结束 */
  const status=o?(o.status==='done'?{live:false,n,since:'',step:'',canOff:false}:{live:false,n,since:'',step:o.step||'收场采集中',canOff:false}):{live:true,n,since:'',step:'',canOff:true};
  return {tid:t.tid,name:t.name,yday:t.yesterday?t.yesterday.income:null,month:null,wow,
   showUv:t.today?t.today.show_uv:null,pcu:null,warnR:(t.warn&&t.warn.red)||0,warnY:(t.warn&&t.warn.yellow)||0,status,
   wkIncome:w.income||0,pwkIncome:p.income||0,founded:t.founded||null};
 });
 return {ok:d.ok,name:'运营',company:ts.length>1,teams:ts};
}
function adTodo(d){

  icebreak:(g.ice||[]).map(r=>({l:`${r.anchor} · ${r.nick||'?'}`,r:`${r.hours}h 未私信`,ref:r.ref,tid:r.tid,anchor:r.anchor,sec:r.sec||'',sv:r.sv,tier:r.t,hours:r.hours})),
  noreply:(g.noreply||[]).map(r=>({l:`${r.anchor} · ${r.nick||'?'}`,r:'超 48h 未回复',ref:r.ref,tid:r.tid,anchor:r.anchor,sec:r.sec||'',sv:r.sv,tier:r.t,hours:r.hours})),
  maintain:(g.maintain||[]).map(r=>({l:`${r.anchor} · ${r.nick||'?'}`,r:r.lastAction==='从未'?'从未维护':`${r.lastAction.slice(5)} 后未维护`,ref:r.ref,tid:r.tid,anchor:r.anchor,sec:r.sec||'',sv:r.sv,tier:r.t,lastAction:r.lastAction})),

  approve:(g.rest||[]).map(r=>({l:r.anchor,r:`${r.kind||'休息'} ${String(r.date||'').slice(5)}`,ref:r.ref,tid:r.tid,anchor:r.anchor})),
 };
 const c=d.counts||{};
 return {ok:d.ok,groups:mp,counts:{icebreak:c.ice,noreply:c.noreply,maintain:c.maintain,warn:c.warn,approve:c.rest}};

function bindTrows(){

  row.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;moved=false;},{passive:true});
  row.addEventListener('touchmove',e=>{
   const dx=sx-e.touches[0].clientX;
   if(dx>10)moved=true;
   if(dx>60&&!open){closeOthers();open=true;sl.style.transform='translateX(-192px)';}
  },{passive:true});
  row.addEventListener('touchend',()=>{setTimeout(()=>moved=false,50);},{passive:true});

/* 右滑返回(与主播版 bindSwipeBack 同族:dx>60、|dy|<40、横向主导1.5倍;白名单防输入区误触) */
function bindSwipeBackWb(el,onBack,allow){
 let sw=null;
 el.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){sw=null;return;}
  if(allow&&!allow(e.target)){sw=null;return;}
  sw={x:e.touches[0].clientX,y:e.touches[0].clientY};
 },{passive:true});
 el.addEventListener('touchend',e=>{
  if(!sw)return;
  const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
  if(dx>60&&Math.abs(dy)<40&&dx>1.5*Math.abs(dy))onBack();
 },{passive:true});
}
