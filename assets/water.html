<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a141a">
<title>梦华录 · 水面</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    position:fixed;inset:0;width:100%;height:100%;
    overflow:hidden;
    background:radial-gradient(125% 150% at 50% 36%,#0e1a22 0%,#0b151c 50%,#0a141a 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    user-select:none;-webkit-user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  #water{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:none}

  /* —— 中央天光（雾中透亮，复刻 bg-canvas 的亮区）—— */
  #glow{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;background:
    radial-gradient(40% 27% at 50% 25%, rgba(150,189,207,.44) 0%, rgba(143,182,201,.19) 42%, rgba(143,182,201,.05) 66%, rgba(0,0,0,0) 82%),
    radial-gradient(30% 21% at 41% 34%, rgba(143,182,201,.18) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(33% 23% at 60% 31%, rgba(143,182,201,.16) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(54% 32% at 50% 40%, rgba(143,182,201,.13) 0%, rgba(0,0,0,0) 70%),
    radial-gradient(96% 64% at 50% 30%, rgba(143,182,201,.10) 0%, rgba(0,0,0,0) 74%),
    linear-gradient(to bottom, rgba(143,182,201,.08) 0%, rgba(143,182,201,.022) 38%, rgba(0,0,0,0) 60%);
    animation:glowBreath 7.5s ease-in-out infinite}
  @keyframes glowBreath{0%,100%{opacity:.66}50%{opacity:1}}
  /* 天光里的光尘微粒（雾中丁达尔质感）*/
  #glowdust{position:fixed;inset:0;width:100%;height:100%;z-index:5;display:block;pointer-events:none;mix-blend-mode:screen}

  /* —— 玻璃质感层（移植自欢迎页 gw-pane）—— */
  .g-grade-c{position:fixed;inset:0;z-index:2;pointer-events:none;background:#8fb6c9;mix-blend-mode:color;opacity:.20}
  .g-grade-s{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(168deg,rgba(143,182,201,.12) 0%,rgba(10,20,26,.32) 80%);mix-blend-mode:soft-light}
  .g-frost{position:fixed;inset:0;z-index:3;pointer-events:none;background:
    linear-gradient(rgba(10,20,26,.08),rgba(10,20,26,.08)),
    linear-gradient(150deg,rgba(143,182,201,.06) 0%,rgba(60,86,100,.04) 52%,rgba(34,54,68,.06) 100%)}
  .g-noise{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:overlay;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>")}
  .g-depth{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(130% 160% at 50% 44%,rgba(8,16,21,0) 44%,rgba(8,16,21,.22) 76%,rgba(8,15,20,.42) 100%)}
  .g-sheen{position:fixed;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.5;
    background:linear-gradient(118deg,rgba(143,182,201,.08) 0%,rgba(143,182,201,.025) 22%,rgba(143,182,201,0) 40%)}

  /* —— 蝴蝶（玻璃内侧，雾之下；擦雾不掉，雾散更清晰）—— */
  #butterfly{position:fixed;inset:0;width:100%;height:100%;z-index:7;display:block;pointer-events:none;filter:hue-rotate(-13deg) saturate(.82) brightness(.96)}

  /* —— 玻璃表面的凝雾（可擦除；含静态小珠与持久水痕）—— */
  #fog{position:fixed;inset:0;width:100%;height:100%;z-index:8;display:block;touch-action:none}

  /* —— 动态大水滴（雾表面，缓慢下滑/汇聚/留痕）—— */
  #beads{position:fixed;inset:0;width:100%;height:100%;z-index:9;display:block;touch-action:none}

  /* —— 重新起雾按钮（右上角）—— */
  #refog{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));
    z-index:11;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(143,182,201,.18);color:rgba(143,182,201,.82);
    background:rgba(72,100,118,.16);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(143,182,201,.14),inset 0 -1px 0 rgba(8,15,20,.12);
    transition:all .3s ease;
  }
  #refog:active{background:rgba(143,182,201,.22)}
  #refog svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* —— 底部状态文字 —— */
  #status{
    position:fixed;left:0;right:0;bottom:calc(7.5% + env(safe-area-inset-bottom));z-index:10;
    text-align:center;color:rgba(143,182,201,.66);
    font-size:.86rem;letter-spacing:.32em;text-indent:.32em;
    pointer-events:none;transition:opacity 1.4s ease;
    text-shadow:0 1px 12px rgba(70,108,128,.38);
  }
  #status.gone{opacity:0}
  #status .dots{display:inline-block;letter-spacing:.1em}

  /* —— 对接用色调规范面板（可收起）—— */
  #palette{position:fixed;left:14px;bottom:calc(15px+env(safe-area-inset-bottom));z-index:20;width:252px;
    padding:12px 13px;border-radius:14px;background:rgba(9,18,24,.74);
    border:1px solid rgba(143,182,201,.22);color:rgba(143,182,201,.86);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:12px;line-height:1.5;
    transition:opacity .35s ease,transform .35s ease}
  #palette.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
  #palette .p-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;letter-spacing:.1em;margin-bottom:9px;color:rgba(152,192,208,.94)}
  #p-close{cursor:pointer;font-weight:400;opacity:.72;font-size:11px}
  #palette .p-row{display:flex;align-items:center;gap:9px;margin:7px 0}
  #palette .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(143,182,201,.26)}
  #palette .p-row b{font-weight:500;flex:1}
  #palette .p-row span{opacity:.64;font-size:11px}
  #palette .p-note{margin-top:9px;padding-top:9px;border-top:1px solid rgba(143,182,201,.15);opacity:.68;font-size:11px;line-height:1.6}
  #p-fab{position:fixed;left:16px;bottom:calc(16px+env(safe-area-inset-bottom));z-index:20;width:42px;height:42px;border-radius:50%;
    display:none;align-items:center;justify-content:center;color:rgba(143,182,201,.88);background:rgba(9,18,24,.72);
    border:1px solid rgba(143,182,201,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px}
  #p-fab.show{display:flex}
</style>
</head>
<body>
<canvas id="water"></canvas>
<div id="glow"></div>
<div class="g-grade-c"></div>
<div class="g-grade-s"></div>
<div class="g-frost"></div>
<div class="g-noise"></div>
<div class="g-depth"></div>
<div class="g-sheen"></div>
<canvas id="glowdust"></canvas>
<canvas id="butterfly"></canvas>
<canvas id="fog"></canvas>
<canvas id="beads"></canvas>
<button id="refog" aria-label="重新起雾" title="重新起雾">
  <svg viewBox="0 0 24 24"><path d="M5 19a2 2 0 0 1-.9-3.8 4 4 0 0 1 7.6-1.3A3.5 3.5 0 0 1 18 17.5"/><path d="M3.5 13.5h.01M7 9l.6-1M16 12l.7-1.2M19 15.5l.8-.9"/></svg>
</button>
<div id="status"><span id="status-text">加载中</span><span class="dots">..</span></div>
<div id="palette" class="hidden">
  <div class="p-head">色调规范 · 对接用<span id="p-close">收起 ×</span></div>
  <div class="p-row"><i class="sw" style="background:#0e1a22"></i><b>墨蓝 · 水夜</b><span>#0e1a22 → #0a141a</span></div>
  <div class="p-row"><i class="sw" style="background:#8fb6c9"></i><b>青黛 · 唯一微光</b><span>#8fb6c9 低透明·呼吸</span></div>
  <div class="p-row"><i class="sw" style="background:#A0402F"></i><b>朱红 · 印章</b><span>#A0402F 点缀</span></div>
  <div class="p-note">全画面仅允许这三色；唯一光源是水面上一团青黛微光，低透明、缓慢呼吸；朱红只落在印章 / 圆环。</div>
</div>
<button id="p-fab" class="show">色</button>

var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function R(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function gauss(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318*v)}

/* ============ 物理网格（低分辨率高度场） ============ */
var W=0,H=0,SW=0,SH=0;
var h1=null,h2=null;
var DAMP=0.9855,STEP=1/30;
var REFRACT=2.2,LIGHT=11;
var swT=0,stepAcc=0,logoReady=false,loaded=false;

/* ============ 高分辨率场景/渲染层（消除 LOGO 锯齿） ============ */
var RW=0,RH=0;
var scene=document.createElement('canvas'),sceneCtx=null,sceneData=null;
var renderCv=document.createElement('canvas'),renderCtx=null,outImg=null;
var fOx=null,fOy=null,fGy=null;

function poke(cx,cy,str,rad){
  cx|=0;cy|=0;
  var r2=rad*rad,R0=Math.ceil(rad);
  for(var y=-R0;y<=R0;y++){
    for(var x=-R0;x<=R0;x++){
      var px=cx+x,py=cy+y;
      if(px<1||py<1||px>=SW-1||py>=SH-1)continue;
      var f=(x*x+y*y)/r2;
      if(f>1)continue;
      h1[py*SW+px]+=str*(0.5+0.5*Math.cos(Math.PI*Math.sqrt(f)));
    }
  }
}
function stepWater(){
  swT+=0.0333;
  for(var y=1;y<SH-1;y++){
    var i=y*SW+1;
    for(var x=1;x<SW-1;x++,i++){
      h2[i]=((h1[i-1]+h1[i+1]+h1[i-SW]+h1[i+SW])*0.5-h2[i])*DAMP
        +0.0024*Math.sin(swT*0.7+x*0.05+y*0.021)
        +0.0019*Math.sin(swT*0.43-x*0.023+y*0.041);
    }
  }
  var t=h1;h1=h2;h2=t;
}

function buildScene(){
  scene.width=RW;scene.height=RH;
  sceneCtx=scene.getContext('2d');
  sceneCtx.setTransform(1,0,0,1,0,0);
  sceneCtx.clearRect(0,0,RW,RH);
  sceneCtx.imageSmoothingEnabled=true;
  sceneCtx.imageSmoothingQuality='high';
  if(logoReady&&logoImg.naturalWidth){
    var ar=logoImg.naturalHeight/logoImg.naturalWidth;
    var dw=RW*0.62, dh=dw*ar;
    if(dh>RH*0.6){dh=RH*0.6;dw=dh/ar}
    var dx=(RW-dw)/2, dy=(RH-dh)/2-RH*0.02;
    sceneCtx.drawImage(logoImg,dx,dy,dw,dh);
    var logoPx=sceneCtx.getImageData(0,0,RW,RH),lp=logoPx.data;
    for(var z=0;z<lp.length;z+=4){
      var la=lp[z+3];if(la<6){continue}
      var lr0=lp[z],lg0=lp[z+1],lb0=lp[z+2];
      if(lr0-lg0>26 && lr0-lb0>26 && lr0>80){
        lp[z]=160;lp[z+1]=64;lp[z+2]=47;            /* 朱红：圆环 / 印章 */
      }else{
        var lf=(lr0*0.3+lg0*0.59+lb0*0.11)/255;      /* 青黛：书法，按亮度留层次 */
        lp[z]=Math.round(112+58*lf);lp[z+1]=Math.round(152+40*lf);lp[z+2]=Math.round(174+32*lf);
      }
      lp[z+3]=la;
    }
    sceneCtx.putImageData(logoPx,0,0);
  }
  sceneData=sceneCtx.getImageData(0,0,RW,RH);
  outImg=renderCtx.createImageData(RW,RH);
}

function computeField(){
  if(!fOx||fOx.length!==SW*SH){fOx=new Float32Array(SW*SH);fOy=new Float32Array(SW*SH);fGy=new Float32Array(SW*SH)}
  var kx=REFRACT*(RW/SW),ky=REFRACT*(RH/SH);
  for(var y=0;y<SH;y++){
    var yu=y>0?y-1:y,yd=y<SH-1?y+1:y;
    for(var x=0;x<SW;x++){
      var i=y*SW+x;
      var gx=h1[i-(x>0?1:0)]-h1[i+(x<SW-1?1:0)];
      var gy=h1[yu*SW+x]-h1[yd*SW+x];
      fOx[i]=gx*kx;fOy[i]=gy*ky;fGy[i]=gy;
    }
  }
}
function renderWater(){
  computeField();
  var GAIN=96,CAP=72;
  var dst=outImg.data,src=sceneData.data;
  var fx2=SW/RW,fy2=SH/RH;
  for(var py=0;py<RH;py++){
    var wfy=py*fy2;
    var y0=wfy|0;if(y0>SH-2)y0=SH-2;else if(y0<0)y0=0;
    var ty=wfy-y0;if(ty>1)ty=1;else if(ty<0)ty=0;
    for(var px=0;px<RW;px++){
      var wfx=px*fx2;
      var x0=wfx|0;if(x0>SW-2)x0=SW-2;else if(x0<0)x0=0;
      var tx=wfx-x0;if(tx>1)tx=1;else if(tx<0)tx=0;
      var i00=y0*SW+x0,i01=i00+1,i10=i00+SW,i11=i10+1;
      var w00=(1-tx)*(1-ty),w01=tx*(1-ty),w10=(1-tx)*ty,w11=tx*ty;
      var ox=fOx[i00]*w00+fOx[i01]*w01+fOx[i10]*w10+fOx[i11]*w11;
      var oy=fOy[i00]*w00+fOy[i01]*w01+fOy[i10]*w10+fOy[i11]*w11;
      var gyv=fGy[i00]*w00+fGy[i01]*w01+fGy[i10]*w10+fGy[i11]*w11;
      var sp2=gyv*GAIN,trg=0;
      if(sp2<0){trg=-sp2;sp2=0}
      if(sp2>CAP)sp2=CAP;
      if(trg>CAP)trg=CAP;
      var sx=(px+ox)|0,sy=(py+oy)|0;
      if(sx<0)sx=0;else if(sx>=RW)sx=RW-1;
      if(sy<0)sy=0;else if(sy>=RH)sy=RH-1;
      var si=(sy*RW+sx)*4,di=(py*RW+px)*4;
      if(src[si+3]>10){
        var shade=gyv*LIGHT;
        var lr=src[si]+shade,lg=src[si+1]+shade,lb=src[si+2]+shade*1.25;
        if(lr<0)lr=0;else if(lr>255)lr=255;
        if(lg<0)lg=0;else if(lg>255)lg=255;
        if(lb<0)lb=0;else if(lb>255)lb=255;
        var sk=sp2/255;
        lr=lr*(1-sk)+143*sk;lg=lg*(1-sk)+182*sk;lb=lb*(1-sk)+201*sk;
        var tk=trg/255*0.6;
        lr=lr*(1-tk)+10*tk;lg=lg*(1-tk)+20*tk;lb=lb*(1-tk)+26*tk;
        dst[di]=lr|0;dst[di+1]=lg|0;dst[di+2]=lb|0;
        dst[di+3]=src[si+3];
      }else{
        /* 平静水面也铺一层清澈基础蓝（不透明）：波峰提亮、波谷压暗。
           这样擦去白雾后看到的是蓝色水面，而非透出 body 的死黑背景 */
        var wr=14,wg=26,wb=34;
        var sk2=sp2/255;
        wr=wr*(1-sk2)+143*sk2;wg=wg*(1-sk2)+182*sk2;wb=wb*(1-sk2)+201*sk2;
        var tk2=trg/255*0.72;
        wr=wr*(1-tk2)+10*tk2;wg=wg*(1-tk2)+20*tk2;wb=wb*(1-tk2)+26*tk2;
        dst[di]=wr|0;dst[di+1]=wg|0;dst[di+2]=wb|0;dst[di+3]=255;
      }
    }
  }
  renderCtx.putImageData(outImg,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(renderCv,0,0,W,H);
}

/* ============ 雨滴（落入水面） ============ */
var drops=[],plips=[];
var rainT=R(.6,1.6),ambT=R(1.5,3);
function rhythm(dt){
  rainT-=dt;
  if(rainT<=0){rainT=R(.55,1.7);spawnDrop(R(.8,1.5));if(Math.random()<.26)spawnDrop(R(.5,.9))}
  ambT-=dt;
  if(ambT<=0){ambT=R(2.5,5.5);poke(R(2,SW-2),R(2,SH-2),R(.25,.55),3)}
}
function spawnDrop(str){
  var sx=R(2,SW-2),sy=R(2,SH-2),px=sx/SW*W,py=sy/SH*SH;
  var fall=H*R(.34,.52),dur=R(.3,.42),vx=R(-8,14);
  drops.push({x:px-vx*dur,y:py-fall,ty:py,sx:sx,sy:sy,str:str,v:fall/dur,vx:vx,w:1+str*.35});
}
function updateDrops(dt){
  var i,d;
  for(i=drops.length-1;i>=0;i--){
    d=drops[i];d.x+=d.vx*dt;d.y+=d.v*dt;
    if(d.y>=d.ty){
      poke(d.sx,d.sy,d.str*1.15,1.6);poke(d.sx,d.sy,-d.str*.4,3.2);
      plips.push({x:d.x,y:d.ty,t:.22});drops.splice(i,1);continue;
    }
    var len=Math.min(26,d.v*.045),tx=d.x-d.vx*(len/d.v),ty=d.y-len;
    var g=ctx.createLinearGradient(tx,ty,d.x,d.y);
    g.addColorStop(0,'rgba(143,182,201,0)');
    g.addColorStop(.7,'rgba(143,182,201,.40)');
    g.addColorStop(1,'rgba(143,182,201,.62)');
    ctx.strokeStyle=g;ctx.lineWidth=d.w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(d.x,d.y);ctx.stroke();
  }
  var j,p,a;
  for(j=plips.length-1;j>=0;j--){
    p=plips[j];p.t-=dt;if(p.t<=0){plips.splice(j,1);continue}
    a=p.t/.22;
    ctx.strokeStyle='rgba(143,182,201,'+(.55*a).toFixed(3)+')';ctx.lineWidth=.9;
    ctx.beginPath();ctx.arc(p.x,p.y,1.2+(1-a)*5,0,6.2832);ctx.stroke();
    ctx.fillStyle='rgba(150,188,206,'+(.6*a*a).toFixed(3)+')';
    ctx.beginPath();ctx.arc(p.x,p.y,1.4*a+.3,0,6.2832);ctx.fill();
  }
}

/* 竖屏布局：sp=sprite, x/y=中心相对比例, w=显示宽(px), rot=弧度, flip=镜像 */
var BF_LAYOUT=[
  {sp:'A',x:.20,y:.81,w:80,rot:-.12,flip:1},
  {sp:'A',x:.81,y:.15,w:66,rot:.14},
  {sp:'F',x:.86,y:.73,w:48,rot:.10},
  {sp:'F',x:.15,y:.27,w:44,rot:-.16,flip:1},
  {sp:'D',x:.75,y:.40,w:60,rot:.08},
  {sp:'D',x:.25,y:.57,w:55,rot:-.10,flip:1}
];
var butterflies=[];
function genButterflies(){
  butterflies=[];
  for(var i=0;i<BF_LAYOUT.length;i++){
    var L=BF_LAYOUT[i];
    butterflies.push({sp:L.sp,x:L.x*W,y:L.y*H,w:L.w,rot:L.rot,flip:L.flip?-1:1});
  }
  drawButterflies();
}
function updateButterflies(dt){ /* 栖息蝴蝶保持静止，不逐帧重绘（省电） */ }
function drawButterflies(){
  bctx.setTransform(dpr,0,0,dpr,0,0);
  bctx.globalCompositeOperation='source-over';
  bctx.clearRect(0,0,W,H);
  for(var i=0;i<butterflies.length;i++){
    var b=butterflies[i],im=BF_IMG[b.sp];
    if(!im||!im.complete||im.naturalWidth===0)continue;
    var sc=b.w/im.naturalWidth,dw=im.naturalWidth*sc,dh=im.naturalHeight*sc;
    bctx.save();
    bctx.translate(b.x,b.y);bctx.rotate(b.rot);bctx.scale(b.flip,1);
    bctx.drawImage(im,-dw/2,-dh/2,dw,dh);
    bctx.restore();
  }
}
/* ============ 凝雾 + 静态小珠 ============ */
var WIPE_R=24;
var softEraser=document.createElement('canvas');
softEraser.width=softEraser.height=96;
(function(){
  var c=softEraser.getContext('2d');
  var g=c.createRadialGradient(48,48,0,48,48,48);
  g.addColorStop(0,'rgba(0,0,0,0.45)');   /* 平顶：路径上擦除均匀，保留水膜底，暗带柔和不死黑 */
  g.addColorStop(0.55,'rgba(0,0,0,0.45)');
  g.addColorStop(0.8,'rgba(0,0,0,0.22)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,96,96);
})();
/* 擦雾后的「透明湿膜」亮斑：补偿白雾擦掉的明度，让擦痕透亮而非死黑 */
var wetSheen=document.createElement('canvas');
wetSheen.width=wetSheen.height=96;
(function(){
  var c=wetSheen.getContext('2d');
  var g=c.createRadialGradient(48,46,4,48,48,46);
  g.addColorStop(0,'rgba(150,192,208,.06)');
  g.addColorStop(.5,'rgba(130,168,186,.03)');
  g.addColorStop(1,'rgba(110,145,162,0)');
  c.fillStyle=g;c.fillRect(0,0,96,96);
})();
var beadsSmall=[];
function fogBlotch(x,y,r,a){
  var g=fog.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(143,182,201,'+a+')');g.addColorStop(1,'rgba(143,182,201,0)');
  fog.fillStyle=g;fog.fillRect(0,0,W,H);
}
/* 小珠位置：两侧 / 边缘 / 下方密集，中央天光区稀疏 */
function beadPosSmall(){
  var m=Math.random();
  if(m<.5)return[R(W*.58,W*1.03),R(-.04*H,H*1.04)];
  if(m<.72)return[R(-.03*W,W*.16),R(-.04*H,H*1.04)];
  if(m<.88)return[R(W*.1,W*.9),R(H*.5,H*1.04)];
  return[R(W*.2,W*.8),R(H*.05,H*.42)];    /* 中央天光区仅少量 */
}
function genBeads(){
  beadsSmall=[];
  var nS=Math.min(620,Math.round(W*H/840));
  for(var i=0;i<nS;i++){var p=beadPosSmall();beadsSmall.push({x:p[0],y:p[1],r:R(.7,2.2),a:R(.5,.85),rot:R(0,6.2832),sy:R(.82,1)})}
}
function drawSmallBeads(){
  var i,b;
  /* 挖孔（凝珠透出底），略椭圆、方向随机 */
  fog.globalCompositeOperation='destination-out';
  for(i=0;i<beadsSmall.length;i++){
    b=beadsSmall[i];
    fog.save();fog.translate(b.x,b.y);fog.rotate(b.rot);fog.scale(1,b.sy);
    fog.fillStyle='rgba(0,0,0,'+b.a.toFixed(3)+')';
    fog.beginPath();fog.arc(0,0,b.r,0,6.2832);fog.fill();fog.restore();
  }
  fog.globalCompositeOperation='source-over';
  /* 集中高光：柔光小点 + 极小亮芯 */
  for(i=0;i<beadsSmall.length;i++){
    b=beadsSmall[i];
    var hx=b.x-b.r*.22,hy=b.y-b.r*.34;
    fog.fillStyle='rgba(170,202,220,.55)';
    fog.beginPath();fog.arc(hx,hy,b.r*.34,0,6.2832);fog.fill();
    if(b.r>1.3){fog.fillStyle='rgba(205,225,235,.82)';
      fog.beginPath();fog.arc(hx-b.r*.05,hy-b.r*.05,b.r*.13,0,6.2832);fog.fill()}
  }
}
/* 少量贯穿的静态长流痕（雨长期冲刷）：蜿蜒、节瘤、串珠 */
function paintRun(x,y0,y1,r){
  var y=y0,cx=x,sway=R(-1.5,1.5),swayT=0;
  while(y<y1){
    swayT-=1;if(swayT<=0){sway=R(-1.8,1.8);swayT=R(3,8)}
    var ny=Math.min(y1,y+R(9,18));
    var nx=cx+sway*R(.25,.8)+R(-.7,.7);
    var bump=Math.random()<.12;
    var w=r*(bump?R(1.5,2.1):R(.8,1.15));
    fog.globalCompositeOperation='destination-out';
    fog.strokeStyle='rgba(8,15,20,.08)';fog.lineWidth=w*1.7;fog.lineCap='round';
    fog.beginPath();fog.moveTo(cx,y);fog.lineTo(nx,ny);fog.stroke();
    fog.globalCompositeOperation='source-over';
    fog.strokeStyle='rgba(150,190,207,.085)';fog.lineWidth=Math.max(.5,w*.5);
    fog.beginPath();fog.moveTo(cx-w*.1,y);fog.lineTo(nx-w*.1,ny);fog.stroke();
    if(Math.random()<.10){
      var br=R(.8,2.2);
      fog.globalCompositeOperation='destination-out';
      fog.fillStyle='rgba(0,0,0,.55)';fog.beginPath();fog.arc(nx,ny+R(-3,3),br,0,6.2832);fog.fill();
      fog.globalCompositeOperation='source-over';
      fog.fillStyle='rgba(168,200,216,.45)';fog.beginPath();
      fog.arc(nx-br*.2,ny-br*.3,br*.34,0,6.2832);fog.fill();
    }
    cx=nx;y=ny;
  }
}
function drawStaticRuns(){
  fog.setTransform(dpr,0,0,dpr,0,0);
  var n=2;
  for(var k=0;k<n;k++){
    /* 两侧为主，中央天光区不放 */
    var x;
    x=(k%2===0)?R(W*.06,W*.24):R(W*.76,W*.94);
    paintRun(x,R(.02*H,.2*H),R(.6*H,.98*H),R(.7,1.2));
  }
  fog.globalCompositeOperation='source-over';
}
function paintFog(){
  fog.setTransform(dpr,0,0,dpr,0,0);
  fog.globalCompositeOperation='source-over';
  fog.clearRect(0,0,W,H);
  fog.fillStyle='rgba(143,182,201,.11)';fog.fillRect(0,0,W,H);          /* 青黛薄雾（白度克制，擦前擦后明度差小）*/
  /* 中央天光处擦薄（透出亮） */
  fog.globalCompositeOperation='destination-out';
  var cx=W*.5,cy=H*.285;
  var g=fog.createRadialGradient(cx,cy,W*.08,cx,cy,W*.64);
  g.addColorStop(0,'rgba(0,0,0,.93)');g.addColorStop(.45,'rgba(0,0,0,.56)');g.addColorStop(1,'rgba(0,0,0,0)');
  fog.fillStyle=g;fog.fillRect(0,0,W,H);
  fog.globalCompositeOperation='source-over';
  /* 四周 / 角落深蓝厚雾 */
  var d=fog.createRadialGradient(W*.5,H*.42,W*.3,W*.5,H*.5,W*.9);
  d.addColorStop(0,'rgba(10,20,26,0)');d.addColorStop(.7,'rgba(9,18,24,.16)');d.addColorStop(1,'rgba(8,15,20,.32)');
  fog.fillStyle=d;fog.fillRect(0,0,W,H);
  /* 垂直雾带：极少、短、淡、只在两侧（避免下雨感；水痕以动态水滴拖尾为主） */
  for(var k=0;k<4;k++){
    var x=(Math.random()<.5)?R(0,W*.24):R(W*.76,W);
    var w=R(.5,1.1),ys=R(0,.32*H),hh=R(.16*H,.4*H);
    fog.fillStyle=(Math.random()<.5)
      ? 'rgba(10,20,26,'+R(.02,.05).toFixed(3)+')'
      : 'rgba(143,182,201,'+R(.02,.05).toFixed(3)+')';
    fog.fillRect(x,ys,w,hh);
  }
  /* 柔和雾斑 */
  for(var q=0;q<12;q++)fogBlotch(R(0,W),R(0,H),R(W*.12,W*.34),R(.04,.11));
  if(!beadsSmall.length)genBeads();
  drawStaticRuns();
  drawSmallBeads();
  fog.globalCompositeOperation='source-over';
}
/* 雾缓慢愈合：极低 alpha 青黛全屏，source-over 天然优先补透明擦痕（旧水痕约十几秒变淡，
   厚雾区几乎不增厚）；手擦区约半分钟才轻微重新凝雾，不影响当下观看 */
var healAcc=0;
function healFog(){
  fog.setTransform(dpr,0,0,dpr,0,0);
  fog.globalCompositeOperation='source-over';
  fog.fillStyle='rgba(143,182,201,.016)';fog.fillRect(0,0,W,H);
}

/* ============ 动态大水滴 ============ */
var mDrops=[];
function dropPos(){
  var m=Math.random();
  if(m<.40)return[R(W*.58,W*.98),R(0,H)];
  if(m<.62)return[R(W*.02,W*.20),R(0,H)];
  return[R(W*.18,W*.82),R(0,H)];
}
function makeDrop(top){
  var p=dropPos();
  var r=R(4.2,8.6);
  var slide=!top&&Math.random()<.5;
  var d={x:top?R(0,W):p[0],y:top?R(-24,30):p[1],r:top?R(3.6,5.2):r,
    vy:slide?R(28,60):0,state:top?'idle':(slide?'slide':'idle'),
    idleT:R(0,3),wob:R(0,6.28),pauseT:0,dead:false,
    seed:R(0,6.28),sway:0,swayTarget:0,swayT:0,
    sy:1,sx:1,travel:0,dieDist:Infinity,fade:0};
  if(Math.random()<.62)d.dieDist=R(H*.28,H*.92);  /* 约六成半路被吸收/耗尽，其余滑出屏幕 */
  return d;
}
function resetBeads(){
  mDrops=[];
  var n=Math.round(clamp(W*H/32000,11,16));
  for(var i=0;i<n;i++)mDrops.push(makeDrop(false));
  drawBeadsLayer();
}
/* 水滴下滑在 fog 留下湿润水痕：蜿蜒、粗细不均、节瘤串珠、湿晕亮芯 */
function trailOnFog(x1,y1,x2,y2,r,sway){
  fog.setTransform(dpr,0,0,dpr,0,0);
  var dist=Math.abs(y2-y1);
  var segs=Math.max(2,Math.ceil(dist/5));
  var px=x1,py=y1;
  for(var s=0;s<segs;s++){
    var f1=(s+1)/segs;
    var ny=y1+(y2-y1)*f1;
    var nx=x1+(x2-x1)*f1;
    var bump=Math.random()<.12;                      /* 节瘤：偶尔明显变粗 */
    var w=Math.max(.7,r*.32)*(bump?R(1.5,2.0):R(.8,1.12));
    /* 湿晕（宽、淡，把雾擦出柔和湿带）*/
    fog.globalCompositeOperation='destination-out';
    fog.strokeStyle='rgba(8,15,20,.10)';fog.lineWidth=w*1.4;fog.lineCap='round';
    fog.beginPath();fog.moveTo(px,py);fog.lineTo(nx,ny);fog.stroke();
    /* 亮芯（细，湿润反光）*/
    fog.globalCompositeOperation='source-over';
    fog.strokeStyle='rgba(150,190,207,.14)';fog.lineWidth=Math.max(.5,w*.46);
    fog.beginPath();fog.moveTo(px-w*.12,py);fog.lineTo(nx-w*.12,ny);fog.stroke();
    /* 串珠：沿途偶尔镶嵌一颗小凝珠 */
    if(Math.random()<.16){
      var br=R(.8,2.1);
      fog.globalCompositeOperation='destination-out';
      fog.fillStyle='rgba(0,0,0,.6)';fog.beginPath();fog.arc(nx,ny,br,0,6.2832);fog.fill();
      fog.globalCompositeOperation='source-over';
      fog.fillStyle='rgba(168,200,216,.5)';fog.beginPath();
      fog.arc(nx-br*.2,ny-br*.3,br*.34,0,6.2832);fog.fill();
    }
    px=nx;py=ny;
  }
  fog.globalCompositeOperation='source-over';
}
function updateBeads(dt){
  var i,d;
  for(i=0;i<mDrops.length;i++){
    d=mDrops[i];
    if(d.state==='idle'){
      d.idleT+=dt;d.r+=.03*dt;
      if((d.r>6.4&&Math.random()<.2*dt)||d.idleT>R(2.5,5.5)){d.state='slide';d.vy=24+d.r*4.2}
    }else if(d.state==='pause'){
      d.pauseT-=dt;if(d.pauseT<=0){d.state='slide';d.vy*=.55}
    }else if(d.state==='die'){
      d.fade-=dt;d.r-=dt*16;                  /* 被吸收：快速缩小、淡出 */
      if(d.fade<=0||d.r<.7)d.dead=true;
    }else{
      d.vy+=42*dt;
      var vmax=40+d.r*8;if(d.vy>vmax)d.vy=vmax;
      var oy=d.y,ox=d.x;
      d.wob+=dt*1.6;
      d.swayT-=dt;
      if(d.swayT<=0){d.swayTarget=R(-1.7,1.7);d.swayT=R(.35,1.1)}
      d.sway+=(d.swayTarget-d.sway)*Math.min(1,dt*3.2);
      d.y+=d.vy*dt;
      d.x+=d.sway*dt*d.vy*.06+Math.sin(d.wob*1.3)*.22;
      d.x=clamp(d.x,3,W-3);
      d.travel+=d.vy*dt;
      var vn=clamp(d.vy/118,0,1);
      d.sy=1.18+.5*vn; d.sx=1-.24*vn;         /* 速度越快越拉长、收窄（蝌蚪形）*/
      trailOnFog(ox,oy,d.x,d.y,d.r,d.sway);
      d.r-=(.32+d.vy*.011)*dt;                /* 沿途失水到湿痕，逐渐变小 */
      if(Math.random()<d.vy*dt*.012){d.r+=.12;d.vy*=.975}  /* 偶尔吸收小珠 */
      if(Math.random()<.10*dt){d.state='pause';d.pauseT=R(.4,1.3)}
      if(d.r<2.1){d.state='die';d.fade=.26}    /* 被吸干 */
      else if(d.travel>=d.dieDist){            /* 半路耗尽：留一小点湿痕后消失 */
        d.state='die';d.fade=.3;
        fog.setTransform(dpr,0,0,dpr,0,0);
        fog.globalCompositeOperation='destination-out';
        fog.fillStyle='rgba(0,0,0,.5)';fog.beginPath();fog.arc(d.x,d.y,d.r*.5,0,6.2832);fog.fill();
        fog.globalCompositeOperation='source-over';
      }
      if(d.y>H+d.r)d.dead=true;
    }
  }
  var removed=0;
  for(i=mDrops.length-1;i>=0;i--)if(mDrops[i].dead){mDrops.splice(i,1);removed++}
  for(i=0;i<removed;i++)mDrops.push(makeDrop(true));
  drawBeadsLayer();
}
function drawDrop(d){
  var r=d.r,sd=d.seed||0;
  var sliding=d.state==='slide',dying=d.state==='die';
  var sy=sliding?d.sy:(dying?1.12:(1+.05*Math.sin(sd)));
  var sx=sliding?d.sx:1;
  var n=16;
  beads.setTransform(dpr,0,0,dpr,0,0);
  beads.save();
  beads.translate(d.x,d.y);
  if(dying)beads.globalAlpha=clamp(d.fade/.3,0,1);
  beads.beginPath();
  for(var i=0;i<=n;i++){
    var a=i/n*6.2832;
    var rr=r*(1+.05*Math.sin(a*3+sd)+.035*Math.sin(a*5+sd*1.7));
    var px=Math.cos(a)*rr*sx;
    var py=Math.sin(a)*rr*sy;
    if(sliding&&Math.sin(a)>.55)py+=r*(.22+.35*(d.sy-1))*(Math.sin(a)-.55)/.45;  /* 蝌蚪尖尾，随拉长增强 */
    if(i===0)beads.moveTo(px,py);else beads.lineTo(px,py);
  }
  beads.closePath();
  var g=beads.createRadialGradient(0,0,r*.15,0,0,r*1.02);
  g.addColorStop(0,'rgba(150,185,200,.10)');
  g.addColorStop(.62,'rgba(150,185,200,.16)');
  g.addColorStop(.88,'rgba(188,214,228,.52)');
  g.addColorStop(1,'rgba(188,214,228,.16)');
  beads.fillStyle=g;beads.fill();
  beads.lineWidth=r*.07;beads.strokeStyle='rgba(8,20,28,.42)';beads.stroke();
  beads.lineWidth=r*.13;beads.strokeStyle='rgba(200,222,234,.62)';
  beads.beginPath();
  for(var j=0;j<=n;j++){
    var a2=3.5+j/n*2.3;
    var rr2=r*(1+.05*Math.sin(a2*3+sd)+.035*Math.sin(a2*5+sd*1.7));
    var px2=Math.cos(a2)*rr2*sx,py2=Math.sin(a2)*rr2*sy;
    if(j===0)beads.moveTo(px2,py2);else beads.lineTo(px2,py2);
  }
  beads.stroke();
  beads.fillStyle='rgba(200,222,234,.92)';
  beads.beginPath();beads.ellipse(-r*.3*sx,-r*.42*sy,r*.26*sx,r*.15*sy,-.5,0,6.2832);beads.fill();
  beads.fillStyle='rgba(214,232,242,.98)';
  beads.beginPath();beads.arc(-r*.36*sx,-r*.47*sy,r*.09,0,6.2832);beads.fill();
  beads.fillStyle='rgba(160,196,214,.55)';
  beads.beginPath();beads.ellipse(r*.08*sx,r*.44*sy,r*.24*sx,r*.11*sy,.1,0,6.2832);beads.fill();
  beads.restore();
}
function drawBeadsLayer(){
  beads.setTransform(dpr,0,0,dpr,0,0);
  beads.globalCompositeOperation='source-over';
  beads.clearRect(0,0,W,H);
  for(var i=0;i<mDrops.length;i++)drawDrop(mDrops[i]);
}
/* 擦雾时把接触到的活动水滴抹掉 */
function killDropsAt(x,y,rad){
  for(var i=0;i<mDrops.length;i++){var d=mDrops[i];if(Math.hypot(d.x-x,d.y-y)<rad+d.r)d.dead=true}
}
function killDropsSeg(a,b,rad){
  var dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
  for(var i=0;i<mDrops.length;i++){
    var d=mDrops[i];
    var t=((d.x-a.x)*dx+(d.y-a.y)*dy)/L2;t=clamp(t,0,1);
    var px=a.x+dx*t,py=a.y+dy*t;
    if(Math.hypot(d.x-px,d.y-py)<rad+d.r)d.dead=true;
  }
}

/* ============ 触摸：擦雾（fog+beads）+ 划水 ============ */
var down={},lastPt={};
function cssPt(e){return{x:e.clientX,y:e.clientY}}
function simPt(p){return{x:p.x/W*SW,y:p.y/H*SH}}
function eraseAt(x,y){
  var arr=[[fog,fogCv],[beads,beadsCv]];
  for(var i=0;i<arr.length;i++){
    var c=arr[i][0];
    c.setTransform(dpr,0,0,dpr,0,0);
    c.globalCompositeOperation='destination-out';
    c.drawImage(softEraser,x-WIPE_R,y-WIPE_R,WIPE_R*2,WIPE_R*2);
    c.globalCompositeOperation='source-over';
  }
  killDropsAt(x,y,WIPE_R);
  fog.setTransform(dpr,0,0,dpr,0,0);fog.globalCompositeOperation='source-over';
  fog.drawImage(wetSheen,x-WIPE_R,y-WIPE_R,WIPE_R*2,WIPE_R*2);
}
function eraseSeg(a,b){
  var dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy),step=WIPE_R*.28,n=Math.max(1,Math.ceil(dist/step));
  var arr=[fog,beads];
  for(var ci=0;ci<arr.length;ci++){
    var c=arr[ci];
    c.setTransform(dpr,0,0,dpr,0,0);
    c.globalCompositeOperation='destination-out';
    for(var k=0;k<=n;k++){var t=k/n;c.drawImage(softEraser,a.x+dx*t-WIPE_R,a.y+dy*t-WIPE_R,WIPE_R*2,WIPE_R*2)}
    c.globalCompositeOperation='source-over';
  }
  killDropsSeg(a,b,WIPE_R);
  /* 湿膜：沿擦痕连续 stroke（每段一次、不逐点叠加），宽柔晕→中亮带→细高光，湿润通透不死黑 */
  fog.setTransform(dpr,0,0,dpr,0,0);fog.globalCompositeOperation='source-over';
  fog.lineCap='round';fog.lineJoin='round';
  fog.strokeStyle='rgba(140,180,200,.06)';fog.lineWidth=WIPE_R*2.0;
  fog.beginPath();fog.moveTo(a.x,a.y);fog.lineTo(b.x,b.y);fog.stroke();
  fog.strokeStyle='rgba(150,192,208,.12)';fog.lineWidth=WIPE_R*1.25;
  fog.beginPath();fog.moveTo(a.x,a.y);fog.lineTo(b.x,b.y);fog.stroke();
}
beadsCv.addEventListener('pointerdown',function(e){
  if(!loaded)return;
  try{beadsCv.setPointerCapture(e.pointerId)}catch(_){}
  var p=cssPt(e);down[e.pointerId]=true;lastPt[e.pointerId]=p;
  eraseAt(p.x,p.y);
  var s=simPt(p);poke(s.x,s.y,2.0,2.8);
  if(!statusEl.classList.contains('gone'))statusEl.classList.add('gone');
  e.preventDefault();
});
beadsCv.addEventListener('pointermove',function(e){
  if(!down[e.pointerId])return;
  var p=cssPt(e),lp=lastPt[e.pointerId];
  var dx=p.x-lp.x,dy=p.y-lp.y,d=Math.hypot(dx,dy);
  if(d<1.2)return;
  eraseSeg(lp,p);
  var a=simPt(lp),b=simPt(p),steps=Math.min(6,Math.ceil(d/1.5)),str=Math.min(.38,.08+d*.03);
  for(var i=1;i<=steps;i++)poke(a.x+(b.x-a.x)*i/steps,a.y+(b.y-a.y)*i/steps,str,1.7);
  lastPt[e.pointerId]=p;
  e.preventDefault();
});
function endTouch(e){delete down[e.pointerId];delete lastPt[e.pointerId]}
beadsCv.addEventListener('pointerup',endTouch);
beadsCv.addEventListener('pointercancel',endTouch);

/* ============ 天光光尘微粒 ============ */
function genDust(){
  dust.length=0;
  var N=Math.round(Math.min(190,Math.max(115,W*H/2600)));
  for(var i=0;i<N;i++){
    dust.push({
      x:W*.5+gauss()*W*.17,
      y:H*.27+gauss()*H*.155,
      r:(.5+Math.random()*1.25)*dpr,
      a:.07+Math.random()*.26,
      ph:Math.random()*6.28318,
      sp:.4+Math.random()*1.1,
      vy:-(.002+Math.random()*.007)*H,
      vx:(Math.random()-.5)*.008*W
    });
  }
}
function updateDust(dt){
  dustx.clearRect(0,0,W*dpr,H*dpr);
  var t=performance.now()/1000;
  var breath=.66+.34*(.5+.5*Math.sin(t*6.28318/7.5));
  for(var i=0;i<dust.length;i++){
    var p=dust[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    var gx=(p.x-W*.5)/(W*.17),gy=(p.y-H*.27)/(H*.155);
    var d2=gx*gx+gy*gy;
    if(d2>5.2){
      p.x=W*.5+gauss()*W*.17;
      p.y=H*.27+gauss()*H*.155;
      gx=(p.x-W*.5)/(W*.17);gy=(p.y-H*.27)/(H*.155);d2=gx*gx+gy*gy;
    }
    var fade=Math.max(0,1-d2/5.2);
    var tw=.5+.5*Math.sin(t*p.sp+p.ph);
    var al=p.a*(.4+.6*tw)*breath*fade;
    dustx.beginPath();
    dustx.fillStyle='rgba(143,182,201,'+al.toFixed(3)+')';
    dustx.arc(p.x*dpr,p.y*dpr,p.r,0,6.28318);
    dustx.fill();
  }
}

/* ============ 尺寸 ============ */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  waterCv.width=Math.round(W*dpr);waterCv.height=Math.round(H*dpr);
  bfCv.width=Math.round(W*dpr);bfCv.height=Math.round(H*dpr);
  fogCv.width=Math.round(W*dpr);fogCv.height=Math.round(H*dpr);
  beadsCv.width=Math.round(W*dpr);beadsCv.height=Math.round(H*dpr);
  dustCv.width=Math.round(W*dpr);dustCv.height=Math.round(H*dpr);
  genDust();
  SW=Math.min(260,Math.max(160,Math.round(W/4)));
  SH=Math.max(80,Math.round(SW*H/W));
  h1=new Float32Array(SW*SH);h2=new Float32Array(SW*SH);
  RW=Math.round(W*dpr);RH=Math.round(H*dpr);
  var capPx=460000;
  if(RW*RH>capPx){var k=Math.sqrt(capPx/(RW*RH));RW=Math.round(RW*k);RH=Math.round(RH*k)}
  renderCv.width=RW;renderCv.height=RH;renderCtx=renderCv.getContext('2d');
  stepAcc=0;down={};lastPt={};
  drops.length=0;plips.length=0;
  genButterflies();
  for(var k2=0;k2<3;k2++)poke(R(2,SW-2),R(2,SH-2),R(.5,1.1),2);
  if(logoReady){buildScene();paintFog();resetBeads();drawButterflies()}
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

/* ============ 主循环 ============ */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(document.hidden||!loaded){last=ts;return}
  var raw=(ts-last)/1000||.016;last=ts;
  var dt=Math.min(.05,raw),tdt=Math.min(2,raw);
  rhythm(tdt);
  stepAcc+=dt;var n=0;
  while(stepAcc>=STEP&&n<3){stepWater();stepAcc-=STEP;n++}
  renderWater();
  updateDrops(dt);
  updateBeads(dt);
  updateButterflies(dt);
  updateDust(dt);
  healAcc+=dt;if(healAcc>=.5){healFog();healAcc=0}
}

/* ============ 启动 ============ */
var logoImg=new Image();
logoImg.onload=function(){logoReady=true;finishBoot()};
logoImg.onerror=function(){logoReady=false;finishBoot()};
function finishBoot(){
  resize();
  setTimeout(function(){
    loaded=true;
    statusText.textContent='轻触水面';
  },700);
}
if(LOGO_SRC.indexOf('data:')===0){logoImg.src=LOGO_SRC}
else{finishBoot()}

if(REDUCED){
  resize();
  updateDust(.016);
  if(logoReady){renderWater()}
  statusText.textContent='轻触水面';
  loaded=true;
}else{
  requestAnimationFrame(loop);
}

})();
</script>
</body>
</html>
