<!DOCTYPE html>
<html lang="zh-CN" style="background:#2f412c">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f412c">
<title>主播画像助手</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2333462c'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E播%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="画像助手">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  /* 2026-10-04 v2 深绿主题：参考图精确取色（苔藓绿 #30412e 系、卡 #f7f9f0、柠绿 #c9ec5a、朱红 #d64f18）+ Material 深色规范（层级靠明度不靠阴影、深底文字 87/60/38 三档、跳色只留柠绿+朱红） */
  --ink:#1d2817;--ink2:#4a5a42;--ink3:#8a957e;
  --on-bg:#eef3e4;--on-bg2:#b3bfa6;--on-bg3:#79856c;
  --bg:#2f412c;--card:#f7f9f0;--card2:#e9f3d2;--line:#dde6cb;
  --brand:#33462c;--brand-soft:#e4f0c9;--lime:#c9ec5a;
  --red:#d64f18;--red-bg:#f6d9c6;--blue:#4f6f63;--blue-bg:#dce8d6;
  --green:#5a8a2e;--green-bg:#e2f0c6;--amber:#a5760f;--amber-bg:#f3e5b8;
  --gray:#75816b;--gray-bg:#e6ecd4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:linear-gradient(180deg,#a8c6aa 0%,#536652 100%);color:var(--ink);display:flex;justify-content:center;min-height:100vh;touch-action:pan-x pan-y;}
.phone{width:100%;max-width:414px;background:radial-gradient(130% 55% at 50% 0%,#42573a 0%,#32452d 45%,#22301e 100%);min-height:100vh;position:relative;
  box-shadow:0 0 40px rgba(20,30,18,.35);padding-bottom:92px;}
@media(min-width:480px){.phone{min-height:880px;margin:24px 0;border-radius:28px;overflow:hidden;}}
.topbar{background:transparent;color:var(--on-bg);padding:22px 20px 14px;}
.topbar .who{display:flex;align-items:center;gap:12px;}
.avatar{width:40px;height:40px;border-radius:50%;background:#4f6b43;color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;}
.topbar .avatar{width:46px;height:46px;font-size:19px;}
.topbar .name{font-size:24px;font-weight:800;letter-spacing:.5px;}
.topbar .meta{font-size:12px;color:var(--on-bg2);margin-top:4px;}
.wrap{padding:0 16px;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px;}
.sec-title h3{font-size:20px;font-weight:800;color:var(--on-bg);}
.sec-title .more{font-size:12px;color:var(--on-bg3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:7px;line-height:1;}
.tag .dot{width:6px;height:6px;border-radius:50%;}
.t-red{color:var(--red);background:var(--red-bg);}.t-red .dot{background:var(--red);}
.t-blue{color:var(--blue);background:var(--blue-bg);}.t-blue .dot{background:var(--blue);}
.t-green{color:var(--green);background:var(--green-bg);}.t-green .dot{background:var(--green);}
.t-amber{color:var(--amber);background:var(--amber-bg);}.t-amber .dot{background:var(--amber);}
.t-gray{color:var(--gray);background:var(--gray-bg);}.t-gray .dot{background:var(--gray);}
.profile{background:var(--card);border-radius:20px;overflow:hidden;overflow:clip;box-shadow:0 4px 16px rgba(20,30,18,.10);}
.profile .head{padding:16px 16px 13px;display:flex;gap:12px;align-items:flex-start;}
.profile .head .avatar{width:48px;height:48px;font-size:19px;background:#4f6b43;}
.profile .h-main{flex:1;min-width:0;}
.profile .nick{font-size:17px;font-weight:700;}
.profile .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.profile .grade{font-size:11px;color:var(--ink3);margin-top:6px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.grid .cell{padding:12px 8px;text-align:center;border-right:1px solid var(--line);}
.grid .cell:last-child{border-right:none;}
.grid .num{font-size:17px;font-weight:700;line-height:1.1;}
.grid .num small{font-size:11px;font-weight:500;color:var(--ink2);}
.grid .lab{font-size:11px;color:var(--ink2);margin-top:4px;}
.grid .num.warn{color:var(--red);}
.advice{margin:12px 16px 0;background:var(--card2);border-radius:12px;padding:13px 15px;}
.advice .at{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;letter-spacing:.5px;}
.advice p{font-size:13px;line-height:1.6;color:var(--ink2);word-break:break-word;}
.own{display:flex;align-items:center;gap:7px;margin:12px 16px 0;font-size:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--ink2);}
.own b{font-weight:600;}
.pv-info{display:flex;align-items:center;gap:8px;margin:8px 16px 0;font-size:12px;color:var(--ink2);}
.pv-info .pvi-label{flex:none;min-width:42px;color:var(--ink3);font-size:11px;}
.pv-info span:last-child{word-break:break-all;}
.act{display:flex;gap:9px;padding:15px 16px 15px;margin-top:14px;
 position:sticky;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);
 box-shadow:0 -2px 10px rgba(20,30,18,.08);padding-bottom:calc(15px + env(safe-area-inset-bottom));}
/* 浏览器内（非主屏安装）底部有原生工具栏，按钮区预留其上（同 sheet 的 88px 经验值） */
.pview.in-browser .act{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
.btn{flex:1;border:none;border-radius:12px;padding:13px 0;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn-primary{background:var(--lime);color:#223014;}
.btn-ghost{background:var(--gray-bg);color:var(--ink2);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:30px 24px;box-shadow:0 6px 26px rgba(0,0,0,.25);text-align:center;}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.login-img{width:124px;height:auto;display:block;margin:0 auto 4px;}
.login-title{font-size:19px;font-weight:800;}
.login-sub{font-size:13px;color:var(--ink3);margin:6px 0 18px;}
.login-input{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;text-align:center;}
.login-input:focus{border-color:var(--brand);}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}
.tier{background:var(--card);border-radius:20px;margin-bottom:20px;box-shadow:0 4px 14px rgba(20,30,18,.08);overflow:hidden;}
.tier .t-head{display:flex;align-items:center;gap:11px;padding:16px;}
.tier .t-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;}
.tier .t-name{font-size:16px;font-weight:700;}
.tier .t-sub{font-size:12px;color:var(--ink3);margin-top:2px;}
.tier .t-cnt{margin-left:auto;font-size:16px;font-weight:800;}
.tier .t-cnt small{font-weight:400;color:var(--ink3);font-size:11px;}
.urow{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;}
.urow .avatar{width:36px;height:36px;font-size:14px;flex:none;}
.urow .u-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.urow .u-line1{display:flex;align-items:baseline;gap:8px;}
.urow .u-nick{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .u-val{font-size:13px;color:var(--ink);font-weight:700;flex:none;}
.urow .u-tags{display:flex;flex-wrap:wrap;gap:5px;}
.urow .u-tags:empty{display:none;}
.tag.badge{padding:3px 6px;font-size:10px;gap:0;line-height:1.1;}
.urow.done .avatar,.urow.done .u-main{opacity:.52;}   /* 灰化只压内容，行底保持不透明——否则会漏出背后的左滑键位 */
.urow.done .avatar{filter:grayscale(.75);}
.urow.done .u-nick{color:var(--ink3);}
.urow .done-tag{flex:none;}
.trows .urow-wrap{border-top:1px solid var(--line);}
.tier.closed .trows .urow:nth-child(n+6){display:none;}
.tier .t-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);}
.tier .tf{flex:1;text-align:center;font-size:12px;font-weight:600;padding:10px 4px;border-radius:9px;cursor:pointer;}
.tier .tf.exp{color:var(--brand);background:var(--brand-soft);}
.tier .tf.cp{color:var(--ink2);background:var(--gray-bg);}
.tier.l1 .t-ico{background:var(--gray-bg);color:var(--gray);}.tier.l1 .t-cnt{color:var(--gray);}
.tier.l2 .t-ico{background:var(--amber-bg);color:var(--amber);}.tier.l2 .t-cnt{color:var(--amber);}
.tier.l3 .t-ico{background:var(--red-bg);color:var(--red);}.tier.l3 .t-cnt{color:var(--red);}
.cross{background:var(--card2);border:1px solid #d5e4b8;border-radius:14px;padding:14px 15px;display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.cross .c-txt{font-size:12px;line-height:1.6;color:#4a6232;}
.cross .c-txt b{font-weight:700;}
.churn-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
.churn-card{flex:none;width:156px;background:var(--card);border-radius:14px;padding:13px;box-shadow:0 2px 8px rgba(20,30,18,.08);cursor:pointer;}
.churn-card .cc-nick{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.churn-card .cc-gap{font-size:24px;font-weight:800;margin:7px 0 2px;}
.churn-card .cc-lab{font-size:10px;color:var(--ink3);}
.churn-card .cc-val{font-size:11px;margin-top:8px;color:var(--ink2);}
.ca .cc-gap{color:var(--red);}.cb .cc-gap{color:var(--amber);}.cc2 .cc-gap{color:var(--gray);}
.sbar{background:var(--card);border-radius:14px;display:flex;align-items:center;gap:9px;padding:13px 15px;box-shadow:0 4px 14px rgba(20,30,18,.10);}
.sbar input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);}
.slist{margin-top:12px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.22);}
.srow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;}
.srow:first-child{border-top:none;}
.srow .s-nick{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow .s-sub{font-size:11px;color:var(--ink3);}
.empty{text-align:center;color:var(--on-bg3);font-size:13px;padding:60px 20px;line-height:1.7;}
.me-brand{display:flex;justify-content:center;padding:4px 0 12px;}
.me-brand img{width:92px;height:auto;}
.me-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,30,18,.06);}
.me-row{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;border-top:1px solid var(--line);}
.me-row:first-of-type{border-top:none;}
.pview{position:fixed;inset:0;background:radial-gradient(130% 55% at 50% 0%,#42573a 0%,#32452d 45%,#22301e 100%);z-index:40;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;}
@media(min-width:480){.pview{position:absolute;}}
.pview.show{display:block;}
.pv-back{display:flex;align-items:center;gap:6px;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;font-size:15px;color:var(--lime);font-weight:600;background:#3a4f33;position:sticky;top:0;z-index:2;cursor:pointer;}
.profile{display:flex;flex-direction:column;min-height:calc(100vh - 44px - env(safe-area-inset-top));}
.pv-spacer{flex:1;min-height:14px;}
.view{display:none;}.view.show{display:block;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:414px;background:#1c291a;border-top:1px solid #3c5138;display:flex;padding:9px 0 calc(11px + env(safe-area-inset-bottom));z-index:30;}
.tabbar .tb{flex:1;text-align:center;font-size:11px;color:var(--on-bg3);background:none;border:none;cursor:pointer;font-family:inherit;}
.tabbar .tb svg{margin:0 auto 3px;display:block;}
.tabbar .tb.on{color:var(--lime);font-weight:600;}
#toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%) translateY(16px);background:rgba(26,36,22,.95);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:60;}
/* 回传 chip */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--gray-bg);color:var(--ink2);cursor:pointer;border:1px solid transparent;user-select:none;}
.chip.on{background:var(--lime);color:#223014;}
.chip.gS.on{background:var(--red);color:#fff}.chip.gA.on{background:var(--amber);color:#fff}.chip.gB.on{background:var(--blue);color:#fff}.chip.gC.on{background:var(--green);color:#fff}.chip.gD.on{background:var(--gray);color:#fff}
/* 底部弹层 sheet */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:stretch;}
.sheet.show{display:flex;}
.sheet-card{width:100%;background:var(--card);border-radius:0;max-height:100%;height:100%;display:flex;flex-direction:column;overscroll-behavior:contain;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 9px;}
.sheet-title{font-size:16px;font-weight:700;}
.sheet-x{font-size:24px;color:var(--ink3);cursor:pointer;line-height:1;padding:0 4px;}
.sheet-body{padding:0 14px;overflow-y:auto;flex:1;}
.sheet-foot{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));}
.sheet-card.in-browser .sheet-foot{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);}
.field input:focus,.field textarea:focus{border-color:var(--brand);}
.field textarea{resize:none;}
.fb-hint{font-size:11px;color:var(--ink3);margin:1px 0 6px;line-height:1.5;}
.fb-more{margin:2px 0 8px;border:1px solid var(--line);border-radius:11px;background:var(--card2);overflow:hidden;}
.fb-more-toggle{padding:11px 12px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;}
.fb-more-body{padding:3px 12px 1px;}
/* AI 客情助手 */
.ai-card{margin:12px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
.ai-head{padding:11px 14px;font-size:13px;font-weight:700;background:var(--brand);color:#fff;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;}
.ai-depth{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:2px;font-weight:600;}
.ai-depth em{font-style:normal;font-size:11px;padding:3px 10px;border-radius:999px;color:rgba(255,255,255,.65);cursor:pointer;}
.ai-depth em.on{background:#fff;color:var(--brand);}
.ai-nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);}
.ai-tab{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--brand);font-family:inherit;cursor:pointer;}
.ai-tab.on{background:var(--brand);color:#fff;}
.ai-body{padding:12px 14px;min-height:56px;}
.ai-ph{font-size:12px;color:var(--ink3);text-align:center;padding:14px 0;}
.ai-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
.ai-st{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;}
.ai-txt{font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:8px;word-break:break-word;}
.ai-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;}
.ai-fb{display:inline-flex;align-items:center;gap:5px;}
.ai-fbb{font-size:11px;padding:3px 8px;border:1px solid #e2e2e5;background:#fafafa;border-radius:12px;color:#777;}
.ai-fbb.sel{background:#eef7d2;border-color:#a8c86a;color:#4a6a1a;}
.ai-cp{font-size:12px;font-weight:600;border:none;border-radius:8px;padding:6px 14px;background:var(--brand-soft);color:var(--brand);font-family:inherit;cursor:pointer;}
.ai-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;font-family:inherit;resize:none;outline:none;}
.ai-go{display:block;width:100%;margin-top:8px;padding:9px;border:none;border-radius:10px;background:var(--lime);color:#223014;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.ai-frow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.ai-frow>span{flex:none;width:52px;color:var(--ink2);font-weight:600;}
.ai-frow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;}
.ai-frow>div{flex:1;min-width:0;color:var(--ink);line-height:1.4;}
.ai-up{display:block;text-align:center;border:1px dashed var(--brand);border-radius:10px;padding:16px;font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;}
.ai-up input{display:none;}
.ai-sub{font-size:11px;font-weight:700;color:var(--ink2);margin:10px 0 6px;}
.ai-snap{font-size:12px;color:var(--ink);line-height:1.5;padding:6px 0;border-top:1px dashed var(--line);}
.ai-status{color:var(--ink3);font-size:10px;margin-left:4px;}
.ai-msg{font-size:12px;line-height:1.5;padding:6px 9px;border-radius:9px;margin-bottom:5px;max-width:88%;word-break:break-word;}
.ai-msg.user{background:var(--gray-bg);color:var(--ink);}
.ai-msg.anchor{background:var(--brand-soft);color:var(--brand);margin-left:auto;}
.ai-intent{background:var(--brand-soft);border-radius:10px;padding:10px 11px;font-size:12px;line-height:1.7;margin-bottom:8px;}
.ai-intent b{color:var(--brand);}
.ai-adv{font-size:12px;line-height:1.6;margin:3px 0;}
.ai-err{font-size:12px;color:var(--red);padding:8px 0;text-align:center;}
/* 2026-10-04 v4 玻璃动效包（Vibe Design 四张技巧图落地）：玻璃拟态/按压回弹/列表渐入/弹窗入场/骨架屏/L3焦点/AI光晕流光/减少动效 */
.tabbar{background:rgba(28,41,26,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid rgba(255,255,255,.08);}
.pv-back{background:rgba(58,79,51,.55);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);}
.tier.l3{box-shadow:0 6px 20px rgba(20,30,18,.12),0 0 0 1px rgba(214,79,24,.18);}
.urow,.churn-card,.srow,.tier .tf,.btn,.chip,.tabbar .tb{transition:transform .12s ease,opacity .12s ease;}
.urow:active,.churn-card:active,.srow:active{transform:scale(.98);}
.btn:active,.chip:active,.tier .tf:active,.tabbar .tb:active{transform:scale(.94);}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.show .wrap>*{animation:riseIn .38s cubic-bezier(.22,.9,.3,1) both;}
.view.show .wrap>*:nth-child(2){animation-delay:.05s}
.view.show .wrap>*:nth-child(3){animation-delay:.1s}
.view.show .wrap>*:nth-child(4){animation-delay:.15s}
.view.show .wrap>*:nth-child(5){animation-delay:.2s}
.view.show .wrap>*:nth-child(6){animation-delay:.25s}
.view.show .wrap>*:nth-child(7){animation-delay:.3s}
.view.show .wrap>*:nth-child(8){animation-delay:.35s}
.view.show .wrap>*:nth-child(9){animation-delay:.4s}
@keyframes sheetUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sheet.show .sheet-card{animation:sheetUp .3s cubic-bezier(.22,.9,.3,1) both;}
.pview.show{animation:pvIn .22s ease both;}
@keyframes pvIn{from{opacity:0}to{opacity:1}}
@keyframes aiglow{0%,100%{box-shadow:0 0 0 0 rgba(201,236,90,0)}50%{box-shadow:0 0 18px 2px rgba(201,236,90,.28)}}
.ai-card{animation:aiglow 3.2s ease-in-out infinite;}
.ai-head{position:relative;overflow:hidden;}
.ai-head::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(201,236,90,.16) 50%,transparent 65%);background-size:220% 100%;animation:aisheen 2.8s linear infinite;}
@keyframes aisheen{from{background-position:170% 0}to{background-position:-70% 0}}
.sk-top{height:78px;margin:24px 20px 0;border-radius:20px;}
.sk-card{height:190px;margin:20px 16px 0;border-radius:20px;}
.sk{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%);background-size:220% 100%;animation:skmove 1.15s linear infinite;}
@keyframes skmove{from{background-position:170% 0}to{background-position:-70% 0}}
.sec-title .more,.tier .t-sub{letter-spacing:.3px;}
.topbar .meta{letter-spacing:.5px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
/* v45 滑切动画：手势切 tab 整页滑入（点击切 tab 仍用错峰渐入） */
@keyframes slideL{from{opacity:.4;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.4;transform:translateX(-34px)}to{opacity:1;transform:none}}
.view.show.sl{animation:slideL .26s cubic-bezier(.22,.9,.3,1);}
.view.show.sr{animation:slideR .26s cubic-bezier(.22,.9,.3,1);}
.view.show.sl .wrap>*,.view.show.sr .wrap>*{animation:none;}
/* v47 画像双页：主页在左、更多信息页在右（左滑更多信息/右滑退出，10-04 老板口径；flex order 换序不改 DOM） */
.pview{overflow:hidden;}
.pv-track{display:flex;width:200%;height:100%;transition:transform .33s var(--spring-settle);transform:translateX(0);}
.pv-track.show-quick{transform:translateX(-50%);}
.pv-page{width:50%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}   /* 禁止滚动串联：画像到顶后不再把上滑接力给底下主页（v55） */
.pv-main{order:1;}.pv-quick{order:2;}
/* v48 用户条左滑快捷操作（仿 iOS 备忘录圆钮）；v51 按钮级联滑入：--p=展开进度 0→1，越靠右的钮行程越长（错落丝滑） */
/* v63 悬浮通知铃：毛玻璃圆钮叠加右上（与 tabbar 同材质），覆盖层自然遮挡 */
/* v64 顶部横幅堆叠：新通知从顶部掉入（iOS 风），最多两层+「还有N个」；横幅态5s自动收起，提醒态留到上滑；点=开通知中心 */
.nstack{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92%,390px);z-index:90;pointer-events:none;}
.nban{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:rgba(28,41,26,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.16);color:var(--on-bg);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(15,25,15,.35);margin-bottom:8px;transform-origin:top center;animation:nbanIn .34s var(--spring-bounce) both;cursor:pointer;}
@keyframes nbanIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
.nban.out{transition:transform .22s ease,opacity .22s;transform:translateY(-16px);opacity:0;}
.nban .nc-ico{font-size:17px;margin-top:1px;flex:none;}
.nban .nb-t{font-size:13px;font-weight:700;color:var(--on-bg);}
.nban .nb-b{font-size:11px;color:var(--on-bg2);line-height:1.5;margin-top:2px;word-break:break-word;}
.nban .nb-time{font-size:10px;color:var(--on-bg3);flex:none;margin-left:2px;}
.nstack .npill{pointer-events:auto;margin:2px auto 0;width:max-content;font-size:10px;color:var(--on-bg2);background:rgba(28,41,26,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;cursor:pointer;}
.bellf{position:fixed;top:calc(10px + env(safe-area-inset-top));right:max(12px,calc(50% - 195px));z-index:35;width:38px;height:38px;border-radius:50%;background:rgba(28,41,26,.55);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(20,30,18,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on-bg);padding:0;font-family:inherit;}
.bellf svg{width:19px;height:19px;}
.bellf .bdg{position:absolute;top:-3px;right:-4px;min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.ncard{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(20,30,18,.07);transition:opacity .25s,transform .25s var(--spring-settle);}
.ncard.alert{border-left:4px solid var(--red);}
.ncard.banner{border-left:4px solid var(--amber);opacity:.92;}
.ncard.read{opacity:.45;}
.nc-ico{font-size:18px;flex:none;margin-top:1px;}
.nc-main{flex:1;min-width:0;}
.nc-t{font-size:14px;font-weight:700;}
.nc-b{font-size:12px;color:var(--ink2);line-height:1.55;margin-top:3px;word-break:break-word;}
.nc-time{font-size:10px;color:var(--ink3);margin-top:5px;}
.nc-read{flex:none;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:none;border-radius:999px;padding:6px 11px;cursor:pointer;font-family:inherit;}
.nc-go{flex:none;font-size:11px;font-weight:600;color:#223014;background:var(--lime);border:none;border-radius:999px;padding:6px 11px;cursor:pointer;font-family:inherit;}
.nc-group{font-size:12px;font-weight:700;color:var(--on-bg3);margin:16px 2px 8px;letter-spacing:.3px;}
.nc-actions{display:flex;gap:8px;margin:2px 0 8px;}
.nc-actions .tf{flex:1;text-align:center;font-size:12px;font-weight:600;padding:9px 4px;border-radius:9px;cursor:pointer;background:var(--gray-bg);color:var(--ink2);border:none;font-family:inherit;}
.nc-actions .tf.on{background:var(--brand-soft);color:var(--brand);}
.urow-wrap{position:relative;overflow:hidden;--p:0;}
.urow-wrap.open{--p:1;}
.urow-acts{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding-right:12px;}
.ua{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;
 --lag:36px;transform:translateX(calc((1 - var(--p,0))*var(--lag)));transition:transform .43s var(--spring-bounce);}
.ua:nth-child(2){--lag:84px;transition-delay:.03s;}
.ua:nth-child(3){--lag:136px;transition-delay:.06s;}
/* v52 弹簧动效 token：弹簧方程烘焙 linear()（Safari 17.2+），老机回退 cubic-bezier；参数 bounce=stiffness320/damping26、settle=180/22，见设计规范 */
:root{--spring-bounce:cubic-bezier(.3,.9,.35,1.12);--spring-settle:cubic-bezier(.32,.72,.35,1);}
@supports (animation-timing-function:linear(0,1)){
 :root{--spring-bounce:linear(0.0, 0.0168, 0.0612, 0.1249, 0.2012, 0.2847, 0.3707, 0.4561, 0.5381, 0.615, 0.6855, 0.7489, 0.8049, 0.8536, 0.8951, 0.9298, 0.9584, 0.9813, 0.9992, 1.0128, 1.0227, 1.0294, 1.0335, 1.0356, 1.036, 1.0351, 1.0334, 1.031, 1.0281, 1.0251, 1.022, 1.0189, 1.016, 1.0133, 1.0108, 1.0086, 1.0066, 1.0049, 1.0035, 1.0023, 1.0013);
 --spring-settle:linear(0.0, 0.0058, 0.0217, 0.0459, 0.0768, 0.1129, 0.153, 0.1958, 0.2406, 0.2864, 0.3326, 0.3786, 0.424, 0.4682, 0.5111, 0.5523, 0.5917, 0.6291, 0.6644, 0.6977, 0.7288, 0.7578, 0.7847, 0.8095, 0.8323, 0.8533, 0.8724, 0.8897, 0.9054, 0.9196, 0.9323, 0.9437, 0.9538, 0.9627, 0.9706, 0.9775, 0.9835, 0.9887, 0.9931, 0.9969, 1.0001);}
}
/* 拖动期禁过渡：JS 跟手逐帧驱动与 duration 过渡叠加会产生糖浆延迟（v52 核心修复） */
.urow-wrap.dragging .ua{transition:none;}
.ua-c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.ua-l{font-size:10px;color:var(--ink2);}
.ua-fb .ua-c{background:#3d6b9a;color:#fff;}
.ua-jl .ua-c{background:#7a5fa8;color:#fff;}
.ua-nr .ua-c{background:var(--red);color:#fff;}
.trows .urow{position:relative;background:var(--card);transition:transform .33s var(--spring-settle);}
.urow-wrap.open .urow{transform:translateX(-198px);}
.urow.nr{background:linear-gradient(rgba(214,79,24,.07),rgba(214,79,24,.07)),var(--card);}   /* 未回复：灰中带红 */
.pv-hint{margin-left:auto;font-size:12px;color:var(--on-bg2);font-weight:500;}
.qk-t{font-size:12px;font-weight:700;color:var(--ink2);margin:16px 18px 7px;}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="root"><div class="sk sk-top"></div><div class="sk sk-card"></div><div class="sk sk-card" style="height:150px"></div></div>
  <div id="toast"></div>
</div>
<script>
const root=document.getElementById('root');
let DATA=null;
let _aiDepth=localStorage.getItem('ai_depth')||'deep';
const APP_VERSION='v65';
const COLORS=['#55704a','#43604a','#6b7a3d','#7a6440','#4a6b5a','#5d7a43','#6f5a45','#3f5a3e'];
function colorOf(s){let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS];}
function yuan(v){v=v||0;const y=v/10;return '¥'+(y>=100?Math.round(y):Math.round(y*10)/10);}
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/86400000);}
function tag(cls,txt){return `<span class="tag t-${cls}"><span class="dot"></span>${txt}</span>`;}
function churnLab(ch){return ch==='A'?'高价值流失':ch==='B'?'老客流失':'长尾流失';}
function gradeTag(u){const m={S:'red',A:'amber',B:'blue',C:'green',D:'gray'};return u.t?tag(m[u.t],u.t+'级'):'';}
function avHtml(u,sec,size,fs){
 const inner=(u.n||'?')[0]+(u.av?`<img src="${escapeHtml(u.av)}" style="position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.remove()">`:'');
 return `<div class="avatar" style="position:relative;background:${colorOf(u.n||sec)};width:${size}px;height:${size}px;font-size:${fs}px">${inner}</div>`;}
function rowTags(u){let t=[gradeTag(u)];
  if(u.bg!=null&&u.bg<=7&&u.mine)t.push(tag('red','🎂'+(u.bg===0?'今天':u.bg===1?'明天':u.bg+'天')));
  if(u.ff&&u.ff.includes('已拉群'))t.push('<span class="tag t-green badge">群</span>');
  if(u.ff&&u.ff.includes('已互关'))t.push('<span class="tag t-blue badge">互</span>');
  if(u.nf)t.push(tag('red','新客'));
  if(u.cr&&!u.mine)t.push(tag('blue','别家'));   // 跨团且归属别家才提示；归我的不再打标（老板口径）
  if(u.ret)t.push(tag('amber','回归用户'));
  if(u.w>1200)t.push(tag('green','高陪伴'));return t.join('');}
function topbar(){const a=DATA.anchor;return `<div class="topbar"><div class="who">
  <div class="avatar">${a.name[0]}</div><div><div class="name">${a.teamName} · ${a.name}</div>
  <div class="meta">${a.date} · 主播专属</div></div></div></div>`;}
const BELLF=`<button class="bellf" id="bellf" data-act="notif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="bdg" id="notifBdg" style="display:none"></span></button>`;
const GLOBE=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5a7a35" stroke-width="2" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>`;

function tier(cls,code,name,sub,secs){if(!secs.length)return '';
 const rows=secs.map(s=>{const u=DATA.users[s];const dn=isFeedbackDone(s);return `<div class="urow-wrap"><div class="urow-acts"><button class="ua ua-fb" data-ua="fb"><span class="ua-c">传</span><span class="ua-l">回传</span></button><button class="ua ua-jl" data-ua="jl"><span class="ua-c">联</span><span class="ua-l">已建联</span></button><button class="ua ua-nr" data-ua="nr"><span class="ua-c">未</span><span class="ua-l">未回复</span></button></div><div class="urow${dn?' done':''}${dn&&fbDoneNr(s)?' nr':''}" data-sec="${s}">
  ${avHtml(u,s,36,14)}
  <div class="u-main"><div class="u-line1"><span class="u-nick">${u.n||''}</span><span class="u-val">${yuan(u.tv)}</span></div><div class="u-tags">${rowTags(u)}${doneTagHTML(s)}</div></div></div></div>`;}).join('');
 const foot=secs.length>5?`<div class="t-foot"><span class="tf exp" data-act="expand">查看全部 ${secs.length} 人 ▾</span></div>`:'';
 return `<div class="tier ${cls} closed"><div class="t-head"><div class="t-ico">${code}</div>
  <div><div class="t-name">${name}</div><div class="t-sub">${sub}</div></div>
  <div class="t-cnt">${secs.length}<small> 人</small></div></div><div class="trows">${rows}</div>${foot}</div>`;}
function churnCard(s,cls,lab){const u=DATA.users[s];return `<div class="churn-card ${cls}" data-sec="${s}">
  <div class="cc-nick">${u.n}</div><div class="cc-gap">${daysBetween(u.last,DATA.anchor.date)}天</div>
  <div class="cc-lab">${lab}</div><div class="cc-val">给我 ${yuan(u.sv)}</div></div>`;}
function greetBlock(){const g=DATA.greet;if(!g||!g.length)return '';
 const rows=g.map(s=>{const u=DATA.users[s];const dn=isFeedbackDone(s);return `<div class="urow-wrap"><div class="urow-acts"><button class="ua ua-fb" data-ua="fb"><span class="ua-c">传</span><span class="ua-l">回传</span></button><button class="ua ua-jl" data-ua="jl"><span class="ua-c">联</span><span class="ua-l">已建联</span></button><button class="ua ua-nr" data-ua="nr"><span class="ua-c">未</span><span class="ua-l">未回复</span></button></div><div class="urow${dn?' done':''}${dn&&fbDoneNr(s)?' nr':''}" data-sec="${s}">
  ${avHtml(u,s,36,14)}
  <div class="u-main"><div class="u-line1"><span class="u-nick">${u.n||''}</span><span class="u-val">给我 ${yuan(u.sv)}</span></div><div class="u-tags">${gradeTag(u)}${doneTagHTML(s)}</div></div></div></div>`;}).join('');
 const foot=g.length>5?`<div class="t-foot"><span class="tf exp" data-act="expand">查看全部 ${g.length} 人 ▾</span></div>`:'';
 return `<div class="tier closed"><div class="t-head"><div class="t-ico" style="background:var(--amber-bg);color:var(--amber)">★</div>
  <div><div class="t-name">主动问候</div><div class="t-sub">S/A/B 级本场没刷 · 也要维系</div></div>
  <div class="t-cnt">${g.length}<small> 人</small></div></div><div class="trows">${rows}</div>${foot}</div>`;}
const RETURNICO=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8930c" stroke-width="2" style="flex:none"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;
function returnedBanner(){const r=DATA.returned;if(!r||!r.length)return '';
 const names=r.slice(0,5).map(s=>DATA.users[s].n).join('、');
 return `<div class="cross" style="border-left:4px solid var(--amber)">${RETURNICO}
  <div class="c-txt"><b>${r.length} 位「已流失」老客今天回来给你刷礼物了</b>（${names}${r.length>5?' 等':''}），已标记<b>回归</b>，重点走心接待、给足独宠感。</div></div>`;}
function mysteryBlock(){const m=DATA.mystery;if(!m||!m.length)return '';
 const rows=m.map(x=>`<div class="urow" style="cursor:default"><div class="avatar" style="background:#7d8568">?</div>
  <div class="u-main"><div class="u-line1"><span class="u-nick">🎭 ${escapeHtml(x.n)}</span><span class="u-val">${yuan(x.v)}</span></div>
  <div class="u-tags">${x.ago?`<span class="tag t-amber">${x.ago}天前来过</span>`:'<span class="tag t-gray">首次出现</span>'}</div>
  ${x.fp?`<div style="font-size:11px;color:var(--ink3);line-height:1.5">${escapeHtml(x.fp)}</div>`:''}</div></div>`).join('');
 const foot=m.length>5?`<div class="t-foot"><span class="tf exp" data-act="expand">查看全部 ${m.length} 个 ▾</span></div>`:'';
 return `<div class="tier closed"><div class="t-head"><div class="t-ico" style="background:var(--gray-bg);color:var(--ink2)">🎭</div>
  <div><div class="t-name">神秘人</div><div class="t-sub">匿名送礼 · 按行为指纹认老朋友</div></div>
  <div class="t-cnt">${m.length}<small> 个</small></div></div><div class="trows">${rows}</div>${foot}</div>`;}
function bdayBanner(){const b=DATA.bday||[];if(!b.length)return '';
 const names=b.slice(0,4).map(x=>DATA.users[x[0]].n+(x[1]===0?'（今天！）':x[1]===1?'（明天）':`（${x[1]}天后）`)).join('、');
 return `<div class="cross" style="border-left:4px solid var(--red)">🎂
  <div class="c-txt"><b>未来一周生日 ${b.length} 人</b>：${names}${b.length>4?' 等':''}——提前备好心意，当天给足排面。</div></div>`;}
function viewToday(){const c=DATA.counts,ch=DATA.churn;
 const cross=DATA.crossToday.length?`<div class="cross">${GLOBE}
  <div class="c-txt">今天有 <b>${DATA.crossToday.length} 位跨团用户</b>给你送礼，也在其他团消费，注意客情；<b>不显示对方归属</b>。</div></div>`:'';
 let churn='';const tot=ch.a.length+ch.b.length+ch.c.length;
 if(tot)churn=`<div class="sec-title"><h3>该唤醒了</h3><span class="more">今天没来 · 共${tot}人</span></div>
  <div class="churn-row">${ch.a.slice(0,2).map(s=>churnCard(s,'ca','高价值流失')).join('')}
  ${ch.b.slice(0,2).map(s=>churnCard(s,'cb','老客流失')).join('')}
  ${ch.c.slice(0,1).map(s=>churnCard(s,'cc2','长尾')).join('')}</div>`;
 return `<div class="view show" id="v-today">${topbar()}<div class="wrap">
  <div class="sec-title"><h3>今日维护</h3><span class="more">按对我消费分层</span></div>
  ${tier('l3','L3','重点维护','消费 > 99 元 · 今天必聊',DATA.l3)}
  ${tier('l2','L2','完成拉群','消费 9.9–99 元',DATA.l2)}
  ${tier('l1','L1','口头感谢','消费 < 9.9 元',DATA.l1)}${greetBlock()}${mysteryBlock()}${churn}</div></div>`;}

function _lrGet(){try{return JSON.parse(localStorage.getItem(_lrKey())||'{}');}catch(e){return{};}}

function loadD1Notifs(){pollNotifs(true);setInterval(()=>pollNotifs(false),60000);}
function pollNotifs(first){
 fetch(NOTIF_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:storedToken(),include_read:true})})
 .then(r=>r.json()).then(d=>{
  if(!d.ok)return;
  const fresh=d.messages||[];
  if(!first){const known=new Set(_d1Notifs.map(m=>m.id));
   fresh.filter(m=>!m.read&&!known.has(m.id)).forEach(m=>pushBanner({kind:m.kind,level:m.level,title:m.title,body:m.body,ref:m.ref_sec,time:'现在'}));}
  _d1Notifs=fresh;updateNotifBadge();
  if(first)fireLocalBanners();
 }).catch(()=>{});
}

let _nbQ=[];
function notifStackEl(){let s=document.getElementById('nstack');if(!s){s=document.createElement('div');s.id='nstack';s.className='nstack';document.getElementById('phone').appendChild(s);}return s;}
function overlayOpen(){return !!(document.getElementById('pv')||document.getElementById('sheet')||document.getElementById('nc'));}
function pushBanner(m){
 if(overlayOpen()){_nbQ.push(m);return;}
 const s=notifStackEl();
 const ban=document.createElement('div');ban.className='nban';
 ban.innerHTML=`<div class="nc-ico">${NICO[m.kind]||'🔔'}</div><div style="flex:1;min-width:0"><div class="nb-t">${escapeHtml(m.title)}</div><div class="nb-b">${escapeHtml(m.body).slice(0,90)}</div></div><div class="nb-time">${m.time||'现在'}</div>`;
 ban.onclick=()=>{dismissBanner(ban);openNotif();};
 ban.addEventListener('touchstart',e=>{ban._y=e.touches[0].clientY;},{passive:true});
 ban.addEventListener('touchend',e=>{if(ban._y!=null&&ban._y-e.changedTouches[0].clientY>40)dismissBanner(ban,true);ban._y=null;});
 s.prepend(ban);
 trimStack();
 if(m.level!=='alert')setTimeout(()=>dismissBanner(ban),5200);
}
function dismissBanner(ban,swipe){if(!ban.isConnected)return;ban.classList.add('out');setTimeout(()=>{ban.remove();trimStack();checkQueue();},220);}
function trimStack(){const s=notifStackEl();const bs=[...s.querySelectorAll('.nban:not(.out)')];
 bs.forEach((b,i)=>{b.style.display=i<2?'flex':'none';});
 let pill=s.querySelector('.npill');const hidden=Math.max(0,bs.length-2);
 if(hidden>0){if(!pill){pill=document.createElement('div');pill.className='npill';s.appendChild(pill);}pill.textContent=`还有 ${hidden} 个通知`;pill.onclick=()=>openNotif();}
 else if(pill)pill.remove();}
function checkQueue(){if(!overlayOpen()&&_nbQ.length){const q=_nbQ;_nbQ=[];q.forEach(pushBanner);}}
function fireLocalBanners(){
 const fk='notif_fired_'+(DATA&&DATA.anchor?DATA.anchor.date:'');
 let fired={};try{fired=JSON.parse(localStorage.getItem(fk)||'{}');}catch(e){}
 const news=localNotifs().filter(m=>!fired[m.key]);
 if(!news.length)return;
 news.forEach((m,i)=>setTimeout(()=>pushBanner({kind:m.kind,level:m.level,title:m.title,body:m.body,ref:m.ref,time:'今天'}),i*900));
 news.forEach(m=>fired[m.key]=1);
 localStorage.setItem(fk,JSON.stringify(fired));
}

async function aiStreamReply(body,onChunk){
  const r=await fetch(AI_BASE+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok||!r.body){let d={};try{d=await r.json();}catch(e){};throw new Error(d.error||'生成失败');}
  const reader=r.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(!line.startsWith('data:'))continue;line=line.slice(5).trim();
      if(line==='[DONE]')continue;
      let j=null;try{j=JSON.parse(line);}catch(e){j=null;}
      if(j){if(j.t)onChunk(j.t);if(j.error)throw new Error(j.error);}
    }
  }
}
