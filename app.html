<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#274060">
<title>主播画像助手</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23274060'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E播%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="画像助手">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --ink:#1c2733;--ink2:#5c6b7a;--ink3:#8a97a5;
  --bg:#eef1f4;--card:#fff;--line:#e7ebef;
  --brand:#274060;--brand-soft:#eaf0f7;
  --red:#c6453b;--red-bg:#fbeae8;--blue:#2f6fb0;--blue-bg:#e8f1f9;
  --green:#3a8a5e;--green-bg:#e8f4ed;--amber:#c07f24;--amber-bg:#faf1e1;
  --gray:#8a97a5;--gray-bg:#eef1f4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:#d9dee5;color:var(--ink);display:flex;justify-content:center;min-height:100vh;}
.phone{width:100%;max-width:414px;background:var(--bg);min-height:100vh;position:relative;
  box-shadow:0 0 40px rgba(20,30,45,.18);padding-bottom:84px;}
@media(min-width:480px){.phone{min-height:880px;margin:24px 0;border-radius:28px;overflow:hidden;}}
.topbar{background:var(--brand);color:#fff;padding:18px 18px 16px;}
.topbar .who{display:flex;align-items:center;gap:10px;}
.avatar{width:40px;height:40px;border-radius:50%;background:#3d5a80;color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;}
.topbar .name{font-size:17px;font-weight:700;}
.topbar .meta{font-size:12px;opacity:.78;margin-top:2px;}
.wrap{padding:0 14px;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;}
.sec-title h3{font-size:15px;font-weight:700;}
.sec-title .more{font-size:12px;color:var(--ink3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;line-height:1;}
.tag .dot{width:6px;height:6px;border-radius:50%;}
.t-red{color:var(--red);background:var(--red-bg);}.t-red .dot{background:var(--red);}
.t-blue{color:var(--blue);background:var(--blue-bg);}.t-blue .dot{background:var(--blue);}
.t-green{color:var(--green);background:var(--green-bg);}.t-green .dot{background:var(--green);}
.t-amber{color:var(--amber);background:var(--amber-bg);}.t-amber .dot{background:var(--amber);}
.t-gray{color:var(--gray);background:var(--gray-bg);}.t-gray .dot{background:var(--gray);}
.profile{background:var(--card);border-radius:16px;overflow:hidden;overflow:clip;box-shadow:0 2px 12px rgba(20,35,55,.05);}
.profile .head{padding:16px 16px 13px;display:flex;gap:12px;align-items:flex-start;}
.profile .head .avatar{width:48px;height:48px;font-size:19px;background:#b3544b;}
.profile .h-main{flex:1;min-width:0;}
.profile .nick{font-size:17px;font-weight:700;}
.profile .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.profile .grade{font-size:11px;color:var(--ink3);margin-top:6px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.grid .cell{padding:12px 8px;text-align:center;border-right:1px solid var(--line);}
.grid .cell:last-child{border-right:none;}
.grid .num{font-size:17px;font-weight:700;line-height:1.1;}
.grid .num small{font-size:11px;font-weight:500;color:var(--ink2);}
.grid .lab{font-size:11px;color:var(--ink2);margin-top:4px;}
.grid .num.warn{color:var(--red);}
.advice{margin:12px 16px 0;background:var(--brand-soft);border-radius:10px;padding:11px 13px;}
.advice .at{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;letter-spacing:.5px;}
.advice p{font-size:13px;line-height:1.55;color:#31445c;word-break:break-word;}
.own{display:flex;align-items:center;gap:7px;margin:12px 16px 0;font-size:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--ink2);}
.own b{font-weight:600;}
.pv-info{display:flex;align-items:center;gap:8px;margin:8px 16px 0;font-size:12px;color:var(--ink2);}
.pv-info .pvi-label{flex:none;min-width:42px;color:var(--ink3);font-size:11px;}
.pv-info span:last-child{word-break:break-all;}
.act{display:flex;gap:9px;padding:14px 16px 16px;margin-top:14px;
 position:sticky;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);
 box-shadow:0 -2px 10px rgba(20,35,55,.06);padding-bottom:calc(16px + env(safe-area-inset-bottom));}
/* 浏览器内（非主屏安装）底部有原生工具栏，按钮区预留其上（同 sheet 的 88px 经验值） */
.pview.in-browser .act{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
.btn{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-ghost{background:var(--gray-bg);color:var(--ink2);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:30px 24px;box-shadow:0 6px 26px rgba(20,35,55,.1);text-align:center;}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.login-img{width:124px;height:auto;display:block;margin:0 auto 4px;}
.login-title{font-size:19px;font-weight:800;}
.login-sub{font-size:13px;color:var(--ink3);margin:6px 0 18px;}
.login-input{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;text-align:center;}
.login-input:focus{border-color:var(--brand);}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}
.tier{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,35,55,.04);overflow:hidden;}
.tier .t-head{display:flex;align-items:center;gap:9px;padding:13px 14px;}
.tier .t-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}
.tier .t-name{font-size:14px;font-weight:700;}
.tier .t-sub{font-size:11px;color:var(--ink3);margin-top:1px;}
.tier .t-cnt{margin-left:auto;font-size:14px;font-weight:700;}
.tier .t-cnt small{font-weight:400;color:var(--ink3);font-size:10px;}
.urow{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;}
.urow .avatar{width:32px;height:32px;font-size:13px;flex:none;}
.urow .u-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.urow .u-line1{display:flex;align-items:baseline;gap:8px;}
.urow .u-nick{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .u-val{font-size:12px;color:var(--ink2);font-weight:600;flex:none;}
.urow .u-tags{display:flex;flex-wrap:wrap;gap:4px;}
.urow .u-tags:empty{display:none;}
.tag.badge{padding:2px 5px;font-size:10px;gap:0;line-height:1.1;}
.urow.done{opacity:.52;}
.urow.done .avatar{filter:grayscale(.75);}
.urow.done .u-nick{color:var(--ink3);}
.urow .done-tag{flex:none;}
.trows .urow{border-top:1px solid var(--line);}
.tier.closed .trows .urow:nth-child(n+6){display:none;}
.tier .t-foot{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);}
.tier .tf{flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer;}
.tier .tf.exp{color:var(--brand);background:var(--brand-soft);}
.tier .tf.cp{color:var(--ink2);background:var(--gray-bg);}
.tier.l1 .t-ico{background:var(--gray-bg);color:var(--gray);}.tier.l1 .t-cnt{color:var(--gray);}
.tier.l2 .t-ico{background:var(--amber-bg);color:var(--amber);}.tier.l2 .t-cnt{color:var(--amber);}
.tier.l3 .t-ico{background:var(--red-bg);color:var(--red);}.tier.l3 .t-cnt{color:var(--red);}
.cross{background:var(--blue-bg);border-radius:12px;padding:11px 13px;display:flex;gap:9px;align-items:center;margin-bottom:10px;}
.cross .c-txt{font-size:12px;line-height:1.5;color:#2b5b8c;}
.cross .c-txt b{font-weight:700;}
.churn-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;}
.churn-card{flex:none;width:148px;background:#fff;border-radius:12px;padding:11px;box-shadow:0 2px 8px rgba(20,30,55,.05);cursor:pointer;}
.churn-card .cc-nick{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.churn-card .cc-gap{font-size:20px;font-weight:800;margin:6px 0 1px;}
.churn-card .cc-lab{font-size:10px;color:var(--ink3);}
.churn-card .cc-val{font-size:11px;margin-top:7px;color:var(--ink2);}
.ca .cc-gap{color:var(--red);}.cb .cc-gap{color:var(--amber);}.cc2 .cc-gap{color:var(--gray);}
.sbar{background:#fff;border-radius:12px;display:flex;align-items:center;gap:9px;padding:11px 13px;box-shadow:0 4px 14px rgba(20,35,55,.07);}
.sbar input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);}
.slist{margin-top:12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,35,55,.04);}
.srow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;}
.srow:first-child{border-top:none;}
.srow .s-nick{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow .s-sub{font-size:11px;color:var(--ink3);}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:60px 20px;line-height:1.7;}
.me-brand{display:flex;justify-content:center;padding:4px 0 12px;}
.me-brand img{width:92px;height:auto;}
.me-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,35,55,.04);}
.me-row{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;border-top:1px solid var(--line);}
.me-row:first-of-type{border-top:none;}
.pview{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;}
@media(min-width:480){.pview{position:absolute;}}
.pview.show{display:block;}
.pv-back{display:flex;align-items:center;gap:6px;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;font-size:15px;color:var(--brand);font-weight:600;background:var(--bg);position:sticky;top:0;z-index:2;cursor:pointer;}
.profile{display:flex;flex-direction:column;min-height:calc(100vh - 44px - env(safe-area-inset-top));}
.pv-spacer{flex:1;min-height:14px;}
.view{display:none;}.view.show{display:block;}
.tabbar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(10px + env(safe-area-inset-bottom));}
.tabbar .tb{flex:1;text-align:center;font-size:10px;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:inherit;}
.tabbar .tb svg{margin:0 auto 3px;display:block;}
.tabbar .tb.on{color:var(--brand);font-weight:600;}
#toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%) translateY(16px);background:rgba(28,39,51,.94);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:60;}
/* 回传 chip */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--gray-bg);color:var(--ink2);cursor:pointer;border:1px solid transparent;user-select:none;}
.chip.on{background:var(--brand);color:#fff;}
.chip.gS.on{background:var(--red)}.chip.gA.on{background:var(--amber)}.chip.gB.on{background:var(--blue)}.chip.gC.on{background:var(--green)}.chip.gD.on{background:var(--gray)}
/* 底部弹层 sheet */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:stretch;}
.sheet.show{display:flex;}
.sheet-card{width:100%;background:var(--bg);border-radius:0;max-height:100%;height:100%;display:flex;flex-direction:column;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 9px;}
.sheet-title{font-size:16px;font-weight:700;}
.sheet-x{font-size:24px;color:var(--ink3);cursor:pointer;line-height:1;padding:0 4px;}
.sheet-body{padding:0 14px;overflow-y:auto;flex:1;}
.sheet-foot{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));}
.sheet-card.in-browser .sheet-foot{padding-bottom:calc(88px + env(safe-area-inset-bottom));}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);}
.field input:focus,.field textarea:focus{border-color:var(--brand);}
.field textarea{resize:none;}
.fb-hint{font-size:11px;color:var(--ink3);margin:1px 0 6px;line-height:1.5;}
.fb-more{margin:2px 0 8px;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;}
.fb-more-toggle{padding:11px 12px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;}
.fb-more-body{padding:3px 12px 1px;}
/* AI 客情助手 */
.ai-card{margin:12px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
.ai-head{padding:11px 14px;font-size:13px;font-weight:700;background:var(--brand);color:#fff;letter-spacing:.5px;}
.ai-nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);}
.ai-tab{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--brand);font-family:inherit;cursor:pointer;}
.ai-tab.on{background:var(--brand);color:#fff;}
.ai-body{padding:12px 14px;min-height:56px;}
.ai-ph{font-size:12px;color:var(--ink3);text-align:center;padding:14px 0;}
.ai-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
.ai-st{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;}
.ai-txt{font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:8px;word-break:break-word;}
.ai-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;}
.ai-fb{display:inline-flex;align-items:center;gap:5px;}
.ai-fbb{font-size:11px;padding:3px 8px;border:1px solid #e2e2e5;background:#fafafa;border-radius:12px;color:#777;}
.ai-fbb.sel{background:#eef3ff;border-color:#9db4f5;color:#3556c8;}
.ai-cp{font-size:12px;font-weight:600;border:none;border-radius:8px;padding:6px 14px;background:var(--brand-soft);color:var(--brand);font-family:inherit;cursor:pointer;}
.ai-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;font-family:inherit;resize:none;outline:none;}
.ai-go{display:block;width:100%;margin-top:8px;padding:9px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.ai-frow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.ai-frow>span{flex:none;width:52px;color:var(--ink2);font-weight:600;}
.ai-frow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;}
.ai-frow>div{flex:1;min-width:0;color:var(--ink);line-height:1.4;}
.ai-up{display:block;text-align:center;border:1px dashed var(--brand);border-radius:10px;padding:16px;font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;}
.ai-up input{display:none;}
.ai-sub{font-size:11px;font-weight:700;color:var(--ink2);margin:10px 0 6px;}
.ai-snap{font-size:12px;color:var(--ink);line-height:1.5;padding:6px 0;border-top:1px dashed var(--line);}
.ai-status{color:var(--ink3);font-size:10px;margin-left:4px;}
.ai-msg{font-size:12px;line-height:1.5;padding:6px 9px;border-radius:9px;margin-bottom:5px;max-width:88%;word-break:break-word;}
.ai-msg.user{background:var(--gray-bg);color:var(--ink);}
.ai-msg.anchor{background:var(--brand-soft);color:var(--brand);margin-left:auto;}
.ai-intent{background:var(--brand-soft);border-radius:10px;padding:10px 11px;font-size:12px;line-height:1.7;margin-bottom:8px;}
.ai-intent b{color:var(--brand);}
.ai-adv{font-size:12px;line-height:1.6;margin:3px 0;}
.ai-err{font-size:12px;color:var(--red);padding:8px 0;text-align:center;}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="root"><div class="empty">加载中…</div></div>
  <div id="toast"></div>
</div>
<script>
const root=document.getElementById('root');
let DATA=null;
const APP_VERSION='v33';
const COLORS=['#b3544b','#3d5a80','#3a8a5e','#c07f24','#7a5195','#2f6fb0','#a05a2c','#4a6b50'];
function colorOf(s){let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS];}
function yuan(v){v=v||0;const y=v/10;return '¥'+(y>=100?Math.round(y):Math.round(y*10)/10);}
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/86400000);}
function tag(cls,txt){return `<span class="tag t-${cls}"><span class="dot"></span>${txt}</span>`;}
function churnLab(ch){return ch==='A'?'高价值流失':ch==='B'?'老客流失':'长尾流失';}
function gradeTag(u){const m={S:'red',A:'amber',B:'blue',C:'green',D:'gray'};return u.t?tag(m[u.t],u.t+'级'):'';}
function rowTags(u){let t=[gradeTag(u)];
  if(u.ff&&u.ff.includes('已拉群'))t.push('<span class="tag t-green badge">群</span>');
  if(u.ff&&u.ff.includes('已互关'))t.push('<span class="tag t-blue badge">互</span>');
  if(u.nf)t.push(tag('red','新客'));
  if(u.cr&&!u.mine)t.push(tag('blue','别家'));   // 跨团且归属别家才提示；归我的不再打标（老板口径）
  if(u.ret)t.push(tag('amber','回归用户'));
  if(u.w>1200)t.push(tag('green','高陪伴'));return t.join('');}
function topbar(){const a=DATA.anchor;return `<div class="topbar"><div class="who">
  <div class="avatar">${a.name[0]}</div><div><div class="name">${a.teamName} · ${a.name}</div>
  <div class="meta">${a.date} · 主播专属</div></div></div></div>`;}
const GLOBE=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f6fb0" stroke-width="2" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>`;

function tier(cls,code,name,sub,secs){if(!secs.length)return '';
 const rows=secs.map(s=>{const u=DATA.users[s];const dn=isFeedbackDone(s);return `<div class="urow${dn?' done':''}" data-sec="${s}">
  <div class="avatar" style="background:${colorOf(u.n||s)}">${(u.n||'?')[0]}</div>

  h+=`</div>`;
  if(r.advice&&r.advice.length)h+='<div class="ai-sub">应对建议</div>'+r.advice.map(a=>`<div class="ai-adv">· ${escapeHtml(a)}</div>`).join('');
  if(r.missing)h+=`<div class="ai-err" style="text-align:left">还需：${escapeHtml(r.missing)}</div>`;
  if(r.transcript&&r.transcript.length)h+='<div class="ai-sub">识别到的对话（已存维护记录）</div>'
    +r.transcript.map(t=>`<div class="ai-msg ${t.role==='anchor'?'anchor':'user'}">${escapeHtml(t.text||'')}</div>`).join('');
  box.innerHTML=h;
}
function aiShowReply(sec,box){
  box.innerHTML=`<textarea id="aiSayTA" rows="2" placeholder="把用户刚发来的话粘进来（可一次几句）"></textarea>
   <button class="ai-go" id="aiReplyGo">生成高情商回复</button><div id="aiReplyBox"></div>`;
  box.querySelector('#aiReplyGo').onclick=async()=>{
    const says=box.querySelector('#aiSayTA').value.trim();
    if(!says){toast('请先粘贴用户的话');return;}
    const rb=box.querySelector('#aiReplyBox');
    rb.innerHTML='<span class="ai-txt" id="aiStreamTxt"></span>';
    const el=rb.querySelector('#aiStreamTxt');
    try{
      await aiStreamReply({token:storedToken(),sec,user:DATA.users[sec],user_says:says},t=>{el.textContent+=t;});
      const full=el.textContent;
      rb.insertAdjacentHTML('beforeend',`<div class="ai-acts" style="margin-top:8px"><button class="ai-cp" id="aiReplyCp">复制回复</button>
        <button class="ai-cp" id="aiReplyAgain">重新生成</button>${aiFbHtml('reply')}</div>`);
      rb.querySelector('#aiReplyCp').onclick=()=>{copyText(full);toast('已复制');};
      rb.querySelector('#aiReplyAgain').onclick=box.querySelector('#aiReplyGo').onclick;
      bindAiFb(rb,sec,el);
    }catch(e){rb.innerHTML='<div class="ai-err">'+escapeHtml(e.message)+'</div>';}
  };
}
async function aiStreamReply(body,onChunk){
  const r=await fetch(AI_BASE+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok||!r.body){let d={};try{d=await r.json();}catch(e){};throw new Error(d.error||'生成失败');}
  const reader=r.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))>=0){
      let line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(!line.startsWith('data:'))continue;line=line.slice(5).trim();
      if(line==='[DONE]')continue;
      let j=null;try{j=JSON.parse(line);}catch(e){j=null;}
      if(j){if(j.t)onChunk(j.t);if(j.error)throw new Error(j.error);}
    }
  }
}
async function aiShowTimeline(sec,box){
  const r=await aiPost('/timeline',{token:storedToken(),sec});
  let h='';
  if(r.snapshots&&r.snapshots.length){
    h+='<div class="ai-sub">客情备注（按天）</div>';
    h+=r.snapshots.map(s=>`<div class="ai-snap"><b>${s.day}</b> ${escapeHtml(s.note||'')}<span class="ai-status">${s.status}</span></div>`).join('');
  }
  if(r.messages&&r.messages.length){
    h+='<div class="ai-sub">对话记录</div>';
    h+=r.messages.map(m=>`<div class="ai-msg ${m.role==='anchor'?'anchor':'user'}">${escapeHtml(m.content||'')}</div>`).join('');
  }
  box.innerHTML=h||'<div class="ai-ph">暂无维护记录</div>';
}

 const urlT=new URLSearchParams(location.search).get('t');
 if(urlT){localStorage.setItem('anchor_token',urlT);
   history.replaceState({},'',location.pathname);}
 const tok=storedToken();
 if(!tok){showLogin();return;}
 loadData(tok);}
boot();
</script>
