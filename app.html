<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#274060">
<title>主播画像助手</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23274060'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E播%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="画像助手">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --ink:#1c2733;--ink2:#5c6b7a;--ink3:#8a97a5;
  --bg:#eef1f4;--card:#fff;--line:#e7ebef;
  --brand:#274060;--brand-soft:#eaf0f7;
  --red:#c6453b;--red-bg:#fbeae8;--blue:#2f6fb0;--blue-bg:#e8f1f9;
  --green:#3a8a5e;--green-bg:#e8f4ed;--amber:#c07f24;--amber-bg:#faf1e1;
  --gray:#8a97a5;--gray-bg:#eef1f4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:#d9dee5;color:var(--ink);display:flex;justify-content:center;min-height:100vh;}
.phone{width:100%;max-width:414px;background:var(--bg);min-height:100vh;position:relative;
  box-shadow:0 0 40px rgba(20,30,45,.18);padding-bottom:84px;}
@media(min-width:480px){.phone{min-height:880px;margin:24px 0;border-radius:28px;overflow:hidden;}}
.topbar{background:var(--brand);color:#fff;padding:18px 18px 16px;}
.topbar .who{display:flex;align-items:center;gap:10px;}
.avatar{width:40px;height:40px;border-radius:50%;background:#3d5a80;color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;}
.topbar .name{font-size:17px;font-weight:700;}
.topbar .meta{font-size:12px;opacity:.78;margin-top:2px;}
.wrap{padding:0 14px;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;}
.sec-title h3{font-size:15px;font-weight:700;}
.sec-title .more{font-size:12px;color:var(--ink3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;line-height:1;}
.tag .dot{width:6px;height:6px;border-radius:50%;}
.t-red{color:var(--red);background:var(--red-bg);}.t-red .dot{background:var(--red);}
.t-blue{color:var(--blue);background:var(--blue-bg);}.t-blue .dot{background:var(--blue);}
.t-green{color:var(--green);background:var(--green-bg);}.t-green .dot{background:var(--green);}
.t-amber{color:var(--amber);background:var(--amber-bg);}.t-amber .dot{background:var(--amber);}
.t-gray{color:var(--gray);background:var(--gray-bg);}.t-gray .dot{background:var(--gray);}
.profile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(20,35,55,.05);}
.profile .head{padding:16px 16px 13px;display:flex;gap:12px;align-items:flex-start;}
.profile .head .avatar{width:48px;height:48px;font-size:19px;background:#b3544b;}
.profile .h-main{flex:1;min-width:0;}
.profile .nick{font-size:17px;font-weight:700;}
.profile .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.profile .grade{font-size:11px;color:var(--ink3);margin-top:6px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.grid .cell{padding:12px 8px;text-align:center;border-right:1px solid var(--line);}
.grid .cell:last-child{border-right:none;}
.grid .num{font-size:17px;font-weight:700;line-height:1.1;}
.grid .num small{font-size:11px;font-weight:500;color:var(--ink2);}
.grid .lab{font-size:11px;color:var(--ink2);margin-top:4px;}
.grid .num.warn{color:var(--red);}
.advice{margin:12px 16px 0;background:var(--brand-soft);border-radius:10px;padding:11px 13px;}
.advice .at{font-size:11px;font-weight:700;color:var(--brand);margin-bottom:4px;letter-spacing:.5px;}
.advice p{font-size:13px;line-height:1.55;color:#31445c;word-break:break-word;}
.own{display:flex;align-items:center;gap:7px;margin:12px 16px 0;font-size:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--ink2);}
.own b{font-weight:600;}
.act{display:flex;gap:9px;padding:14px 16px 16px;margin-top:14px;}
.btn{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-ghost{background:var(--gray-bg);color:var(--ink2);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:30px 24px;box-shadow:0 6px 26px rgba(20,35,55,.1);text-align:center;}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.login-title{font-size:19px;font-weight:800;}
.login-sub{font-size:13px;color:var(--ink3);margin:6px 0 18px;}
.login-input{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;text-align:center;}
.login-input:focus{border-color:var(--brand);}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:14px;}
.tier{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,35,55,.04);overflow:hidden;}
.tier .t-head{display:flex;align-items:center;gap:9px;padding:13px 14px;}
.tier .t-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}
.tier .t-name{font-size:14px;font-weight:700;}
.tier .t-sub{font-size:11px;color:var(--ink3);margin-top:1px;}
.tier .t-cnt{margin-left:auto;font-size:14px;font-weight:700;}
.tier .t-cnt small{font-weight:400;color:var(--ink3);font-size:10px;}
.urow{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.urow .avatar{width:32px;height:32px;font-size:13px;}
.urow .u-nick{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .u-val{font-size:12px;color:var(--ink2);font-weight:600;}
.trows .urow{border-top:1px solid var(--line);}
.tier.closed .trows .urow:nth-child(n+6){display:none;}
.tier .t-foot{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);}
.tier .tf{flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer;}
.tier .tf.exp{color:var(--brand);background:var(--brand-soft);}
.tier .tf.cp{color:var(--ink2);background:var(--gray-bg);}
.tier.l1 .t-ico{background:var(--gray-bg);color:var(--gray);}.tier.l1 .t-cnt{color:var(--gray);}
.tier.l2 .t-ico{background:var(--amber-bg);color:var(--amber);}.tier.l2 .t-cnt{color:var(--amber);}
.tier.l3 .t-ico{background:var(--red-bg);color:var(--red);}.tier.l3 .t-cnt{color:var(--red);}
.cross{background:var(--blue-bg);border-radius:12px;padding:11px 13px;display:flex;gap:9px;align-items:center;margin-bottom:10px;}
.cross .c-txt{font-size:12px;line-height:1.5;color:#2b5b8c;}
.cross .c-txt b{font-weight:700;}
.churn-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;}
.churn-card{flex:none;width:148px;background:#fff;border-radius:12px;padding:11px;box-shadow:0 2px 8px rgba(20,30,55,.05);cursor:pointer;}
.churn-card .cc-nick{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.churn-card .cc-gap{font-size:20px;font-weight:800;margin:6px 0 1px;}
.churn-card .cc-lab{font-size:10px;color:var(--ink3);}
.churn-card .cc-val{font-size:11px;margin-top:7px;color:var(--ink2);}
.ca .cc-gap{color:var(--red);}.cb .cc-gap{color:var(--amber);}.cc2 .cc-gap{color:var(--gray);}
.sbar{background:#fff;border-radius:12px;display:flex;align-items:center;gap:9px;padding:11px 13px;box-shadow:0 4px 14px rgba(20,35,55,.07);}
.sbar input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);}
.slist{margin-top:12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,35,55,.04);}
.srow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;}
.srow:first-child{border-top:none;}
.srow .s-nick{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow .s-sub{font-size:11px;color:var(--ink3);}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:60px 20px;line-height:1.7;}
.me-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,35,55,.04);}
.me-row{display:flex;justify-content:space-between;font-size:13px;padding:10px 0;border-top:1px solid var(--line);}
.me-row:first-of-type{border-top:none;}
.pview{position:absolute;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;}
.pview.show{display:block;}
.pv-back{display:flex;align-items:center;gap:6px;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;font-size:15px;color:var(--brand);font-weight:600;background:var(--bg);position:sticky;top:0;z-index:2;cursor:pointer;}
.profile{display:flex;flex-direction:column;min-height:calc(100vh - 44px - env(safe-area-inset-top));}
.pv-spacer{flex:1;min-height:14px;}
.view{display:none;}.view.show{display:block;}
.tabbar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(10px + env(safe-area-inset-bottom));}
.tabbar .tb{flex:1;text-align:center;font-size:10px;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:inherit;}
.tabbar .tb svg{margin:0 auto 3px;display:block;}
.tabbar .tb.on{color:var(--brand);font-weight:600;}
#toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%) translateY(16px);background:rgba(28,39,51,.94);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;max-width:82%;text-align:center;opacity:0;transition:all .25s;pointer-events:none;z-index:60;}
/* 回传 chip */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--gray-bg);color:var(--ink2);cursor:pointer;border:1px solid transparent;user-select:none;}
.chip.on{background:var(--brand);color:#fff;}
.chip.gS.on{background:var(--red)}.chip.gA.on{background:var(--amber)}.chip.gB.on{background:var(--blue)}.chip.gC.on{background:var(--green)}.chip.gD.on{background:var(--gray)}
/* 底部弹层 sheet */
.sheet{position:absolute;inset:0;z-index:70;background:var(--bg);display:none;align-items:stretch;}
.sheet.show{display:flex;}
.sheet-card{width:100%;background:var(--bg);border-radius:0;max-height:100%;height:100%;display:flex;flex-direction:column;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 9px;}
.sheet-title{font-size:16px;font-weight:700;}
.sheet-x{font-size:24px;color:var(--ink3);cursor:pointer;line-height:1;padding:0 4px;}
.sheet-body{padding:0 14px;overflow-y:auto;flex:1;}
.sheet-foot{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);}
.field input:focus,.field textarea:focus{border-color:var(--brand);}
.field textarea{resize:none;}
.fb-hint{font-size:11px;color:var(--ink3);margin:1px 0 6px;line-height:1.5;}
.fb-more{margin:2px 0 8px;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;}
.fb-more-toggle{padding:11px 12px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;}
.fb-more-body{padding:3px 12px 1px;}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="root"><div class="empty">加载中…</div></div>
  <div id="toast"></div>
</div>
<script>
const root=document.getElementById('root');
let DATA=null;
const APP_VERSION='v14';
const COLORS=['#b3544b','#3d5a80','#3a8a5e','#c07f24','#7a5195','#2f6fb0','#a05a2c','#4a6b50'];
function colorOf(s){let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS];}
function yuan(v){v=v||0;const y=v/10;return '¥'+(y>=100?Math.round(y):Math.round(y*10)/10);}
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/86400000);}
function tag(cls,txt){return `<span class="tag t-${cls}"><span class="dot"></span>${txt}</span>`;}
function churnLab(ch){return ch==='A'?'高价值流失':ch==='B'?'老客流失':'长尾流失';}
function gradeTag(u){const m={S:'red',A:'amber',B:'blue',C:'green',D:'gray'};return u.t?tag(m[u.t],u.t+'级'):'';}
function rowTags(u){let t=[gradeTag(u)];if(u.nf)t.push(tag('red','新客'));
  if(u.cr)t.push(u.mine?tag('green','跨团·归我'):tag('blue','跨团'));
  if(u.ret)t.push(tag('amber','回归用户'));
  if(u.w>1200)t.push(tag('green','高陪伴'));return t.join('');}
function topbar(){const a=DATA.anchor;return `<div class="topbar"><div class="who">
  <div class="avatar">${a.name[0]}</div><div><div class="name">${a.teamName} · ${a.name}</div>
  <div class="meta">${a.date} · 主播专属</div></div></div></div>`;}
const GLOBE=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f6fb0" stroke-width="2" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>`;

function tier(cls,code,name,sub,secs){if(!secs.length)return '';
 const rows=secs.map(s=>{const u=DATA.users[s];return `<div class="urow" data-sec="${s}">
  <div class="avatar" style="background:${colorOf(u.n||s)}">${(u.n||'?')[0]}</div>
  <div class="u-nick">${u.n||''}</div>${rowTags(u)}<div class="u-val">${yuan(u.tv)}</div></div>`;}).join('');
 const foot=secs.length>5?`<div class="t-foot"><span class="tf exp" data-act="expand">查看全部 ${secs.length} 人 ▾</span></div>`:'';
 return `<div class="tier ${cls} closed"><div class="t-head"><div class="t-ico">${code}</div>
  <div><div class="t-name">${name}</div><div class="t-sub">${sub}</div></div>
  <div class="t-cnt">${secs.length}<small> 人</small></div></div><div class="trows">${rows}</div>${foot}</div>`;}
function churnCard(s,cls,lab){const u=DATA.users[s];return `<div class="churn-card ${cls}" data-sec="${s}">
  <div class="cc-nick">${u.n}</div><div class="cc-gap">${daysBetween(u.last,DATA.anchor.date)}天</div>
  <div class="cc-lab">${lab}</div><div class="cc-val">给我 ${yuan(u.sv)}</div></div>`;}
function greetBlock(){const g=DATA.greet;if(!g||!g.length)return '';
 const rows=g.map(s=>{const u=DATA.users[s];return `<div class="urow" data-sec="${s}">
  <div class="avatar" style="background:${colorOf(u.n||s)}">${(u.n||'?')[0]}</div>
  <div class="u-nick">${u.n||''}</div>${gradeTag(u)}<div class="u-val">给我 ${yuan(u.sv)}</div></div>`;}).join('');
 const foot=g.length>5?`<div class="t-foot"><span class="tf exp" data-act="expand">查看全部 ${g.length} 人 ▾</span></div>`:'';
 return `<div class="tier closed"><div class="t-head"><div class="t-ico" style="background:var(--amber-bg);color:var(--amber)">★</div>
  <div><div class="t-name">主动问候</div><div class="t-sub">S/A/B 级本场没刷 · 也要维系</div></div>
  <div class="t-cnt">${g.length}<small> 人</small></div></div><div class="trows">${rows}</div>${foot}</div>`;}
const RETURNICO=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8930c" stroke-width="2" style="flex:none"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;
function returnedBanner(){const r=DATA.returned;if(!r||!r.length)return '';
 const names=r.slice(0,5).map(s=>DATA.users[s].n).join('、');
 return `<div class="cross" style="border-left:4px solid var(--amber)">${RETURNICO}
  <div class="c-txt"><b>${r.length} 位「已流失」老客今天回来给你刷礼物了</b>（${names}${r.length>5?' 等':''}），已标记<b>回归</b>，重点走心接待、给足独宠感。</div></div>`;}
function viewToday(){const c=DATA.counts,ch=DATA.churn;
 const cross=DATA.crossToday.length?`<div class="cross">${GLOBE}
  <div class="c-txt">今天有 <b>${DATA.crossToday.length} 位跨团用户</b>给你送礼，也在其他团消费，注意客情；<b>不显示对方归属</b>。</div></div>`:'';
 let churn='';const tot=ch.a.length+ch.b.length+ch.c.length;
 if(tot)churn=`<div class="sec-title"><h3>该唤醒了</h3><span class="more">今天没来 · 共${tot}人</span></div>
  <div class="churn-row">${ch.a.slice(0,2).map(s=>churnCard(s,'ca','高价值流失')).join('')}
  ${ch.b.slice(0,2).map(s=>churnCard(s,'cb','老客流失')).join('')}
  ${ch.c.slice(0,1).map(s=>churnCard(s,'cc2','长尾')).join('')}</div>`;
 return `<div class="view show" id="v-today">${topbar()}<div class="wrap">
  <div class="sec-title"><h3>今日维护</h3><span class="more">按对我消费分层</span></div>${cross}${returnedBanner()}
  ${tier('l3','L3','重点维护','消费 > 99 元 · 今天必聊',DATA.l3)}
  ${tier('l2','L2','完成拉群','消费 9.9–99 元',DATA.l2)}
  ${tier('l1','L1','口头感谢','消费 < 9.9 元',DATA.l1)}${greetBlock()}${churn}</div></div>`;}
function viewSearch(){return `<div class="view" id="v-search">${topbar()}<div class="wrap">
  <div class="sbar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a97a5" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input id="q" type="search" placeholder="搜索昵称，查看用户情况" autocomplete="off"></div>
  <div id="sresult"></div></div></div>`;}
function renderSearch(q){const box=document.getElementById('sresult');if(!box)return;
 q=(q||'').trim().toLowerCase();
 let list=Object.keys(DATA.users).filter(s=>!q||(DATA.users[s].n||'').toLowerCase().includes(q));
 list.sort((a,b)=>DATA.users[b].sv-DATA.users[a].sv);
 if(!list.length){box.innerHTML=`<div class="empty">没有找到相关用户<br>只能查到给你刷过礼物的用户</div>`;return;}
 box.innerHTML=`<div class="slist">${list.slice(0,60).map(s=>{const u=DATA.users[s];return `<div class="srow" data-sec="${s}">
  <div class="avatar" style="background:${colorOf(u.n||s)};width:36px;height:36px;font-size:14px">${(u.n||'?')[0]}</div>
  <div class="s-nick">${u.n} ${rowTags(u)}</div>
  <div class="s-sub">${u.ch?churnLab(u.ch):(u.tv?('今天'+yuan(u.tv)):'')}</div></div>`;}).join('')}</div>
  ${list.length>60?'<div class="empty">仅显示前 60 人，请细化关键词</div>':''}`;}
function viewMe(){const a=DATA.anchor,c=DATA.counts,total=Object.keys(DATA.users).length;
 return `<div class="view" id="v-me">${topbar()}<div class="wrap"><div class="sec-title"><h3>我的</h3></div>

function pvNote(sec){const v=localStorage.getItem('note_'+sec);
 return v?`<div class="advice" style="background:var(--gray-bg)"><div class="at" style="color:var(--ink2)">我的备注（仅本手机）</div><p style="color:var(--ink2)">${v.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</p></div>`:'';}
function viewProfile(sec){const u=DATA.users[sec];if(!u)return '';
 const gap=u.last?daysBetween(u.last,DATA.anchor.date):'';
 let tags=[gradeTag(u)];if(u.nf)tags.push(tag('red','新客'));
 if(u.cr)tags.push(u.mine?tag('green','跨团·归我'):tag('blue','跨团'));
 if(u.ret)tags.push(tag('amber','回归用户'));
 if(u.w>1200)tags.push(tag('green','高陪伴'));if(u.ch)tags.push(tag(u.ch==='A'?'red':u.ch==='B'?'amber':'gray',churnLab(u.ch)));
 const info=[u.gr&&('荣耀'+u.gr),u.l,u.g&&(u.g===1?'男':'女'),u.a&&(u.a+'岁')].filter(x=>x).join(' · ');

  <div class="cell"><div class="num">${(u.last||'—').slice(5)}</div><div class="lab">上次来</div></div>
  <div class="cell"><div class="num">${u.cnt}<small>场</small></div><div class="lab">给我到场</div></div>
  <div class="cell"><div class="num">${u.w?Math.round(u.w/60):0}<small>分</small></div><div class="lab">今日观看</div></div>
  </div>

  ?(u.cr
    ?`<div class="own" style="color:var(--green)"><span class="tag t-green"><span class="dot"></span>跨团·归我</span><span>也在别家消费，但主归属是<b>我</b>，可私信</span></div>`
    :`<div class="own"><span class="tag t-green"><span class="dot"></span>自己人</span><span>主归属：<b>我</b></span></div>`)
  :`<div class="own" style="color:var(--blue)"><span class="tag t-blue"><span class="dot"></span>跨团用户</span><span>主归属在<b>别家</b>，不可跳转主页</span></div>`}
  <div class="pv-spacer"></div>

  ?`<button class="btn btn-primary" data-act="dm">私信</button>`
  :`<button class="btn btn-ghost" disabled style="opacity:.5;cursor:not-allowed">归属别家</button>`}

function switchTab(t){['today','search','me'].forEach(x=>{const v=document.getElementById('v-'+x);if(v)v.classList.toggle('show',x===t);});
 document.querySelectorAll('.tabbar .tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 if(t==='search'){const q=document.getElementById('q');if(q){q.focus();renderSearch(q.value);}}}
function render(){root.innerHTML=viewToday()+viewSearch()+viewMe();switchTab('today');}
function openProfile(sec){closeProfile();root.insertAdjacentHTML('beforeend',viewProfile(sec));}
function closeProfile(){const pv=document.getElementById('pv');if(pv)pv.remove();}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';
 t.style.transform='translateX(-50%) translateY(0)';clearTimeout(tt);
 tt=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(16px)';},1900);}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
 document.body.appendChild(ta);ta.focus();ta.select();let ok=1;try{ok=document.execCommand('copy');}catch(e){ok=0;}ta.remove();return ok;}
function copyText(t){try{fallbackCopy(t);}catch(e){}
 if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(t).catch(()=>{});}catch(e){}}
 return Promise.resolve();}
function openNoteEditor(sec){
 const pv=document.getElementById('pv');if(!pv||pv.querySelector('#noteEdit'))return;
 const box=document.createElement('div');box.id='noteEdit';box.style.cssText='margin:12px 0 0';
 box.innerHTML=`<textarea id="noteTA" rows="3" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;resize:none;outline:none"></textarea>
  <div style="display:flex;gap:9px;margin-top:8px">

  <button id="noteSave" class="btn btn-primary" style="flex:1">保存</button></div>`;
 pv.querySelector('.act').before(box);
 const ta=box.querySelector('#noteTA');const oldv=localStorage.getItem('note_'+sec);ta.value=oldv||'';
 box.querySelector('#noteDel').style.display=oldv?'':'none';
 setTimeout(()=>{try{ta.focus();}catch(e){}},60);
 box.querySelector('#noteCancel').onclick=()=>box.remove();
 box.querySelector('#noteDel').onclick=()=>{localStorage.removeItem('note_'+sec);closeProfile();openProfile(sec);};
 box.querySelector('#noteSave').onclick=()=>{const v=ta.value;if(v.trim())localStorage.setItem('note_'+sec,v);else localStorage.removeItem('note_'+sec);closeProfile();openProfile(sec);};}
/* ============ 主播回传（上云） ============ */
const FB_URL='https://fb.menghualu.com.co/api/feedback';
function escapeHtml(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function bindChipGroup(box,multi){
 box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  if(multi)c.classList.toggle('on');
  else{box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');}});}
function getChipVals(box){return [...box.querySelectorAll('.chip.on')].map(x=>x.dataset.v);}
function closeSheet(){const s=document.getElementById('sheet');if(s)s.remove();}
function openSheet(title,inner){
 closeSheet();
 const s=document.createElement('div');s.id='sheet';s.className='sheet';
 s.innerHTML=`<div class="sheet-card">
  <div class="sheet-head"><span class="sheet-title">${title}</span><span class="sheet-x" id="sheetX">×</span></div>
  <div class="sheet-body">${inner}</div>
  <div class="sheet-foot"><button class="btn btn-ghost" id="sheetCancel" style="flex:1">取消</button>
  <button class="btn btn-primary" id="sheetSubmit" style="flex:2">提交回传</button></div></div>`;
 document.getElementById('phone').appendChild(s);
 requestAnimationFrame(()=>s.classList.add('show'));
 s.querySelector('#sheetX').onclick=closeSheet;
 s.querySelector('#sheetCancel').onclick=closeSheet;
 s.addEventListener('click',e=>{if(e.target===s)closeSheet();});
 return s;}
function openFeedbackSheet(sec){
 const u=DATA.users[sec];const localNote=localStorage.getItem('note_'+sec)||'';
 const s=openSheet(`回传 · ${u.n}`,
  `<div class="field"><label>维护动作（可多选）</label>
   <div class="chips" id="fbActions">
    <span class="chip" data-v="已私信">已私信</span>
    <span class="chip" data-v="对方已回复">对方已回复</span>
    <span class="chip" data-v="已拉群">已拉群</span>
    <span class="chip" data-v="已互关">已互关</span></div></div>
  <div class="field"><label>等级建议（对标运营 SABCD）</label>
   <div class="chips" id="fbGrade">
    <span class="chip gS" data-v="S">S</span><span class="chip gA" data-v="A">A</span>
    <span class="chip gB" data-v="B">B</span><span class="chip gC" data-v="C">C</span>
    <span class="chip gD" data-v="D">D</span></div></div>
  <div class="field"><label>客情备注（主要填写区）</label>
   <textarea id="fbNote" rows="3" placeholder="聊到的近况、关系进展…">${escapeHtml(localNote)}</textarea></div>
  <div class="fb-more">
   <div class="fb-more-toggle" id="fbMoreToggle">更多信息：联系方式 / 诉求 / 生日　▾</div>
   <div class="fb-more-body" id="fbMoreBody" style="display:none">
    <div class="field"><label>联系方式（微信/手机）</label>
     <input id="fbContact" type="text" placeholder="选填，对方愿意给的联系方式"></div>
    <div class="field"><label>用户诉求</label>
     <textarea id="fbDemand" rows="2" placeholder="对方想要什么、有什么问题"></textarea></div>
    <div class="field"><label>生日</label><input id="fbBirth" type="date"></div>
   </div></div>
  <div class="fb-hint">回传后运营可见；等级只作建议，不会覆盖运营评定。</div>`);
 bindChipGroup(s.querySelector('#fbActions'),true);
 bindChipGroup(s.querySelector('#fbGrade'),false);
 s.querySelector('#fbMoreToggle').onclick=()=>{
   const body=s.querySelector('#fbMoreBody');const hide=body.style.display!=='none';
   body.style.display=hide?'none':'block';
   s.querySelector('#fbMoreToggle').textContent=hide?'更多信息：联系方式 / 诉求 / 生日　▾':'收起　▴';
   if(!hide){const sc=document.getElementById('sheet');if(sc)sc.querySelector('.sheet-card').scrollTop=0;}
 };
 s.querySelector('#sheetSubmit').onclick=()=>{
  const actions=getChipVals(s.querySelector('#fbActions'));
  const grade=getChipVals(s.querySelector('#fbGrade'))[0]||'';
  const note=s.querySelector('#fbNote').value.trim();
  const contact=s.querySelector('#fbContact').value.trim();
  const demand=s.querySelector('#fbDemand').value.trim();
  const birthday=s.querySelector('#fbBirth').value;
  if(!actions.length&&!note&&!contact&&!demand&&!birthday&&!grade){toast('请至少填写一项');return;}
  const body={token:storedToken(),sec,room_id:DATA.anchor.room_id||'',kind:'日常维护',actions,grade,note,contact,demand,birthday};
  doSubmit(body,()=>{if(note)localStorage.setItem('note_'+sec,note);closeSheet();});};}
function openCorrectSheet(sec){
 const u=DATA.users[sec];
 const s=openSheet(`归属纠错 · ${u.n}`,
  `<div class="field"><label>归属异议</label>
   <textarea id="fbAppeal" rows="3" placeholder="如认为该用户主归属应是你/某位团员，说明理由与依据"></textarea></div>
  <div class="fb-hint">提交后运营会核对，不会自动改归属。</div>
  <div class="field"><label>提名为本场大哥</label>
   <textarea id="fbNominate" rows="2" placeholder="如该用户本场贡献大但未被识别，说明情况"></textarea></div>`);
 s.querySelector('#sheetSubmit').onclick=()=>{
  const appeal=s.querySelector('#fbAppeal').value.trim();
  const nom=s.querySelector('#fbNominate').value.trim();
  if(!appeal&&!nom){toast('请至少填写一项');return;}
  if(appeal)doSubmit({token:storedToken(),sec,room_id:DATA.anchor.room_id||'',kind:'归属异议',appeal},()=>{});
  if(nom)doSubmit({token:storedToken(),sec,room_id:DATA.anchor.room_id||'',kind:'提名大哥',appeal:nom},()=>{});
  closeSheet();};}
function doSubmit(body,ok){
 body.sub_id=storedToken()+'_'+(body.sec||'all')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
 const btn=document.getElementById('sheetSubmit');if(btn){btn.disabled=true;btn.textContent='提交中…';}
 submitToWorker(body).then(()=>{try{ok();}catch(e){}toast('已回传，运营可见');})
 .catch(()=>{enqueueOffline(body);try{ok();}catch(e){}toast('已保存，联网后自动上传');});}
async function submitToWorker(body){
 const r=await fetch(FB_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let d={};try{d=await r.json();}catch(e){}
 if(!r.ok)throw new Error(d.error||'fail');
 return d;}
function loadQueue(){try{return JSON.parse(localStorage.getItem('fb_queue')||'[]');}catch(e){return[]}}
function saveQueue(q){localStorage.setItem('fb_queue',JSON.stringify(q))}
function enqueueOffline(b){const q=loadQueue();q.push(b);saveQueue(q)}
async function flushQueue(){
 const q=loadQueue();if(!q.length)return;const remain=[];
 for(const b of q){try{await submitToWorker(b);}catch(e){remain.push(b);}}
 saveQueue(remain);
 if(q.length!==remain.length)toast('已同步 '+(q.length-remain.length)+' 条回传');}
window.addEventListener('online',flushQueue);
window.addEventListener('load',flushQueue);
document.addEventListener('click',e=>{
 if(e.target.closest('#noteEdit'))return;
 if(e.target.closest('#sheet'))return;
 if(e.target.closest('[data-back]')){closeProfile();return;}
 const ac=e.target.closest('[data-act]');
 const se=e.target.closest('[data-sec]');
 const tb=e.target.closest('.tabbar .tb');
 if(ac){const act=ac.dataset.act;
 if(act==='logout'){localStorage.removeItem('anchor_token');location.reload();return;}
 if(act==='expand'){const tEl=ac.closest('.tier');const closed=tEl.classList.toggle('closed');
  ac.textContent=closed?ac.textContent.replace('收起','查看全部').replace('▴','▾'):ac.textContent.replace('查看全部','收起').replace('▾','▴');return;}
 const pv=document.getElementById('pv');if(!pv)return;const k=pv.dataset.sec;
 if(act==='dm'){const u=DATA.users[k];
  if(!u||!u.mine){toast('主归属在别家，不可跳转 TA 主页');return;}
  window.location.href='https://www.douyin.com/user/'+k;return;}
 if(act==='feedback'){openFeedbackSheet(k);return;}
 if(act==='correct'){openCorrectSheet(k);return;}
 if(act==='note'){openNoteEditor(k);return;}
 return;}
 if(se){openProfile(se.dataset.sec);return;}
 if(tb){switchTab(tb.dataset.tab);return;}
});
document.addEventListener('input',e=>{if(e.target.id==='q')renderSearch(e.target.value);});
const TABBAR=`<div class="tabbar">
 <button class="tb on" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>今日</button>
 <button class="tb" data-tab="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>查用户</button>
 <button class="tb" data-tab="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>我的</button></div>`;
function storedToken(){return localStorage.getItem('anchor_token')||'';}
function showLogin(err){
 root.innerHTML=`<div class="login-wrap"><div class="login-card">
  <div class="login-logo">播</div>
  <div class="login-title">主播画像助手</div>
  <div class="login-sub">请输入发给你的访问码</div>
  <input id="loginCode" class="login-input" type="text" autocapitalize="off" autocomplete="off" placeholder="粘贴访问码">
  <button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:8px">进入</button>
  <div id="loginErr" class="login-err">${err||''}</div></div></div>`;
 const code=document.getElementById('loginCode'),btn=document.getElementById('loginBtn');
 const go=()=>{const v=(code.value||'').trim().toLowerCase();
   if(!v){document.getElementById('loginErr').textContent='请输入访问码';return;}
   localStorage.setItem('anchor_token',v);loadData(v);};
 btn.onclick=go;code.onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>code.focus(),60);}
function loadData(tok){
 fetch(`data/${tok}.json`).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{DATA=d;
  document.title='画像·'+d.anchor.name;root.insertAdjacentHTML('afterend',TABBAR);render();})
 .catch(()=>{localStorage.removeItem('anchor_token');
   showLogin('访问码无效或已失效，请重新输入或找运营补发');});
 setupSW();}
function setupSW(){
 if(!('serviceWorker' in navigator))return;
 let refreshing=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
   if(refreshing)return;refreshing=true;location.reload();});
 navigator.serviceWorker.register('sw.js').then(reg=>{
   const check=()=>{try{reg.update();}catch(e){}
     fetch('app.html?cv='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
       const m=t.match(/APP_VERSION='(v\d+)'/);
       if(m&&m[1]!==APP_VERSION)showUpdateBar();}).catch(()=>{});};
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
   setInterval(check,20*60*1000);}).catch(()=>{});}
let _updateBar;
function showUpdateBar(){
 if(_updateBar)return;
 _updateBar=document.createElement('div');
 _updateBar.style.cssText='position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:90;background:var(--brand);color:#fff;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.22);cursor:pointer';
 _updateBar.textContent='发现新版本，点击更新';
 _updateBar.onclick=()=>location.reload();
 document.getElementById('phone').appendChild(_updateBar);}
function boot(){
 const urlT=new URLSearchParams(location.search).get('t');
 if(urlT){localStorage.setItem('anchor_token',urlT);
   history.replaceState({},'',location.pathname);}
 const tok=storedToken();
 if(!tok){showLogin();return;}
 loadData(tok);}
boot();
</script>
